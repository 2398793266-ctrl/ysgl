<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艺术概论知识点 · 教材原文背诵（离线版）</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16191d;--ink2:#4a5361;--ink3:#8b939d;
  --line:#e3e6ea;--line2:#eef0f3;--accent:#1f6feb;--accent-soft:#e9f0fd;
  --A:#16a34a;--B:#2563eb;--C:#d97706;--D:#dc2626;--E:#7c3aed;--F:#0891b2;
  --read:15.5px;--radius:8px;
  --mg:#0e7490;--pg:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1280px;margin:0 auto;padding:8px 14px 0}
.hd-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:750;font-size:15px;white-space:nowrap}
.brand small{color:var(--ink3);font-weight:500;font-size:11.5px;margin-left:6px}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;padding:7px 28px 7px 29px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px;font-family:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search::before{content:"⌕";position:absolute;left:9px;top:4px;color:var(--ink3);font-size:16px}
.search .clr{position:absolute;right:5px;top:3px;border:0;background:none;color:var(--ink3);cursor:pointer;font-size:14px;padding:2px 5px}
.pbar{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.pbar .mini{width:60px;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar .mini>i{display:block;height:100%;background:var(--A)}
nav{display:flex;gap:1px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;font-size:13.5px;color:var(--ink2);padding:8px 15px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding-top:16px}
h1{font-size:19px;margin:2px 0 4px}
h2{font-size:15.5px;margin:22px 0 9px;padding-left:9px;border-left:3px solid var(--accent)}
.sub{color:var(--ink3);font-size:12.5px;margin-bottom:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:13px 15px}
.tag{display:inline-flex;font-size:11px;font-weight:750;padding:1px 6px;border-radius:4px;color:#fff;line-height:1.6;white-space:nowrap}
.tA{background:var(--A)}.tB{background:var(--B)}.tC{background:var(--C)}.tD{background:var(--D)}.tE{background:var(--E)}.tF{background:var(--F)}
.btn{display:inline-block;font-size:12.6px;padding:5px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer;font-weight:600}
.btn:hover{background:#fafbfc;border-color:#cbd3dc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dg{border-color:#f0c8c8;color:var(--D)}
.btn.sm{font-size:11.8px;padding:3px 9px}
.chip{display:inline-block;font-size:12.2px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:650}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
mark{background:#fff3bf;border-radius:2px}

/* 双栏 */
.study{display:grid;grid-template-columns:352px 1fr;gap:12px;align-items:start}
@media(max-width:900px){.study{grid-template-columns:1fr}.study.hideList .toc{display:none}.study:not(.hideList) .detail{display:none}}
.toc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);max-height:calc(100vh - 158px);overflow:auto;position:sticky;top:104px}
.toc .bar1{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;display:flex;gap:6px;align-items:center;font-size:11.6px;color:var(--ink3)}
.bk{font-size:11.5px;font-weight:750;padding:5px 12px;color:#fff;background:var(--mg);letter-spacing:.4px;position:sticky;top:34px;z-index:2}
.bk.p{background:var(--pg)}
.grp{font-size:11px;font-weight:700;color:var(--ink3);padding:6px 12px 2px;background:#fafbfc}
.n{display:flex;align-items:flex-start;gap:5px;padding:5px 10px 5px 6px;cursor:pointer;border-left:3px solid transparent;font-size:13px}
.n:hover{background:#f6f8fb}
.n.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:650}
.n .ar{width:13px;flex:none;color:var(--ink3);font-size:10px;line-height:1.9;text-align:center}
.n .ar.leaf{visibility:hidden}
.n .tx{flex:1;min-width:0}
.n .tx .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n .tx .mm{font-size:10.6px;color:var(--ink3);margin-top:0}
.n .ok{color:var(--A);font-size:11px;flex:none}
.n.lv1{font-weight:650}
.n.lv2{font-weight:600}
.n.lv3{color:var(--ink2)}
.n.lv4{font-size:12.6px;color:var(--ink2)}
.detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-height:320px}
.dh{padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
.dh .path{font-size:11.6px;color:var(--ink3);margin-bottom:5px;line-height:1.6}
.dh .t{font-size:17.5px;font-weight:750;line-height:1.45}
.dh .m{font-size:11.6px;color:var(--ink3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pgno{font-size:11.4px;color:#0e6b7d;background:#ddf2f6;border-radius:4px;padding:1px 7px;font-weight:650}
.dbody{padding:14px 18px 18px}
.origin{font-size:var(--read);line-height:2.05;color:#191d22;white-space:pre-wrap;word-break:break-word;font-family:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif}
.kids{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.kids .kt{font-size:11.4px;font-weight:750;color:var(--accent);margin-bottom:7px;letter-spacing:.4px}
.kid{display:block;width:100%;text-align:left;border:0;background:#f8f9fb;border-radius:6px;padding:7px 11px;margin-bottom:5px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
.kid:hover{background:var(--accent-soft);color:var(--accent)}
.kid .c{float:right;color:var(--ink3);font-size:11px}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:11px;margin-top:14px}
.empty{padding:34px;text-align:center;color:var(--ink3);font-size:13px}
.sp{margin-left:auto}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 对照 */
.row{display:flex;gap:8px;align-items:baseline;padding:7px 11px;border-bottom:1px solid var(--line2);font-size:13.2px;cursor:pointer}
.row:hover{background:#f8f9fb}
.row .nm{font-weight:600;flex:1;min-width:0}
.row .bk2{font-size:11px;color:var(--ink3);white-space:nowrap}
.row .hint{font-size:11.8px;color:var(--ink3);flex:1.2}
.gbox{margin-bottom:22px}
.gtitle{font-size:14.5px;font-weight:750;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.gdesc{font-size:12.3px;color:var(--ink3);margin-bottom:8px}

/* 背诵 */
.face{max-width:880px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 26px;min-height:200px}
.face .qm{font-size:11.6px;color:var(--ink3);margin-bottom:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.face .q{font-size:20px;font-weight:750;line-height:1.5}
.face .qp{font-size:12px;color:var(--ink3);margin-top:6px}
.face .a{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;max-height:52vh;overflow:auto}
.gr{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.gb{font-size:13.2px;padding:8px 20px;border-radius:8px;border:1px solid;font-weight:700;cursor:pointer;background:#fff}
.gb1{border-color:#f0c8c8;color:var(--D)}.gb2{border-color:#f0dfb8;color:#a26a00}.gb3{border-color:#bfe3c6;color:var(--A)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink2);background:#fafbfc}
.prog{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}
.prog>i{display:block;height:100%}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px}
.kpi .v{font-size:21px;font-weight:750;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13.2px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2)}
th{font-size:12px;color:var(--ink3);font-weight:650;background:#fbfcfd}
.num{font-variant-numeric:tabular-nums;text-align:right}
.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:11.8px;color:var(--ink3);line-height:1.9}
code{background:#f1f3f6;padding:1px 4px;border-radius:3px;font-size:12px}
.warn{background:#fff6f6;border:1px solid #f6d9d9;border-radius:7px;padding:9px 12px;font-size:12.6px;color:#8a2b2b;line-height:1.85}
.mobonly{display:none}
@media(max-width:900px){.mobonly{display:inline-block;margin-bottom:8px}}
</style>
</head>

现实的“模仿”。肯定了现实世界的真实性，从而","也就肯定了“模仿”现实的艺术的真实性。","<2> 艺术模仿本质和规律：艺术所“模仿”的不只是现实世界的外形或形象，而且是","现实世界内在的本质和规律。","<3> 艺术比现实更真实：认为诗人和画家不应当“照事物本来的样子去模仿”，而是","应当“照事物的应当有的样子去模仿”，表现出事物的本质特征，使得艺术甚至比它所“模","仿”的现实世界更加真实。","","","","","<4> 影响 ： 从中世纪、 文艺复兴直到十七八世纪， 一直为欧洲许多美学家、 艺术家所信奉。","朱光潜语，在西方“雄霸了两千余年”","（2）车尔尼雪夫斯基","<1> 艺术反映现实：认为 “美是生活” ， 艺术是对生活的 “再现” ， 是对客观现实的 “再","现”。","<2> 社会内容：现实生活，不仅包括客观存在的自然界，而且包括人们的社会生活，","从而更加具有深刻的社会内容。","<3>“美是生活”：“任何事物，我们在那里面看得见依照我们的理解应当如此的生活，","那就是美的；任何东西，凡是显示出生活或使我们想起生活的，那就是美的”","<4> 局限：过分抬高现实美，贬低艺术美。认为艺术只是生活的替代品，自身缺少内在","的价值，显示出机械唯物主义的偏见。","除以上几种主要观点外，中外艺术史上还有“形象说” “情感说” “表现说” “形式说”","等多种颇有影响的说法。","二 艺术本质问题的科学理论基础","社会生产的概念 ： 人类社会生活从总体上可以划分为物质生活与精神生活两大组成部分。","艺术生产作为一种特殊的精神生产，则是为了满足人们的审美需要，它的成果构成了人类光","辉灿烂的艺术文化宝库。","艺术生产的理论意义：","将“艺术”与“生产”联系起来考虑，从生产实践活动出发来考察艺术问题，把艺术看","作是一种特殊的精神生产，这在美学史和艺术史上是一个前所未有的创举。对于揭示艺术的","起源和艺术的发展，揭示艺术的性质和艺术的特点，以及揭示艺术创作、艺术作品、艺术鉴","赏这样个完整的艺术系统的奥秘，都提供了科学的理论依据。","“艺术生产”理论给艺术学研究提供的启示：","第一，艺术生产理论揭示了艺术的起源、性质和特点。","①起源：艺术生产本身是经历了一个漫长的历史过程才从物质生产中分化出来的。归根","结底，艺术的起源离不开人类的社会实践活动。","②性质和特点：艺术生产作为一种特殊的精神生产，是一种自由自觉的创造性劳动。艺","","","","","术一方面是对客观社会的反映，另一方面又凝聚着艺术家主观的审美理想和情感愿望，艺术","是心与物、主观与客观、再现与表现的结合。","③澄清了在艺术本质问题上许多片面的观点和认识。 “主观精神说” 、 “模仿说” 或 “再","现说”。","第二，艺术生产理论阐明了两种生产的“不平衡关系”。","①艺术发展不能脱离一定时代的物质生产条件。一定时代艺术的发展，是在一定的经济","基础上形成的。","②艺术生产作为一种特殊的精神生产，具有相对的独立性。在社会发展历史的某些阶段","上，艺术的繁荣与社会物质生产的发展呈现出某种不平衡现象，例如，古希腊艺术、 19 世","纪的俄国。19 世纪的俄国经济远远落后于西欧国家，但艺术领域呈现出空前繁荣的局面：","戏剧—果戈里、契诃夫；音乐—柴可夫斯基、“强力集团”；美术—巡回展览画派；舞蹈—","《天鹅湖》、《睡美人》大型古典芭蕾舞剧。","③两种生产不平衡的现象与艺术生产必然受到物质生产的制约并不矛盾。是个别、特殊","现象与一般普遍规律的关系。从最根本的原因上讲，两种生产不平衡有其深刻的经济、政治","根源。如 19 世纪俄国，反对沙皇政府封建主义专制统治斗争，新的生产力要求打破旧的生","产关系为艺术发展提供强大推动力。","艺术生产理论揭示了艺术系统的奥秘。","艺术生产理论把艺术创作——艺术作品——艺术鉴赏这三个相互联系的环节，作为一个","完整的系统来研究， 从而揭示出艺术作品与欣赏者、 对象与主体、 生产与消费之间相互依存、","相互转化的辩证关系。","艺术创作是艺术的“生产阶段”；艺术作品是艺术生产的“产品”；艺术鉴赏是艺术的","“消费阶段”。","艺术系统研究： 19 世纪实证论批评家圣佩韦等人重视对创作者的研究，重视对作家、","艺术家生平的考证，重视对作者经历、传记的描述，侧重于艺术创作这一环节。 20 世纪新","批评派、结构主义等批评家却重视对作品的研究，强调对艺术作品的结构和模式进行深入探","索，尤其重视对叙事作品的语言分析，侧重于艺术作品这一环节。 20 世纪 60 年代末期在德","国诞生、后来迅速在世界各国流传开来的接受美学则重视对欣赏者的研究，认为艺术作品本","身是开放性的，欣赏者总是要以自己的审美心理结构来阅读和欣赏文艺作品，侧重于读者、","","","","","观众、听众这一环节。","艺术生产理论启示我们，应当全面地研究艺术活动的全部过程，把创作——作品——鉴","赏这三个部分作为一个完整的艺术系统来进行综合的研究。只有这样，才能真正揭示出艺术","作为一种特殊的社会意识形态和特殊的精神生产所具有的本质特征。本书下编正是从这三个","部分入手，对艺术进行了系统分析。","第二节  艺术的特征","艺术的本质与艺术的特征二者密不可分。本质是特征的内在规律，特征是本质的外在表","现。艺术作为一种特殊的社会意识形态，艺术生产作为一种特殊的精神生产，决定了艺术必","然具有形象性、主体性、审美性等基本特征。","一 形象性","艺术的基本特征之一是形象性。艺术形象是艺术反映生活的特殊形式。哲学、社会科学","总是以抽象的、概念的形式来反映客观世界，艺术则是以具体的、生动感人的艺术形象来反","映社会生活和表现艺术家的思想情感。","1. 艺术形象是客观与主观的统一","（1）任何艺术作品的形象都是具体的、感性的，也都体现着一定的思想感情，都是客","观因素与主观因素的有机统一。","意大利文艺复兴时期画家达 ·芬奇的《蒙娜·丽莎》，是几个世纪以来人们赞叹而又迷惘","的作品。画中蒙娜 ·丽莎含而不露的笑容显得深不可测，被称为“神秘的微笑”。画家为了","艺术上的追求，从生理学和解剖学的角度深刻分析了人物的面部结构，研究明暗变化。通过","这幅作品，表现文艺复兴时期摆脱了中世纪的宗教束缚和封建统治的人文主义思想，是对人","生和现实的赞美。","（2）中国美学十分重视“传神”。传神的艺术作品，不但反映了对象的本质特征，而","且表现了艺术家对生活、人物的理解。例如五代南唐画家顾闳中的作品《韩熙载夜宴图》，","这幅长卷以“听乐”“赏舞”“休息”“清吹”“散宴”五个连续的画面描绘了韩熙载家宴","","","","","的情况。 尽管画中夜宴的排场很豪华， 气氛很热烈， 但仔细观察画面， 韩熙载始终处于沉思、","压抑的精神状态，流露出忧郁寡欢的表情，反映出内心的矛盾和精神的空虚。","（3） 不同的艺术门类这种客观因素与主观因素的统一， 具有各自不同的特点。 对于雕塑、","绘画等造型艺术来说，表现为主观因素消融在客观形象之中。音乐等艺术门类，间接和曲折","地反映社会生活， 表现为客观因素消溶在主观因素之中。 穆索尔斯基钢琴套曲 《图画展览会》","深入表现作曲家观看图画后的种种的体验和感受。","2. 艺术形象是内容与形式的统一","艺术欣赏中，直接作用于欣赏者感官的是艺术形式，但艺术形式之所以能感动人、影响","人，是由于这种形式生动鲜明地体现出深刻的思想内容。","中外美学史上，对这方面有过许多精辟的论述。罗丹讲过 :“没有一件艺术作品，单靠","线条或色调的匀称，仅仅为了视觉满足的作品，能够打动人的。”刘安的《淮南子》“君形","者亡焉”。顾恺之提出“以形写神”；谢赫“气韵生动”。","罗丹为巴尔扎克创作雕像《巴尔扎克像》摒弃了一切细枝末节，这位大文豪的手和脚都","被掩盖在长袍之中，使观众的注意力集中到头部，尤其是那双炯炯有神、气宇不凡的眼睛，","突出了这位伟大的批判现实主义作家与众不同的气质。这座雕像的成功，就在于内容和形式","的完美统一，真正在形似的基础上达到了神似。","3. 艺术形象是个性与共性的统一","（1）凡是成功的艺术形象，无不具有鲜明而独特的个性，同时又具有丰富而广泛的社","会概括性。","清代金圣叹在赞叹《水浒传》中的人物形象时就曾经说过:“《水浒》所叙，一百八人，","人有其性情，人有其气质，人有其形状，人有其声口。”","黑格尔认为《荷马史诗》中，每一个英雄都是许多性格特征的充满生气的总和，“每个","人都是一个整体，本身就是一个世界，每个人都是一个完满的有生气的人，而不是某种孤立","的性格特征的寓言式的抽象品”。","（2）一切事物都是在带有偶然性的个别现象中，体现出带有必然性的共同本质和规律","来。 鲁迅先生塑造的阿Q 这一艺术形象， 不仅具有活生生的个性， 具有极为深刻的性格内涵，","","","","","而且从一个侧面反映了那个特定的时代并概括出全民族的国民性弱点。","（3）艺术形象的这种个性与共性的统一，最集中地体现为艺术典型。所谓艺术典型，","就是艺术家运用典型化的方法，创造出来的具有栩栩如生的鲜明个性并体现出普遍意义的典","型形象。","艺术典型与艺术形象既有联系，又有区别。从根本上讲，二者都是个性与共性的有机统","一，具有共同的实质。但是，艺术典型比起艺术形象来，又具有更强烈的个性与更广泛的共","性。也就是说，艺术典型更加独特，也更加普遍，它是艺术形象的凝练与升华。典型必定具","有个性鲜明的艺术独创性，而且又能非常深刻地揭示出社会生活的本质和意义。","二 主体性","艺术要用形象来反映社会生活，但这种反映绝不是单纯的“模仿”或“再现”，而是融","入了创作主体乃至欣赏主体的思想情感，体现出十分鲜明的创造性和创新性。因而，主体性","作为艺术的基本特征之一，体现在艺术生产活动的全过程，包括艺术创作、艺术作品和艺术","欣赏。","1. 艺术创作具有主体性的特点","（1）艺术家作为创作主体对艺术创作起着决定性的作用。没有创作主体，艺术作品就","无法产生。","由于艺术生产是一种特殊的精神生产，使得作为生产主体的人能够从中直观自身。","（2）艺术创作的主体性，集中表现为艺术家的创作活动具有能动性和独创性。将自己","强烈的思想、情感、愿望、理想等主观因素“物化”到自己的艺术作品之中，正是艺术创作","的这种能动性，使得艺术成为主观与客观、再现与表现的辩证统一。","2. 艺术作品具有主体性的特点","（1）艺术作品凝聚着艺术家对生活的独到发现和深刻理解，渗透着艺术家独特的审美","体验和审美情感，体现出艺术家鲜明的艺术风格和美学追求。","（2）任何优秀的艺术作品，都应当是独一无二不可重复的，具有艺术的独创性。例如","韩幹画的马，就和赵孟頫画的马截然不同；同样是画竹，北宋著名画家文同和清代著名画家","","","","","郑板桥所画之竹各有情趣。","3. 艺术欣赏具有主体性的特点","（1）由于欣赏者的生活经验与性格气质不同，审美能力和艺术素养不同，在审美感受","上就形成了鲜明的个性差异，使艺术欣赏打上欣赏主体的烙印。“有一千个读者，就有一千","个哈姆雷特”。","（2）在艺术欣赏中，欣赏主体和艺术作品之间是一种相互作用的审美主客体关系。一","方面，艺术作品总是引导着欣赏者向作品所规定的艺术境界运动，另一方面，欣赏主体又总","是按照自己的审美理想和审美感受能力来改造和加工作品中的艺术形象。","（3） 每一个欣赏者都具有特殊条件， 都具有感受的个性， 彼此的反应不可能完全相同。","艺术欣赏中这种主体性的特点，甚至可以使欣赏者实际获得的艺术感受与艺术家原来的创作","意图之间，产生相当大的差距。","综上可知，主体性贯穿于艺术生产活动的全过程，包括艺术创作艺术作品和艺术欣赏，","意味着创造性与创新性。","三 审美性","从艺术生产的角度来看，任何艺术作品都必须具有以下两个条件：其一，它必须是人类","艺术生产的产品；其二，它必须具有审美价值，即审美性。正是这两点，使艺术品和其他一","切非艺术品区分开来。","1. 艺术的审美性是人类审美意识的集中体现","艺术作为人类精神文化的一种特殊形态， 它本身就是审美意识物质形态化了的集中体现。","美的形态分为自然美与艺术美，二者之间的区别在于艺术美直接凝聚着人类劳动和智慧","的结晶。具有审美价值或审美性的人类创造物，才能称为艺术品。","艺术在漫长的历史发展过程中，完成了由实用向审美的过渡，成为人类审美活动的最高","形式。艺术美作为现实的反映形态，是艺术家创造性劳动的产物，比现实生活中的美更加集","中和更加典型，能够更加充分地满足人的审美需要。","艺术又是人类审美意识物质形态化的表现，任何艺术都有自己特殊的物质材料和艺术语","","","","","言，绘画是运用线条色彩，音乐是利用音响。","2. 艺术的审美性是真、善、美的结晶","（1） 艺术美之所以高于现实美， 是由于通过艺术家的创造性劳动， 把现实生活中的真、","善、美凝聚到了艺术作品中。","1、 艺术中的 “真” ， 并不等于生活真实， 而是要通过艺术家的创造性劳动， 通过提炼和加工，","使生活真实升华为艺术真实，也就是化“真”为“美”，通过艺术形象体现出来。","2、艺术中的“善”，也并不是道德说教，同样要通过艺术家的精心创作，使艺术家的","人生态度和道德评价渗透到艺术作品之中，也就是化“善”为“美”，体现为生动感人、有","血有肉的艺术形象。《清明上河图》，就鲜明地体现出艺术中这种真、善、美的统一，取材","于生活真实，反映出北宋首都汴京各阶层人物的生活。为民俗学、建筑学、历史学提供了翔","实的研究资料，以中下层市民的现实生活为题材，直接反映市民的生活理想和审美情趣，运","用了散点透视法，具有极高的艺术水平和审美价值。","（2）艺术的审美性和“丑”的关系。生活中“丑”的东西，经过艺术家的创造性劳动，","同样要通过审美特征在艺术作品中体现出来。生活中的“丑”经过艺术家的能动创造变成了","艺术美。事物本身“丑”的性质并没有变，但是作为艺术形象它已经有了审美意义。","如莫里哀《吝啬鬼》， 《伪君子》，使作品中“丑”的人物形象具有了艺术的审美价值。","莎士比亚《威尼斯商人》《麦克白》都是通过艺术的审美性，使“丑”的人物形象获得了不","朽的艺术魅力。","3. 艺术的审美性是内容美和形式美的统一","艺术美注重形式，但并不脱离内容，它是二者的有机统一。德国 18 世纪著名美学家莱","辛认为 :“在古希腊人看来美是造型艺术的最高法律。”  俄国 19 世纪文艺理论家别林斯基","也同样强调 ： 现实的美只在内容， 而艺术则把它融化在优美的形式里， 因此， 绘画才优于现实。","（1） 每种艺术都有自己特殊的形式美。 形式美的法则并不是凝固不变的， 艺术贵在创新，","随着艺术实践的不断发展，形式美的法则也在不断变化和发展。艺术家们在自己的创作实践","中，不断探索和寻找美的形式，从内容出发去选择最恰当的形式以加强艺术的表现力。","毕达哥拉斯学派的“黄金分割”；古希腊帕提农神庙，造型端庄，比例匀称，被视为古","","","","","希腊神庙的典范。这座神庙独特的柱列，完美的立面比例，反映出古希腊人对建筑形式美的","刻意追求。","1973 年建成了一座闻名于世的悉尼歌剧院。这座历时 15 年耗资上亿美元的建筑，刻意","追求造型美，设计十分独特。它远看像是一支迎风扬帆的船队，近看又像是一组巨大的贝壳","雕塑，也像一朵巨大的白荷花，作为著名的环境艺术或有机建筑的典型作品，与周围的海水","融为一体。成为世界现代建筑的一个瑰宝。","（2）艺术的形式美，不能脱离艺术的内容美，因为艺术的形式美在于它生动鲜明地体","现出内容。刘勰在《文心雕龙》中强调 :“故情者文之经，辞者理之纬；经正而后纬成，理","定而后辞畅，此立文之本源也。”形式应当服从于内容，真正的艺术美不在辞藻的华丽，而","在于确切生动地表现内容。","顾恺之的“以形写神”，要求画家抓住人物的典型特征，表现人物的内在精神。","王维更进一步认为，“凡画山水，意在笔先”，强调画山水草木同画人物一样，也必须","显示出对象的内在精神来。","黑格尔美学的核心是“美是理念的感性显现”，认为艺术美的本质在于感性形式体现出","理性内容。","罗丹认为 :“一幅素描或色彩的总体，要表明一种意义，没有这种意义，便一无美处。”","独特的造型美中也蕴涵着时代的内容。 帕提农神庙鲜明地体现出盛行于古希腊时代的 “美","就是和谐”的美学理想，高贵的单纯和静穆的伟大。","功能：帕提农神庙既是为保护神雅典娜建造的，也是平民百姓欢庆节日的庙宇。它是雅","典的奴隶主民主制度下的产物，集中体现出这个时代和这个民族的社会背景。悉尼歌剧院却","是当代艺术与现代科技相结合的产物。","技术：它的建立标志着在现代工业社会中建筑技术和建筑材料已经达到了很高的水平。","美学追求：设计师丹麦建筑家约翰 ·伍重强调现代建筑应当从属于自然环境，崇尚“有","机建筑” 理论， 认为建筑应与周围环境有机融合在一起， 仿佛是自然而然 “生长” 出来的一样。","","","","","第二章  艺术的起源","第一节 中外艺术史上关于艺术起源的五种观点","一 艺术起源于“模仿”","（1）古希腊哲学家德谟克利特认为艺术是对自然的“模仿”，他说 :“从蜘蛛我们学会","了织布和缝补；从燕子学会了造房子；从天鹅和黄莺等歌唱的鸟学会了唱歌。”","（2）亚里士多德更进一步认为模仿是人的本能。所有的文艺都是“模仿”，只是有三","点差别。由于“模仿所用的媒介不同”，而有不同种类的艺术，如画家和雕塑家是用颜色和","线条来模仿，诗人、戏剧演员和歌唱家则是用声音来模仿。由于模仿“所取的对象不同”，","因而形成了悲剧和喜剧，他认为喜剧总是模仿比我们今天的人坏的人，悲剧总是模仿比我们","今天的人好的人。由于模仿“所用的方式不同”，才出现了史诗、抒情诗和戏剧的差别。","朱光潜一语中的地指出：亚里士多德的“模仿论”，在欧洲“雄霸了两千余年”。","评价：①这种关于艺术起源于“模仿”的理论，具有一定的合理之处。早期的人类艺","术，特别是原始艺术，“模仿”占有相当大的比例。西班牙阿尔塔米拉洞穴都是对现实生活","中动物各种神情姿态的模仿和记录。中国古代认为音乐也是由模仿现实生活中的自然音响而","来，《管子》中讲道：音乐是模仿动物的声音而来的。","这种说法肯定了艺术来源于客观的自然界和社会现实， 其中包含着朴素唯物主义的观点，","具有进步的和合理的内容。","②但是， 这种说法只是触及了事物的表面， 而没有揭示事物的本质。 对于原始艺术来说，","“模仿”更多的是一种手段，而不是目的。正如鲁迅所说 : “他画一只牛，是有缘故的，为","的是关于野牛，或者是猎取野牛，禁咒野牛的事。”","此外，这种说法还把“模仿”归结于人的本性，没有找到“模仿”背后的创作意图，因","此，未能说明艺术产生的根本原因。","","","","","二 艺术起源于“游戏”","含义：这种说法主要是由 18 世纪德国哲学家席勒和 19 世纪英国哲学家斯宾塞提出来的，","后来的艺术史家曾把艺术起源的这种说法称之为“席勒——斯宾 塞理论”。这种理论在 19","世纪末和 20 世纪初曾经被许多人所信奉。","这种说法认为， 艺术活动或审美活动起源于人类所具有的游戏本能， 它表现在两个方面，","一方面是由于人类具有过剩的精力，另一方面是人将这种过剩的精力运用到没有实际效用、","没有功利目的的活动中，体现为一种自由的“游戏”。","内容：席勒在《美育书简》中指出，人的“感性冲动”和“理性冲动”，必须通过“游","戏冲动”才能有机地协调起来。人只有在游戏”时，才能摆脱自然的强迫和理性的强迫，获","得真正的自由，也就是说，只有通过“游戏”，人才能实现物质与精神、感性与理性的和谐","统一。席勒以动物为例来说明“游戏”是与生俱来的本能，人的这种“游戏”本能或冲动，","就是艺术创作的动机。在这种无功利、无目的的自由活动中，人的过剩精力得到了发泄，从","而获得快乐，亦即美的愉快的享受。","斯宾塞强调，“游戏”的主要特征是没有实际的功利目的，它并不是维持生活所必需的","活动过程，而是为了消耗肌体中积聚的过剩精力，并在自由地发泄这种过剩精力时获得快感","和美感。因此，人的审美活动和艺术活动，从实质上来讲，无非也是一种“游戏”，美感就","是从“游戏”中获得发泄过剩精力的愉快。","德国学者谷鲁斯，对这种观点又进行了修改和补充。谷鲁斯认为，“游戏”并不是完全","没有实际的功利目的，而是在轻松愉快的游戏活动中，不知不觉地在为将来的实际生活做准","备或做练习。","评价：①艺术起源于“游戏”的说法中，含有一些有价值的成分。首先，这种说法肯定","了人们只有在满足了衣食住行的基本物质生活需要的条件下， 才可能有过剩的精力来从事 “游","戏”，即艺术活动和审美活动。其次，这种说法将艺术和“游戏”联系在一起，在某种程度","上也揭示出了艺术的部分特殊性。例如，艺术和“游戏”一样，它们与人们实际生活中的物","质需要相距甚远，而是主要为了满足人们的精神需要，都是超功利的。“游戏”是人的生理","需要与心理需要。","②但是，艺术起源于“游戏”的说法，仅仅从生物学或心理学的角度出发，仍然未能揭","示出艺术产生的最终原因。尤其是这种说法把“游戏”看作人和动物共有的本能，更是错误","","","","","的论断，因为艺术活动与审美活动仅仅属于人类社会所专有。事实上，动物的“游戏”可以","归结为过剩精力的发泄，而人的“游戏”则是为了精神需要的满足，二者之间有着严格的区","别。人的“游戏”是以使用工具的物质生产活动为基础，并且具有了超越动物性的情感和想","象等社会内容，成为一种具有符号性的文化活动。艺术起源于“游戏”的说法脱离了人类的","社会实践，所以仍然不能揭开艺术诞生的真正奥秘。","三 艺术起源于“表现”","含义：这种说法在东西方都有着悠久的历史，如汉代的《毛诗序》中就讲到：“情动","于中而形于言，言之不足故嗟叹之，嗟叹之不足故永歌之，永歌之不足，不知手之舞之，","足之蹈之也”。19 世纪后期以来，艺术起源于“表现”的说法，在西方文艺界具有较大的","影响，完全可以说，西方现代主义文艺思潮的主要理论基础，就是强调艺术应当“表现自","我”。","内容：①系统地以理论方式提出这种说法的应当首推意大利美学家克罗齐。他的美学思","想的核心是“直觉即表现”，从这一美学思想出发，克罗齐认为艺术的本质是直觉，直觉","的来源是情感，直觉即表现，因而，艺术归根结底是情感的表现。","克罗齐还认为，表现作为心灵过程是在心灵中完成的，真正的艺术活动只能在艺术家的","心灵中完成，艺术家没有传达他心灵中作品的必要。","他强调，艺术既不是功利的活动，也不是道德的活动，艺术甚至也不能分类。因为在","他看来，一切艺术无非都是情感的表现而已。","②英国史学家科林伍德对克罗齐的“表现说”作了进一步的详尽发挥。科林伍德认为，","艺术不是再现和模仿，更不是单纯的游戏，巫术虽然与艺术关系密切，但巫术实质上是达","到预定目的的手段，“巫术的目的总是而且仅仅是激发某种情感”。科林伍德认为，只有","表现情感的艺术才是所谓“真正的艺术”，艺术就是艺术家的主观想象和情感的表现。","渊源：俄国著名作家列夫·托尔斯泰就认为艺术起源于传达感情的需要。他说 :“一个","人为了要把自己体验过的感情传达给别人，于是在自己心里重新唤起这种感情，并用某种","外在的标志把它表达出来…这就是艺术的起源。”","美国当代美学家苏珊·朗格从符号学美学出发，进一步认为艺术是人类情感的符号形式","的创造，艺术品就是人类情感的表现性形式。朗格认为，只有人才能制造符号和使用符","号，从原始民族的仪式到文明社会的艺术，无非都是人所制造和使用的符号，只不过艺术","符号不","","","","","同于其他任何符号，因为艺术是人类情感的符号。她认为，艺术是情感的表现，艺术活动的","实质就在于创造表现人类情感的符号形式。","评价：艺术确实要表现情感，艺术家确实是通过自己的作品向他人、向社会表现自己的","思想和情感。但是，把艺术的起源归结为“表现”，脱离开人类的社会实践，脱离原始社会","生产力低下的实际情况，仍然是把现象当作本质，把结果当作原因，同样不能科学地阐明艺","术的起源问题。","四  艺术起源于“巫术”","（1）20 世纪以来，艺术起源于“巫术”的理论，在西方学术界越来越受到欢迎，至今","仍然占据优势，成为西方在艺术起源问题上影响最大的一种理论。","在 19 世纪末、20 世纪初，艺术起源于“巫术”的理论逐渐兴起，人类学家爱德华·泰勒","在他的《原始文化》一书中，最早提出艺术起源于“巫术”的理论主张。他认为，原始人思","维的最主要特点是万物有灵。并且都可以与人交感。在考古学中也发现，许多史前洞穴中的","动物遗骨，都被堆放得整整齐齐、叠置有序，这样的精心堆放，意味着原始人对自己猎食的","动物怀有敬畏之情，通过这样的仪式，在食完兽肉后，对野兽之灵表示惋惜和敬意。","英国著名人类学家弗雷泽在他的名著《","金枝》一书中，更是认为原始部落的一切风俗仪","式和信仰，都起源于交感巫术。弗雷泽认为，人类最早是想用巫术去控制神秘的自然界。","（2）考古发现，早期的造型艺术确实与巫术有关。我国现存最早的岩画，是江苏省连","云港市郊锦屏山的将军崖岩画。新石器时期，在近十个人面像中，基本上都有一条线向下通","到禾苗、谷穗等农作物的图案上，中间杂以许多似为计数的圆点符号，反映出我国古代先民","对土地的崇拜和依赖。欧洲发现的大量史前洞穴壁画，则体现出狩猎部落的生活，往往也具","有某种神秘的巫术目的。尤其是某些洞穴中的壁画，考古学家们发现曾先后被原始人画过三","次之多。","（3）原始歌舞与巫术也有着密切的联系。 托马斯·门罗在 《艺术的发展及其他文化史理","论》一书中指出， 原始歌舞常常被原始人用来保证巫术的成功。 希尔恩在 《艺术的起源》 一书","中，也详细介绍了原始舞蹈与交感巫术的联系。","评价：艺术的产生最初确实是与巫术有密切联系的，但艺术起源于“巫术”的理论又并","不十分准确，","因为原始时代的巫术活动是直接和当时原始人类的生产劳动密切联系在一起的。","","","","","科林伍德在他的《艺术原理》一书中认为 :“巫术”一词通常根本没有明确的含义，它常被","用来表示原始社会中某种实用的倾向或某些实际的活动，“可是巫术与艺术之间的相似是既","强烈而又切近的，巫术活动总是包含着像舞蹈、歌唱、绘画或造型艺术等活动”。在原始社","会生产力低下和人类早期认识水平低下的情况下，人们无法把握自身，更无法支配自然界，","于是原始人便寄托于巫术，使得巫术与原始社会的日常生活与生产劳动都有了密切的联系。","因此，关于艺术的起源尽管有上述种种说法，但最终还是应当归结于人类的社会实践活动。","五  艺术起源于“劳动”","（1）希尔恩在《艺术的起源》中就曾经列出专章来论述艺术与劳动的关系。普列汉诺","夫在 1900 年完成了专著《没有地址的信》，通过对原始音乐、原始舞蹈、原始绘画的分析，","以大量人种学、民族学、人类学和民俗学的文献证明，系统地论述了艺术的起源及其发展问","题， 并且得出了艺术发生于 “劳动” 的观点。 普列汉诺夫进一步指出:“劳动先于艺术， 总之，","人最初是从功利观点来观察事物和现象，只是后来才站到审美的观点上来看待它们。”","（2）劳动创造了人，也为艺术的产生提供了前提。劳动中工具的制造有着特殊的重要","意义，它的出现标志着从猿到人过渡阶段的结束，也标志着人类文化的起源。在生产劳动实","践中，完成了一个异常漫长的自然身心的“人化”过程，形成了人类的文化心理结构，其中","包括人的审美心理结构，但是，艺术的产生却不能简单地完全归结为劳动。","（3）制造工具这一点，最鲜明地体现了人类有意识、有目的的活动，从工具造型的演","变上可以充分看出人类自由创造的特性，也可以看出实用价值先于审美价值、艺术产生于非","艺术这样一个漫长的历史演进过程。 西安半坡村的石器， 这些磨制石器不但提高了实用效能，","而且在造型上具有了对称均衡、方圆变化等美的特征，山东大汶口出土的玉斧，更具有明显","的审美特性，是一种权力或神力的象征品。陶器制作时首先考虑实用目的。但是到了后来，","原始人在制作陶器时自觉地运用形式美的法则，如黄河流域的仰韶、马家窑等文化遗址出土","的彩陶制品，大都有鱼纹、鸟纹、蛙纹、花纹等动植物图形。","（4）在生产劳动实践中，人类各种感觉器官与感觉能力也不断发达，人开始有能力进","行愈来愈复杂的活动，完成了一个异常漫长的自然身心的“人化”过程，形成了人类的文化","心理结构，其中包括人的审美心理结构。例如，原始民族喜欢红色一类的强烈色调。","虽然物质生产劳动是艺术起源的根本原因，但是，艺术的产生却不能简单地完全归结为","","","","","劳动。从劳动到艺术的诞生，曾经经过了巫术仪式、图腾歌舞等中间阶段，并且是一个相当","漫长的历史阶段，最后才诞生了纯粹审美意义上的艺术。","第二节  艺术起源的第六种看法：多元决定论","（1） 法国著名结构主义学者阿尔都塞提出了 “多元决定论” ， 认为任何文化现象的产生，","都有多种多样的复杂原因，而不是由一个简单原因造成的。","（2）艺术史学家希尔恩认为，艺术本身就是一种综合性现象，因此研究艺术的起源必","须结合社会学、人类学、心理学等多学科的相关知识，采取综合研究方法，才能真正揭示艺","术起源的奥秘。在其代表作《艺术的起源》一书中，希尔恩详细阐述了关于艺术起源多元化","的看法。","艺术产生于非艺术， 实用价值先于审美价值， 艺术起源于人类社会实践的历史发展之中。","（3）艺术起源的第六种说法即“多元决定论”才是正确的结论。艺术的产生经历了一","个由实用到审美、以巫术为中介、以劳动为前提的漫长历史发展过程，其中也渗透着人类模","仿的需要、表现的冲动和游戏的本能。艺术的产生虽然是多元决定的，但是，“巫术说”与","“劳动说”更为重要。从根本上讲，艺术的起源最终应归结为人类的实践活动。事实上，巫","术在原始社会中同样是人类的一种实践活动。对于原始人来说，巫术具有特殊的实用性。","","","","","第三章  艺术的功能与艺术教育","第一节  艺术的社会功能","（1）艺术对社会生活有着多方面的作用和影响，但归根结底，艺术生产是通过创造具","有审美价值的艺术品来满足人的审美需要。艺术作为人类审美活动的最高形式，集中体现出","人类的审美意识，凝聚和物化了人对现实世界（自然界和社会）的审美关系。","（2）审美价值是艺术最主要和最基本的特性。正是由于审美价值渗透在艺术的其他各","种功能之中，才使得艺术具有自己独立存在的价值和意义，才使得艺术具有与其他文化形态","迥然不同的独特社会功能。艺术的审美认知功能与科学的认知功能迥然不同；艺术的审美教","育功能与道德教育迥然不同；艺术的审美娱乐功能与其他类型的娱乐活动更是迥然不同。艺","术作为人类的文化形态之一，之所以区别于哲学、宗教、道德、科学等其他文化形态，就是","由于艺术始终把创造和实现审美价值来满足人的审美需要， 作为自己最主要和最基本的功能。","艺术作为人类审美意识的最高表现形式， 它的多重社会功能始终是以审美价值为基础的，","艺术的各种社会功能只有在审美价值的基础上才能够实现。","（3）艺术的具体社会功能有许多种，但主要的应当是审美认知作用、审美教育作用、","审美娱乐作用这三种功能。","一  审美认知作用","（1）艺术的审美认知作用，主要是指人们通过艺术鉴赏活动，一方面可以更加深刻地","认识自然，另一方面，也可以认识社会、认识历史、认识人生。孔子就讲过 :“《诗》，可","以兴，可以观，可以群，可以怨；迩之事父，远之事君；多识于鸟兽草木之名。”指出了文","艺具有两方面的认识作用：一方面是文艺“可以观”风俗之盛衰，具有认识社会、历史的作","用；另一方面是“多识于鸟兽草木之名”，也就是文艺还具有认识自然现象、增长多方面知","识的意义。","","","","","（2）首先，艺术对于社会、历史、人生具有审美认识功能。由于艺术活动具有反映与","创造统一、 再现与表现统一、 主体和客体统一等特点， 往往能够更加深刻地揭示社会、 历史、","人生的真谛和内涵， 更能反映社会生活的深度和广度， 并且常常是通过生动感人的艺术形象，","给人们带来难以忘却的社会生活知识。","马克思在评价 19 世纪英国作家狄更斯等人的作品时说，他们“在自己的卓越的、描写","生动的书籍中向世界揭示的政治和社会真理，比一切职业政客、政论家和道德家加在一起所","揭示的还要多”。","恩格斯在谈到巴尔扎克的社会小说《人间喜剧》时，认为从这里所学到的东西，“比从","当时所有职业的历史学家、经济学家和统计学家那里学到的全部东西还要多＂。","列宁把列夫·托尔斯泰的小说看成是 “俄国革命的镜子” ， 因为这些作品深刻地表现了 “俄","国千百万农民在俄国资产阶级革命快要到来的时候的思想和情绪”。","（3）其次，对于大至天体、小至细胞的自然现象，艺术也同样具有审美认知作用。","（4）艺术作品将生活真实升华为艺术真实，通过现象揭示本质，通过偶然揭示必然，","通过个别显示一般， 通过客观显示主观， 使艺术的审美认知功能具有深刻的内涵。 《红楼梦》","堪称一部反映当时社会生活的形象的百科全书。","二  审美教育作用","（1）艺术的审美教育作用，主要是指人们通过艺术欣赏活动，受到真、善、美的熏陶","和感染， 思想上受到启迪， 实践上找到榜样， 认识上得到提高， 在潜移默化中， 其思想、 感情、","理想、追求发生深刻的变化，从而正确地理解和认识生活，树立起正确的人生观和世界观。","①孔子以“礼乐相济”的思想，创立了我国古代最早的教育体系，他以“六艺” （礼乐、","射、御、书、数）教授弟子，其中的乐就是诗、歌、舞、演、奏等的艺术综合体。孔子还明","确提出“兴于《诗》，立于礼，成于乐”孔子认为，诗可以使人从伦理上受到感发，礼是把","这种感发变为一种行为的规范和制度，而乐则是陶冶人的性情和德行，也就是通过艺术，把","道德的境界和审美的境界统一起来。虽然孔子强调艺术的教育作用，是为了维护崩溃中的奴","隶制，但他确实看到了艺术感化人和陶冶人的重要作用。","②柏拉图就强调美育与德育的结合。 柏拉图从奴隶主贵族的立场出发， 认为 《荷马史诗》","以及悲剧、 喜剧的影响都是坏的， 原因是这些艺术作品使人的理智失去控制、 情欲得到放纵，","","","","","他提倡“理智”的艺术，特别强调音乐的教育作用。","③亚里士多德认为，理想的人格是全面和谐发展的人格，情感、欲望和理智一样，都是","人性中固有的内容，同样有得到满足的权利，所以 艺术应当具有三种功能 : 一是“教育”，","二是 “净化”，三是 “快感”，也就是说， 艺术可以帮助人们获得知识、 陶冶性情、 得到快感。","（2）艺术之所以具有审美教育作用，是因为艺术作品不仅可以展示生活的外观，而且","能够表现生活的本质特征和本质规律，在艺术作品中又总是饱含着艺术家的思想感情，蕴涵","着艺术家对生活的理解、认识、评价和态度，渗透着艺术家的社会理想和审美理想，能够使","欣赏者从中受到启迪和教育。艺术的审美教育作用不同于道德教育，更不同于其他类型的教","育形式。这是因为艺术的教育功能是以审美价值为基础，具有美学的意义和艺术的魅力。艺","术家采用了化“善”为“美”的方法，使艺术教育作用不同于普通的道德教育，而具有鲜明","的审美教育的特点。","①艺术审美教育作用的第一个特点是“以情感人”。艺术作品总是灌注着艺术家的思想","情感，通过生动感人的艺术描绘，作用于欣赏者的感情，使人受到强烈的感染和熏陶。艺术","的教育是以情感人、以情动人，通过艺术强烈的感染性，使欣赏者自觉自愿地受到教育。","②艺术审美教育作用的第二个特点是“潜移默化”。艺术作品对人的教育，常常是在毫","无强制的情况下，使欣赏者自由自愿、不知不觉地受到感染，心灵得到净化。","③艺术审美教育作用的第三个特点是“寓教于乐”。这就是强调，应当把思想教育融合","到艺术审美娱乐之中。","三  审美娱乐作用","艺术的审美娱乐作用， 主要是指通过艺术欣赏活动， 使人们的审美需要得到满足，获得","精神享受和审美愉悦，通过阅读作品或观赏演出，使身心得到愉悦和休息。物质产品是为了","满足人们生存的需要，精神产品则是为了满足人们心灵的需要。艺术作为一种特殊的精神产","品，能够给人们带来审美的愉悦和心理的快感。","①亚里士多德就认为，人的本能、情感和欲望有得到正当满足的权利，艺术应当使人得","到快感。","②古罗马美学家贺拉斯明确提出艺术应当“寓教于乐，既劝谕读者，又使他喜爱，才能","符合众望”。","","","","","③《乐记》总结了秦以前的音乐美学思想，对于艺术的娱乐作用，也从儒家观点出发做","了进一步的阐述 :“乐者乐也。君子乐得其道，小人乐得其欲。以道制欲，则乐而不乱；以","欲忘道，则惑而不乐。”必须“以道制欲”，才能做到既从中得到快乐又不致引起混乱。如","果“以欲忘道”，只会引起惑乱，也得不到快乐。","艺术审美娱乐功能的另一个方面，是使人们通过艺术欣赏得到积极的休息，从而更好地","投入新的工作。艺术欣赏确实是一种令人陶醉的积极的休息方式，具有畅神益智的功能。艺","术的这种功能甚至逐渐被运用到医疗方面。如音乐疗法等 。","西方现当代心理学的许多流派，都十分重视艺术对欣赏者深层心理的宣泄作用或净化作","用，认为人们在现实生活中受到压抑或无法实现的情绪、愿望、期待理想，可以通过艺术创","造的想象世界或梦幻世界得到满足。美国著名人本主义心理学家马斯洛（1908—1970）更是","认为，人生的最高境界是一种“高峰体验”，在这种时刻里，人会感受到强烈的幸福、狂喜、","顿悟、完美。马斯洛认为，“高峰体验”尤其存在于人的高级精神活动之中，也就是人处在","最佳状态的时候并感受到最高快乐的实现。不但诗人和艺术家在创作狂热时是处于“高峰体","验”之中，甚至聆听一首感人至深的音乐乐曲也可以产生“高峰体验”。马斯洛还进一步指","出，审美活动中的“高峰体验”实际上是通过自我证实而达到审美的最高境界。","艺术审美娱乐功能还有一个很重要的方面，就是前面曾提到过的寓教于乐。通过艺术欣","赏，人们不仅可以满足精神上的审美需要，身心得到积极的休息，而且还可以从中受到教育","和启迪。","艺术的审美教育作用、审美认知作用和审美娱乐作用三者是一个有机的整体，具有不可","分割的联系。通过寓教于乐来激动人、感染人，将艺术的思想性寓于审美娱乐性之中。","第二节  艺术教育","艺术教育是美育的核心，它的根本目标是培养全面发展的人。艺术教育承担着开启人的","感知力、理解力、想象力、创造力，使人的内心情感和谐发展的重任。","一  美育与艺术教育","（1）先秦时期，孔子就提出了“兴于《诗》，立于礼，成于乐”的思想，奠定了中国","","","","","古代教育“礼乐相济”的理论基础，把符合儒家之礼的艺术，视为道德教育的特殊方式。","（2） “美育” （即“审美教育”）这个概念，由18 世纪的德国美学家席勒正式提出来。","在《美育书简》中，系统阐述了他的美育思想。从自然与人、感性与理性等基本哲学命题出","发，从改变近代人的存在方式，使人重新获得自由、和谐、全面的发展，实现人性的复归这","一更加广阔的领域来论述美育。","通过审美教育，要把感性的人变为理性的人，唯一的办法是先使人成为审美的人，只有","审美才是人实现精神解放和完美人性的先决条件。","在他看来，人身上有两种相反的要求，可以叫作“冲动” : 一个叫“感性冲动”，它产","生于人的自然存在或感性本质；另一个叫 “理性冲动” ， 它产生于人的绝对存在或理性本质。","“感性冲动”受感性需要的支配，“理性冲动”受必然规律的限制，完美的人性应当是二者","的有机统一。这两种冲动都是人的天性，只不过在近代文明社会中，被分裂开来了。完美的","人性，应当是它们二者的和谐统一。","因此，席勒指出，需要有第三种冲动即“游戏冲动”来作为桥梁，将二者有机地统一起","来，使人成为具有完美人性的真正的人。因为“游戏冲动”是人的一种自由自觉的活动，它","既可以克服“感性冲动”从自然的必然性方面强加给人的限制，又可以克服“理性冲动”从","道德的必然性方面强加给人的限制。他说 :“只有当人在充分意义上是人的时候，他才游戏；","只有当人游戏的时候他才是完整的人。”当然，席勒在这里所说的“游戏”并不是指现实生","活中那类游戏， 而是指与强迫对立的一种自由自觉的活动， 是一种审美的游戏或艺术的游戏。","席勒认识到大工业社会造成的社会矛盾和人性分裂，还朦胧地意识到资本主义生产关系","带来的劳动异化， 使近代人丧失了人性的和谐， 所以， 席勒极力主张通过美育来培养理想的人、","完美的人、全面和谐发展的人。突破了古希腊时期单纯把美育作为道德教育的特殊方式或补","充手段的狭隘观点，把美育提到培养全面发展的人的高度来加以认识。席勒还指出 :“有促","进健康的教育，有促进认识的教育，有促进道德的教育，还有促进鉴赏力和美的教育。这最","后一种教育的目的在于， 培养我们感性和精神力量的整体达到尽可能和谐。 明确地把体、 智、","德、美四项教育并提，使美育具有了独立的地位和任务。”","但是席勒主张以美育来实现人性的改造乃至社会的改革， 完全脱离经济基础和上层建筑，","无疑只是一种唯心主义的空想。","（3）我国近代最早公开将美育与德育、智育相提并论来提倡的是清末学者王国维，近","","","","","代教育家蔡元培（1868—1940）更是大力倡导美育，出任民国政府第一任教育总长期间，以","及后来任北京大学校长期间，都把美育确定为其新式教育方针的内容之一，并且提出了一系","列美育实施设想，对美育的本质、内容、作用和实施美育的途径做了较系统的研究和阐述。","蔡元培还提出了“以美育代宗教”的主张，认为这是人类文化发展的必然趋势。他说 :“美","育者，应用美学之理论于教育，以陶冶感情为目的者也。”这种看法，突出了情感在美育中","的重要地位，强调美育是陶冶人的感情，改造人的世界观，使人达到一种新的精神境界的最","好途径。然而在当时的社会条件下，这些设想和主张是无法真正实现的。","（4）美育的核心是艺术教育。艺术教育成为审美教育的主要内容和主要方式。艺术美","作为美的集中表现形态，对提高人创造美和欣赏美的能力，培养人的审美理想，促进人的全","面发展等方面，有着极其重要的意义。","苏联美学家斯托洛维奇指出 :“人的审美教育可以通过多种途径实现， 但是不能不承认，","艺术是对个人目的明确地施加审美影响的基本手段，因为正是在艺术中凝聚和物化了人对世","界的审美关系。因此艺术教育——对艺术需要的教育、对艺术感知和理解的发展、艺术创造","能力的形成和完善——组成整个审美教育不可分割的一部分。”","艺术教育作为美育的基本手段与中心内容，在美育中有着非常重要的地位和作用。","二  艺术教育在当代社会生活中的重要意义","现代社会中，“艺术教育”这一个概念，有着两种不同的含义和内容。","①从狭义上讲，艺术教育被理解为为培养艺术家或专业艺术人才所进行的各种理论和实","践教育，如各种专业艺术院校正是如此。","②从广义上讲，艺术教育作为美育的核心，它的根本目标是培养全面发展的人，而不是","为了培养专业艺术工作者。广义的艺术教育强调普及艺术的基本知识和基本原理，通过对优","秀艺术作品的评价和欣赏，来提高人们的审美修养和艺术鉴赏力，培养人们健全的审美心理","结构。同时，艺术教育作为美育的核心内容，它对人们道德的完善和智力的开发也将产生深","远的影响，它可以丰富人的想象力，发展人的感知力，加深人的理解力，增强人的创造力，","培养全面发展的人。","","","","","三  艺术教育的任务和目标","艺术教育的根本任务和目标就是在“立德树人”的目标下，培养全面发展的人才。","一是普及艺术的基本知识，提高人的艺术修养。在艺术欣赏中不断提高鉴赏能力和审美","能力，把欣赏中的感性经验上升为理性认识。只有欣赏者具有较高的欣赏能力，才能从更高","的起点上去欣赏艺术作品。","二是健全审美心理结构， 充分发挥人的想象力和创造力。 充分发挥人的想象力和创造力，","能够极大地促进和提高人的思维能力。","三是陶冶人的情感，培养完美的人格。培养完美的人格。通过以情感人、以情动人的方","法，使人进入更高的精神境界。","","","","","第四章  文化系统中的艺术","第一节  作为文化现象的艺术","艺术文化学作为近年来出现的一门新兴学科，主要是一门以整个人类文化为参照系来探","讨艺术问题、研究艺术现象的综合性学科。艺术文化学处于普通文化学和普通艺术学的交叉","领域，它重点研究艺术作为一种文化现象，在整个人类文化中所具有的地位、作用，以及艺","术与其他文化现象如哲学、宗教、道德、科学之间的相互关系。","将艺术放到整个人类文化系统中来研究，为我们提供了一个新的视野和角度，使我们能","在更广泛、更深刻的意义上来理解艺术的现象和历史。","一  文化与艺术","（1） 在关于文化的众多定义中， 19 世纪最有影响的是英国人类学家泰勒在 《原始文化》","（1871） 中提出来的著名的文化定义。 泰勒认为:“所谓文化或文明乃是包括知识、 信仰、 艺术、","道德、法律、习俗以及包括作为社会成员的个人而获得的其他任何能力、习惯在内的一种综","合体。”","（2）20 世纪最有影响的文化定义，则是美国文化学家克鲁伯和克拉克洪在《文化：概","念和定义的批判性回顾》 一书中提出来的。 他们认为：文化包括各种外显或内隐的行为模式，","通过符号的运用使人们习得并传授，并构成了人类群体的显著成就；文化的基本核心是历史","上经过选择的价值体系；文化既是人类活动的产物，又是限制人类进一步活动的因素。这一","定义，成为自泰勒的文化定义后最受重视的文化概念界说。","（3）从总体上讲，文化大系统主要包括物质文化、制度文化和精神文化三大子系统，","而它们各自又包含着许多更低层次的子系统。例如，精神文化又包含着哲学、宗教道德、科","学、艺术等许多子系统。所有这些子系统，都处于整个文化的大系统中，一方面它们受到文","化大系统的影响和制约，另一方面它们又反过来影响和作用于文化大系统。彼此渗透，互相","","","","","影响，具有内在的联系性和彼此的互动性。","二  艺术在人类文化中的地位","（1）苏联美学家卡岗认为：艺术是它所属的文化的反映和代表，从这种意义上讲，艺","术起到了“文化自我意识”的作用，“艺术仿佛是一面镜子，文化从中照见自己，从中认识","自己，并且只有在认识自己的同时，才能认识它所反映的世界”。艺术史能够准确和有力地","体现出文化发展的历史进程。例如古希腊艺术体现出古希腊文化中物质与精神、感性与理性","的和谐统一。文化可以从艺术这面“镜子”中，  “照见自己”和“认识自己”。显然，艺","术在人类文化中的地位，首先表现在艺术参与和推动、体现和反映出人类文化的历史发展。","（2）文化系统的整体性决定了它所属的子系统必然从属和依附于文化大系统。社会文","化大系统作为一种总的文化氛围或文化条件，直接制约着作家、艺术家和读者、观众、听众","等每一个人文化心理结构的形成，从而间接对艺术的创作与欣赏产生巨大的影响。","（3）人类文化大系统主要包括物质文化、制度文化、精神文化这三大子系统。从文化","结构来看，物质文化是基础，制度文化是中介，精神文化是核心。从某种意义上讲，物质文","化和制度文化，决定和制约着精神文化。所以，经济、政治对于包括艺术在内的精神文化有","着十分重要的作用。","（4）仅仅从精神文化内部来看，艺术同哲学、宗教、道德、科学之间，也是相互关联、","彼此作用的。艺术与它们之间的这种相互关系表现在：艺术受到哲学、宗教、道德、科学等","其他精神文化的影响；另一方面，艺术也反过来影响着它们。研究和分析艺术与其他精神文","化之间的这种相互关系，可以加深我们对艺术的理解和认识。","第二节  艺术与哲学","哲学主要通过美学这一中介对艺术产生巨大的影响。哲学对艺术的影响，在中国传统哲","学与中国艺术、 西方现代哲学与西方现代主义艺术这两个典型例证中， 可以找到最好的说明。","反过来， 艺术也可以通过自身的特殊方式， 传播和体现一定的哲学思想， 从而对哲学产生影响。","","","","","一  哲学与艺术的相互关系","（1）哲学作为人类理性的最高形式，要对作为人类感性最高形式的艺术产生影响，必","然经过美学这一中介。美学作为哲学的一个分支，就是用理性的方法来研究感性认识。从这","个意义上来讲，黑格尔更是干脆将美学称之为“艺术哲学”，明确指出美学在艺术与哲学之","间的桥梁作用。","（2）美学的范围和对象绝不仅仅限于艺术，艺术毕竟是美学研究的主要对象。孔子提","出了以“礼”“乐”为中心的美学思想，并用“兴、观、群、怨”等范畴对诗的特点和功能","作了概括， 要求做到美与善的统一、 文与质的统一， 庄子哲学追求个体的自由和无限的境界，","形成了庄子美学以自然无为为至上之美的理论基础。以孔子为代表的儒家美学和以庄子为代","表的道家美学，还有后来的禅宗佛学，对古代中国艺术的发展具有极其深远的影响。","（3）哲学对艺术的影响：","①首先表现在对艺术家的影响。李白的审美理想，深受庄子美学推崇天然之美的思想影","响，他大力倡导“自然” “清真”的风格，赞赏“清水出芙蓉，天然去雕饰”的天然之美。","杜甫的美学理想，则受到孔子儒家美学的极大影响，他将“致君尧舜上，再使风俗淳”的抱","负融入诗中，以强烈的忧患意识倾诉了对当时统治集团腐朽统治的不满和对劳动人民深受苦","难的同情，产生了“三吏”“三别”等代表作品。","②表现在出现了一批哲理性的艺术作品。例如奥地利作家卡夫卡的作品，深受存在主义","的非理性主义哲学思潮的影响，成为影响西方现代主义文学的表现主义、存在主义、荒诞派","的代表作品。","③表现在它能起到促进艺术潮流形成的作用。超现实主义，就是以法国唯心主义哲学家","柏格森的直觉主义为理论基础的。","（4）艺术也对哲学产生一定的影响，艺术可以启迪哲学家的思维，艺术作品也可以传","播特定的哲学思想。尤其是哲学家对艺术的思考，往往成为其哲学体系的重要组成部分，如","黑格尔、叔本华、尼采等均是如此。","二  西方现代哲学与西方现代主义艺术","（1）西方现代哲学在本体论上大多具有唯心主义色彩，在认识论上大多具有非理性主","义色彩，在人生哲学上大多具有悲观主义色彩。西方现代哲学对西方现代文学艺术产生了极","","","","","大影响，柏格森、萨特、加缪这三人，都曾经获得过诺贝尔文学奖。","西方现代主义艺术并不是一个单一的艺术流派， 而是象征主义、 表现主义、 超现实主义、","意识流、未来主义、迷惘的一代、存在主义、荒诞派、新小说、抽象主义、立体主义、未来","主义、达达主义等数量繁多的西方文艺流派的总称。","象征主义的理论基础就是叔本华的主观唯心主义哲学，同时也吸收了尼采的思想和瑞典","神秘主义哲学家史威登堡的“对应论”思想。在美术方面则以法国画家摩罗、德国画家勃克","林等人为代表；建筑上出现了法国的朗香教堂、澳大利亚的悉尼歌剧院、德国的柏林爱乐音","乐厅等一批代表作品。","（2） 西方现代哲学对现代主义艺术的影响是极为深刻和广泛的。 “意识流” 这个概念，","最早是由美国心理学家和实用主义哲学创始人威廉 ·詹姆斯提出来的，并且后来由弗洛伊德","进一步加以发展。","第三节  艺术与宗教","一  宗教与艺术的相互关系","（1）黑格尔认为，最接近艺术的领域就是宗教。在 黑格尔的客观唯心主义体系里，人","类认识绝对真理有三种方式：最初级的方式是艺术，它以感性形象显现真理，较高一级的方","式是宗教，它强调主体的情感和观念；最高级的方式是哲学，它以自由思考将主体与客体、","感性与理性统一起来了。","（2）克莱夫·贝尔的《艺术》，贝尔认为，艺术与宗教同属于幻想的领域、情感的领域，","科学则属于现实实证的领域、理智的领域。因此，他强调“艺术和宗教是人们摆脱现实环境","达到迷狂境界的两个途径。审美的狂喜和宗教的狂热是联合在一起的两个派别。艺术与宗教","都是达到同一类心理状态的手段”。","（3）艺术与宗教在认识、掌握世界的方式上确实有某些共同之处。感知、想象、联想、","情感等诸多心理因素，在艺术与宗教领域中都占有同样重要的地位。审美感情与宗教感情一","样，往往都是超脱日常生活的感情，追求精神愉悦而不是物质满足。","艺术与宗教之间的这种密切联系更重要的原因就是宗教对艺术的利用。尤其是在中世纪","的欧洲，宗教具有至高无上的地位，其影响遍及当时社会物质生活与精神文化生活的各个方","","","","","面，宗教艺术几乎取代了世俗的艺术，直接影响着各种艺术的发展。宗教对艺术的利用，不","仅在西方存在，在中国也同样存在，尤其是佛教传入中国后，对中国各门艺术都产生了很大","的影响，仅仅从敦煌、云冈、龙门、麦积山这四大石窟，就可以看到佛教对绘画、雕塑、建","筑、文学的巨大影响。","①宗教影响艺术， 首先表现在利用各门艺术来宣传宗教， 为艺术提供了宗教题材和内容。","从建筑艺术来看，从古埃及的金字塔和古希腊的神庙，到中世纪遍布欧洲的哥特式教堂，从","佛教的庙宇到伊斯兰教的清真寺，都可以看到宗教的巨大影响。敦煌、云冈等石窟中大量宗","教题材的绘画、 雕塑， 更是直接以造型艺术的方式， 讲述了 “舍身饲虎” “割肉贸鸽” “五百","强盗剜目”等佛经故事，塑造出佛、菩萨、天王、力士等宗教人物形象。","其次，宗教对艺术的影响，还表现在它具有促进艺术发展和阻碍艺术发展两种相反的作","用上。由于宗教常常利用艺术来形象地宣传教义，为许多艺术家提供了艺术实践的天地和舞","台，在客观上起到了推动艺术发展的实际促进作用。但是，宗教又在一定程度上阻碍着艺术","的发展，如中世纪欧洲的教会文学，使这个时期的艺术沦落为替宗教服务的“神学婢女”，","受到严重的破坏。","②艺术影响宗教， 首先表现为参与宗教活动。 早在艺术诞生的初期， 原始的歌舞、 表演、","绘画、雕刻等，在当时也是一种巫术或宗教活动，远古的图腾歌舞本身就是一种狂热的巫术","仪式活动。人类进入文明社会以后，艺术仍然参与着宗教活动，从音乐来看，基督教有唱诗","班，有多声部的宗教歌曲，还有专门的弥撒曲、安魂曲等宗教音乐。","其次， 艺术影响宗教还表现在宣扬宗教思想上。 例如佛教传入我国后， 在唐代产生了 “变","文”这种宗教宣传的新方式。所谓“变文”就是以说唱的形式讲述佛教故事，宣传佛教教义。","再次，艺术影响宗教表现在强化宗教氛围上。哥特式教堂，从外观上看，高耸的尖塔直","刺青天。教堂内部狭长窄高的空间，形成一种腾空而上的动感，使人产生超脱尘世向天国接","近的幻觉，以多种艺术的方式强化了宗教的氛围。","（4）艺术与宗教二者有着本质的区别。（注：之前都是联系）","马克思指出 :“宗教里的苦难既是现实的苦难的表现，又是对这种现实的苦难的抗议。","宗教是被压迫生灵的叹息，是无情世界的感情。正像它是没有精神的制度的精神一样。宗教","是人民的鸦片。”","从根本上讲，宗教是人的自我意识的丧失，艺术却是对人的自由创造本质的确证；宗教","","","","","劝人到天国去寻求精神安慰，艺术却鼓励人们热爱并珍惜现实生活；宗教作为鸦片麻痹人的","精神，艺术却是培养全面和谐发展个性的必要手段。因此，虽然宗教由于利用艺术而在一定","程度上推动了艺术的发展，但从本质上讲，宗教也阻碍、束缚和限制着文艺的发展。","二  形形色色的宗教艺术","（1）所谓宗教艺术，是相对于世俗艺术而言的，它是指在宗教影响或控制下，为宗教","活动或宗教宣传服务的艺术。虽然宗教艺术的诞生是由于宗教利用艺术为其服务，但是，由","于艺术家们的创造性劳动凝聚其中，使得宗教艺术具有独特的审美价值。","（2） 从世界建筑史来看， 历代许多有名的建筑都与宗教有关， 例如古希腊帕提农神庙、","古罗马万神庙、 巴黎圣母院、 圣彼得大教堂。 中世纪基督教统治欧洲， 哥特式建筑应运而生，","风靡欧洲大陆，除了著名的巴黎圣母院外，还有法国的夏特尔教堂、意大利的米兰教堂、德","国的瑙姆堡教堂等。","中国古代建筑艺术里，佛教道教的寺庙、道观、佛塔等也占有相当大的比重，如洛阳白","马寺、西安大雁塔、河北定州开元寺塔、山西大同善化寺、湖北丹江口市武当山金殿、拉萨","大昭寺等都是著名的宗教建筑。 尤其是被称为中国佛教四大名山的四川峨眉山、 浙江普陀山、","安徽九华山、山西五台山，每座山都拥有数十所乃至上百所寺庙，其中有不少堪称古代建筑","技术与建筑艺术上的杰作。","（3）绘画在宗教艺术中也占有重要的地位。意大利文艺复兴时期著名画家米开朗基罗","的杰出作品西斯廷教堂的天顶画《创世记》，《最后的审判》；拉斐尔《西斯廷圣母》；被","誉为“画圣”的唐代著名画家吴道子，他的创作成就也首先表现在宗教绘画上。","（4）雕塑在宗教艺术中也占有举足轻重的地位。如四川的乐山大佛，是世界上最大的","石刻佛像之一。","（5）在宗教艺术中，尤其值得注意的是宗教文化特有的石窟艺术，它集建筑、绘画、","雕塑于一身，保存了大量古代的艺术珍品。我国现存的石窟遗迹约有 120 多处，其中最负盛","名的有敦煌石窟、云冈石窟、龙门石窟大足石窟、麦积山石窟等。","（6）音乐、戏曲等在宗教艺术中也占有相当的地位。 6 世纪时，当时的罗马教皇格里","高利一世花费了十多年时间，亲自选出了许多典型的歌调并制定出不少演唱规则，形成欧洲","音乐史上有名的无伴奏齐唱乐《格里高利圣咏》。大概从唐中叶以后，佛教庙宇中就出现了","杂剧的演出。尤其是以佛经故事“目连救母”为题材形成的《目连戏》，在宋代更是盛行一","","","","","时，成为综合了许多民间传说故事的连台戏，甚至由此派生出许多新的剧种。","中国戏曲也从宗教故事和神话传说中吸取了大量的素材，借宗教故事的外壳来表现具有","社会内容的人间情感和意愿。例如，元末明初杂剧《西游记》。","（7） 多种多样的宗教艺术， 不但构成了世界艺术史的重要组成部分， 而且对各个地区、","各个民族、各个种类的艺术都产生了深远的影响。随着人类社会的发展与进步，宗教对艺术","的影响已经大大减弱，宗教艺术在当代社会中主要是作为历史文化遗产而存在了。","第四节  艺术与道德","所谓道德，是指人们在社会生活中形成的关于善与恶、是与非、正义与非正义等伦理观","念和行为规范的总和，它包括道德意识、道德关系、道德活动等内容。","艺术与道德的关系，主要有这样三种观点：第一种观点是把艺术完全当作道德教育的手","段， 否认艺术与道德的根本区别；第二种观点却截然相反， 完全否定艺术与道德的内在联系，","认为表现道德内容会损害艺术；第三种观点则承认艺术与道德的紧密关系，认为二者互相影","响，具有内在的联系，同时又承认二者的根本区别，用寓教于乐取代道德说教。","一  道德与艺术的相互关系","（1）两千多年前，古希腊思想家柏拉图在制订“理想国”蓝图时，就下令把诗人与艺","术家从“理想国”中驱逐出去，因为在他看来，除少数音乐作品之外，当时流行的《荷马史","诗》 、 悲剧、 喜剧和许多音乐作品的影响都是坏的。 柏拉图的弟子亚里士多德反对这种看法，","竭力为艺术辩护，强调艺术的教育功能或“净化”功能，强调艺术的社会道德的作用。","在先秦典籍中， “美”与“善”两字在不少情况下是同义词，也就是：美即善，善即美。","从孔子开始，才将“美”和“善”区分开来。但在孔子看来，“善”比“美”更加重要，是","更根本的东西，他非常重视艺术的社会伦理道德功能。《韶》乐，达到了“尽美矣，又尽善","也”的境界。","（2）道德和艺术的关系：","①一方面是道德影响艺术。这种影响首先表现在，一定时代和一定社会的伦理道德思想","总是要通过艺术作品的主题、题材、情节、人物、思想性、倾向性、内在意蕴等体现出来。","","","","","任何艺术不管是文学、戏剧、电影、电视，还是建筑、绘画、音乐、舞蹈，总是一定时代的","社会生活的反映，而社会生活的重要组成部分就是人们的道德生活，因此，艺术作品常常包","含有道德的内容，通过塑造典型形象的手法来反映人们的道德面貌。","其次，道德对艺术的影响，尤其表现在作家、艺术家的世界观和道德观对艺术创作的重","大影响上。艺术是社会生活在作家、艺术家头脑中反映的产物，因而在描写和表现人们的道","德面貌与道德生活时，必然要融入作家、艺术家自己的道德评价和道德判断。","②另一方面是艺术影响道德。这种影响主要表现在艺术作品对人民群众的道德教育作用","上。由于艺术具有生动、感人的形象和特殊的魅力，因此它对道德观念的评价和道德行为的","选择都具有很大的影响。一部优秀的艺术作品，可以提高人们的道德水平和精神境界。","③此外，艺术对道德的影响，还表现在它能够对社会道德意识和道德观念的改变产生一","定程度的影响。五四新文化运动具有深远的历史意义，它是一个以思想启蒙为中心的文化革","命运动。","（3）艺术与道德的区别：","①从范围来看，艺术不仅可以反映人们的道德关系，而且可以表现人们的政治关系、经","济关系、法律关系等，所以，艺术是从更广泛的范围来反映人们的社会生活。","②从方式来看，道德是以概念、原则和规范来反映人与人之间的关系，艺术却是以形象","来具体地描写、刻画或表现这种关系。","③从评价标准来看，道德评价和审美评价之间也存在着差异，前者常常以“善”为唯一","标准，后者往往以“真善美”的统一为标准。","④此外，还应当看到，并非一切艺术作品都必须具有道德内容，如风景摄影、花鸟画、","器乐曲等，许多都不涉及道德内容。尤其需要指出的是，对于那些具有道德内容的艺术作品","来说也需要寓教于乐，也就是将道德内容有机地融合在艺术形象之中，使其化善为美，具有","审美的教育作用，而不能够干巴巴地道德说教，只有这样，才能真正对欣赏者产生潜移默化","的影响。","二  艺术中的道德内容","（1） 劝善惩恶、 因果报应、 强调伦理道德， 历来是中国戏曲的传统。 善有善报、 恶有恶报，","中国戏曲以艺术形象来告诫人们慎重地承担道德责任，严肃地选择道德行为。这种劝善惩恶","","","","","的裁判或者在人世间进行，如《秦香莲》《救风尘》《窦娥冤》。","（2）影视艺术，同样将道德题材作为自己最重要的表现内容之一。影片大致上可划分","为以下几种类型：","第一类是纪实性风格的道德题材影片，如美国的《克莱默夫妇》、《普通人》、《金色","池塘》、《母女情深》等，这些影片充满生活气息、追求纪实风格。","第二类是悲喜剧风格的道德题材影片，如苏联著名导演梁赞诺夫的“爱情三部曲”。这","批影片成功地运用喜剧方式来表现小人物的悲剧命运，幽默而细腻地揭示了普通人丰富复杂","的内心世界。","第三类是抒情诗风格的道德题材影片，如日本的《绝唱》、《远山的呼唤》。","第四类是心理探索道德题材影片，其典型作品是苏联影片《没有证人》。该片全片只有","两个主要人物和两个配角，完全是以细致入微的心理刻画方式来达到震撼人心的效果。","第五类是青少年道德题材影片，从道德角度来分析当前社会中青少年的道德观念与生活","态度，例如我国拍摄的《红衣少女》《长大成人》等。","电影艺术反映道德题材的势头，目前仍然方兴未艾，李安，他的成名作“家庭伦理三部","曲”包括《推手》、《喜宴》和《饮食男女》。","（3） 建筑是一种实用艺术和表现艺术， 作为传统文化的中国建筑艺术同其他艺术一样，","体现出特定的伦理道德观念。封建伦理道德观念非常强调尊卑、上下的等级秩序，将其作为","重要的道德规范和原则，体现在建筑中，名称、面积、规格不同。","（4）音乐作为一门表现艺术和听觉艺术，不能直接地再现社会生活，但在音乐中也渗","透着一定时代和社会伦理道德的因素，因此，东西方的历代思想家们才这样重视音乐的伦理","教化作用。孔子就反对郑声，贬低《武》乐，推崇《韶》乐。","道德是一种社会意识形态， 它本身是由经济关系决定的， 并随着经济关系的改变而改变，","因此， 道德具有时代性和社会性的特点。 道德的变化发展， 也必然会通过艺术作品体现出来。","（5）戏曲方面，汤显祖深受李贽思想的影响，他的代表作《牡丹亭》通过杜丽娘和柳","梦梅的爱情故事，揭露了封建礼教对青年男女爱情的压制和束缚，揭露了封建伦理道德下权","贵家庭关系的残酷和虚伪。这出剧正是通过这种“情”与“理”之间激烈的矛盾冲突，折射","出当时整个社会要求变革的时代心声，也折射出随着时代发展，社会伦理道德观念发生深刻","变化。","","","","","（6）文学方面，作为当时“市民文艺”突出代表的是话本或拟话本短篇小说集，以“三","言”和“二拍”为代表。","（7）明代木刻版画盛行，其中大量是适合广大市民阅读的戏曲小说的插图。这些木刻","版画广为流传，仅见于记载的明刊本插图剧曲就有 130 多部， 《西厢记》就有多种插图版本。","这些版画不但增加了戏曲和小说的感染力量，而且以视觉艺术的方式展示了社会习俗风尚的","时代变迁。","第五节  艺术与科学","一  艺术与科学的联系和区别","从总体上讲，艺术与科学二者之间既有联系，又有区别。","（1）从人类文化史来看，艺术与科学之间早有联系。","艺术与科学联姻有着三个辉煌时期。","第一个辉煌时期，是在古希腊时期。毕达哥拉斯学派就提出了“美是和谐”的思想。提","出了“黄金分割”的理论，以及音乐里的数量比例关系。","第二个辉煌时期，是在文艺复兴时期。这个时期的一些大艺术家，本身就是大科学家，","他们把许多自然科学的方法和原理运用到艺术创造中促进了艺术的完善与发展。达 ·芬奇把","几何学、透视学的原理运用到绘画艺术中。","第三个辉煌时期，是自 20 世纪下半叶以来的当代社会。现代科学技术更是对艺术产生","了巨大的影响，不但为艺术提供了从未有过的大众传播媒介，而且创造出了新的艺术种类和","艺术形式，如电影艺术、电视艺术和计算机多媒体艺术等。","这三个辉煌时期的出现，都是科学与艺术飞速发展的时期，也是人类物质文明与精神文","明飞速发展的时期。","（2）艺术与科学之间确实又有很大的不同，并且在一定程度上存在着对立的现象。","①从本质上讲，科学是人类认识客观世界的知识总和；艺术是人类进行审美创造的最高","形式。","②从目的上讲，科学求真，它的任务是揭示事物发展的客观规律；艺术求美，它的任务","是满足人们精神文化生活方面的审美需要。","","","","","③从思维方式上讲，科学主要运用抽象思维，强调理性因素；艺术主要运用形象思维，","强调情感因素。","④从具体操作来讲，科学应当客观冷静地对待事物，准确地揭示事物的本来面目；艺术","则是一种主观色彩很浓的创造活动，它除了反映生活外还应当评价生活与表现情感。","⑤从成果上讲， 科学理论应当具有普遍性， 放之四海而皆准；艺术作品必须具有独创性，","可谓前无古人后无来者。","二  现代科学技术对艺术的渗透和影响","第一，现代科学技术对艺术的影响，表现在为艺术提供了新的物质技术手段，促使新的","艺术种类和艺术形式的产生。电影发展史上的三次重大变革，均与科学技术有着十分密切的","联系。第一次重大变革是电影从无声到有声；第二次重大变革是电影从黑白到彩色；第三次","重大变革是目前正方兴未艾的计算机多媒体技术与数字技术。","第二，现代科学技术对艺术的影响，还表现在为艺术创造了前所未有的文化环境和传播","手段，使人们比起从前来有更多的时间、更多的闲暇更多的资金运用于艺术，为艺术提供了","前所未有的文化环境。","第三，现代科学技术对艺术的影响，又表现在艺术与技术、美学与科学的相互结合与相","互渗透，对人类生活产生了深刻影响，也促进了科学技术与文学艺术自身的发展。旨在统一","产品的实用功能与审美功能的新学科——设计——便应运而生。","第四，现代科学技术对艺术的影响，更表现在科学领域的重大发现对艺术观念和美学观","念产生了巨大而深刻的影响，例如系统论、控制论、信息论、模糊数学等观点和方法，已经","被运用到艺术创作和艺术研究之中，成为某些艺术理论和艺术批评的观点和方法。同时，现","代科学技术的迅速发展，也给各门艺术的研究和美学的研究带来了许多新的课题。","另外，现代科学技术的进步既促进了艺术的发展，也对艺术产生了某些消极的影响，如","大众传播媒介带来了艺术的商品化与消费化倾向，导致大众审美水平降低等不良后果。","","","","","中编  艺术种类","由于艺术分类的原则和角度不同，在近现代艺术理论中出现了多种分类的方法，其中最","主要的有以下几种：","第一种艺术分类方法是以艺术形象的存在方式为依据，将艺术区分为时间艺术（音乐、","文学）、空间艺术（雕塑、绘画）和时空艺术（戏剧、影视）。","第二种艺术分类方法是以艺术形象的审美方式为依据， 将艺术区分为听觉艺术 （如音乐） 、","视觉艺术（如绘画）和视听艺术（如戏剧）。","第三种艺术分类方法是以艺术作品的内容特征为依据，将艺术区分为表现艺术（音乐、","舞蹈、建筑、抒情诗等）和再现艺术（绘画、雕塑、戏剧、小说等）。","第四种艺术分类方法是以艺术作品的物化形式为依据，将艺术区分为动态艺术（音乐、","舞蹈、戏剧、影视等）和静态艺术（绘画、雕塑、建筑、实用工艺等）。","第五种艺术分类方法是近年来在欧美一些发达国家刚刚兴起的一种最新分类方法，这就","是把艺术分为：视觉艺术，包括绘画、雕塑、摄影、建筑、工艺，以及现代艺术设计、广告","艺术、电影艺术、计算机三维动画、动漫、游戏软件，等等；表演艺术，包括音乐、舞蹈、","戏剧，以及在发达国家近年来广受欢迎的音乐剧，等等。","第六种艺术分类方法是根据艺术的美学原则将整个艺术区分为五大类别， 即实用艺术 （建","筑、 园林、 工艺美术与现代设计） 、 造型艺术 （绘画、 雕塑、 摄影、 书法） 、 表情艺术 （音乐、","舞蹈） 、 综合艺术 （戏剧、 戏曲、 电影艺术、 电视艺术） 和语言艺术 （诗歌、 散文、 小说） 等。","艺术分类的意义在于通过揭示各门艺术自身的特性和发展规律，以及它们各自不同的物","质媒介和艺术语言，从而更加深入地认识和掌握各门艺术的审美特征和美学实质，进一步推","动各门艺术的提高和发展。","","","","","第五章  实用艺术","第一节  实用艺术的主要种类","所谓实用艺术，是指实用与审美相结合的表现性空间艺术，主要包括建筑艺术、园林艺","术、工艺美术与现代设计等。","实用艺术与其他艺术的重要区别之一，就在于它不仅能够满足人们精神上的审美需要，","而且还在一定程度上满足人们物质上的实用需要， 如建筑供人居住， 实用工艺品供人使用等。","现代设计便应运而生，包括平面设计、服装设计、家具设计、装潢设计、广告设计，乃至环","境设计、工业产品设计。","实用艺术既有实用价值，又有审美价值。实用艺术基本上都是通过具有实体性的物质材","料，创造出具有实用性和审美性的静态艺术品。实用艺术不注重模仿客观事物，而是注重表","现艺术家的审美理想或美学追求，因此，它不强调再现性，而强调表现性，从而形成了实用","艺术表现性的特点。","同时，实用艺术又是以空间为存在方式的一类艺术，应当划归空间艺术的范围。所以，","实用艺术最基本的特征是实用性与审美性相结合，它是建筑艺术、园林艺术、工艺美术与现","代设计等一大类表现性空间艺术的总称。","一  建筑艺术","（1）建筑，是指建筑物和构筑物的通称，是人类用物质材料修建或构筑的居住和活动","的场所。所谓建筑艺术，则是指按照美的规律，运用建筑艺术独特的艺术语言，使建筑形象","具有文化价值和审美价值，具有象征性和形式美，体现出民族性和时代感。","古罗马建筑师维特鲁威就提出了建筑的三条基本原则 :“实用、坚固、美观”。建筑的","类型很多，包括民用建筑如住宅、商店等，公共建筑如图书馆、会议厅等，娱乐建筑如电影","院、音乐厅等，工业建筑如仓库、车间等，宗教建筑如寺庙、教堂等，以及纪念性建筑如陵","","","","","墓、纪念堂等。从总体上讲，任何建筑都应当是物质功能与审美功能、实用性与审美性、技","术性与艺术性的统一。","（2）建筑艺术应当是“建筑”与“艺术”二者的“和谐统一”，既满足人的物质需要","和使用需要， 又满足人的精神需要和审美需要。 建筑艺术是一种立体作品， 属于空间造型艺术，","建筑的审美特点主要表现为它的造型美。人们在观赏任何一座建筑物时，首先感受到的总是","它的外观造型。例如，北京故宫、西藏布达拉宫、南京中山陵、巴黎圣母院、悉尼歌剧院等。","（3）各门艺术都有自己独特的艺术语言，建筑艺术也不例外。建筑的艺术语言和表现","手段非常丰富，包括空间、形体、比例、均衡、节奏、色彩、装饰等许多因素，正是它们共","同构成了建筑艺术的造型美。","①空间，是建筑的基本形式要素，建筑主要通过创造各种内外空间来满足人们的实际需","要。天坛，就是用有形的建筑实体来表现无形的天宇。","②形体，主要是指建筑物的总体轮廓，通过线条和形体、空间和实体的不同组合方式，","以及建筑与环境的和谐统一，突出建筑物独特的个性色彩和特有的艺术感染力。南京的中山","陵依山而建，把连绵不断的自然山势当作建筑空间的有机组成部分。","③比例，主要是指巧妙处理建筑物各部分之间的比例关系，建筑物长宽高的比例、凹与","凸的比例、虚与实的比例等。北京人民大会堂除了整个建筑的巨大形体外，外观给人突出印","象的就是那些巨大的圆柱。","④均衡，主要是指建筑在构图上的对称，包括建筑物前后、左右、上下各部分之间的关","系，均衡对称常常给人一种严肃庄重的感觉，增加崇高的美感。如北京的故宫。","⑤节奏，是指通过建筑物的墙、柱、门、窗等构成部分有规律的变化和排列，产生一种","韵律美或节奏美。在这一点上，建筑和音乐具有共同之处，因而人们把它们分别说成是“凝","固的音乐”和“流动的建筑”。故宫的廊柱，从天安门经过端门到午门，就有着明显的节奏","感，两旁的柱子有节奏地排列，形成连续不断的空间序列。","⑥色彩，也常常作为一种重要手段构成建筑特有的艺术形象，给人们带来独特的审美感","受和难忘的印象。故宫，总体色彩是金碧辉煌，朱红色的围墙、白色的台基、金黄色的琉璃","瓦顶、大红色的柱子和门窗，使这座皇宫的色彩别具一格。","⑦装饰，中国传统建筑十分注意屋顶的装饰，不但在屋角处做出翘角飞檐，饰以各种雕","刻彩绘，还常常在屋脊上增加华丽的走兽装饰。","","","","","（4）建筑艺术作为民族文化的体现和时代精神的镜子，总是以直观形象的方式反映出","一定的社会意识形态和深刻的历史文化内涵。欣赏建筑艺术时，除了欣赏它外观的造型美之","外，更应当鉴赏它内在的艺术意蕴和文化内涵，从而认识时代、认识社会、认识历史。","中世纪的欧洲，宗教统治根深蒂固，在建筑艺术中也鲜明地体现了出来，如有名的“哥","特式建筑” ， 就几乎反映了整个中世纪社会生活的复杂内容。 以巴黎圣母院为例。18 世纪初叶，","反映贵族审美趣味的“洛可可式建筑”风格，从法国兴起后很快盛行于欧洲。洛可可式建筑","大多外形富丽堂皇，装饰奇特精巧，复杂的曲线故意造成不对称感。 18 世纪后半叶开始，","启蒙运动的思想在欧洲大陆广泛传播，洛可可式建筑也逐渐让位给“新古典主义建筑”。","（5）在所有艺术门类中，建筑艺术与物质条件和技术条件的关系最为密切。因此，建","筑作为一个技术与艺术的综合体，它的审美功能总是随着建筑技术与建筑材料的改变而发生","变化。 世界各国的建筑从木结构建筑， 到砖石结构建筑， 再到钢筋水泥建筑、 轻质材料建筑等，","其美学思想也随之产生了巨大的变化。19 世纪末叶，现代建筑艺术开始崛起。20 世纪 20 年","代开始，“包豪斯学派”主张把建筑、美术、工艺等按照现代美学原则结合起来，主张现代","建筑艺术理论。","现代建筑艺术的代表作，包括纽约的古根汉姆艺术馆、美国匹茨堡市的流水别墅、华盛","顿的国家美术馆东馆、巴黎的蓬皮杜文化艺术中心、澳大利亚的悉尼歌剧院。现代中国建筑","艺术也取得了极大的发展，尤其是 20 世纪 50 年代末期出现的北京十大建筑，将民族传统建","筑艺术和现代建筑艺术结合起来，体现了鲜明的时代精神和民族风格。","被称为西方现代建筑四位大师之一的美国著名建筑家赖特提倡“有机建筑”，认为建筑","应当从属于周围的自然环境。赖特的流水别墅；由丹麦设计师约翰 ·伍重设计的澳大利亚著","名的悉尼歌剧院。","二  园林艺术","（1）所谓“园林”，是指“在一定的地域运用工程技术和艺术手段，通过改造地形（或","进一步筑山、叠石、理水）种植花草、营造建筑和布置园路等途径创作而成的美的自然环境","和游憩境域”。从广义来讲，园林艺术也是建筑艺术的一种类型。但由于园林艺术更注重观","赏性，并且通过撷取自然美的精华，将自然美与建筑美融合在一起。因此，园林艺术具有许","多自身的特点，人们往往又将它和建筑并列为实用艺术中的不同类型。","","","","","（2）世界三大园林体系，包括东方园林（以中国园林为代表）欧洲园林（以法国园林","为代表），以及阿拉伯式园林。中国园林特别重视人与自然的亲和，可称为自然式；欧洲园","林强调几何形图案，崇尚人工美，可称为几何式；阿拉伯式园林发源于古代巴比伦和波斯，","主要是以十字形道路交叉处的水池为中心的格局。","（3）中国古典园林可以分为北方大型皇家园林和江南小型私家园林两大类型。前者如","北京的圆明园、颐和园，承德的避暑山庄等；后者如苏州的拙政园、网师园、西园、留园，","扬州的何园、个园，上海的豫园等。","①中国古典园林最突出的特点，是追求一种诗情画意的审美境界。将自然美和建筑美有","机地融合在一起，在有限的空间，创造出深远的意境，将山水、花木和亭台楼阁、厅堂廊榭","等巧妙地结合起来，并且特别注意从诗词歌赋中吸取精华，追求情景交融的意境美。","②中国园林十分重视营造自然美和建筑美。 一方面中国古典园林充分利用与创造自然美，","几乎所有园中都有水池、假山、花草、树木等，呈现出一种小桥流水、荷花飘香的自然风光。","如苏州四大古名园之一的拙政园。另一方面中国古典园林又非常重视建筑美，注意运用中华","民族的建筑艺术形式，讲究亭、台、楼、阁、厅、堂、廊榭等建筑形式的美感，并且十分注","意使这些建筑物同周围的环境融为一体。例如扬州的何园。","③中国园林真正的精华与核心是它的文化美。中国园林艺术深深植根于民族文化沃土，","因而具有浓郁的民族风格和民族色彩。中国古典园林中，大量采用楹联、匾额、碑刻、书画","题记等，有的还流传着许多为园林增添异彩的传说或典故，真可以说是将自然风景美、建筑","艺术美和历史文化知识三者融为一体，处处使人感受到悠久民族文化传统的氛围。例如，作","为苏州四大古名园之一的留园，狮子林。","④在中国园林艺术里，也蕴藏着十分丰富的美学思想，颐和园就采用了借景、分景、隔","景等多种艺术手法来创造空间美感。 宗白华先生认为:“无论是借景、 对景， 还是隔景、 分景，","都是通过布置空间、组织空间、创造空间、扩大空间的种种手法，丰富美的感受，创造了艺","术意境。中国园林艺术在这方面有特殊的表现，它是理解中国民族的美感特点的一个重要的","领域。”","三  工艺美术与现代设计","（1）工艺美术，又可称为实用工艺，一般是指在造型和外观上具有审美价值，与人类","","","","","的日常生活相关的一类美术品的总称。工艺美术直接受到物质材料和生产技术的制约，具有","鲜明的时代风格和民族特色。","（2） 主要包括以下三大类 ： 一类是经过艺术处理的日常生活实用品， 如漂亮的绣花枕套、","精致的被面床单、美观的玻璃器皿等；另一类是民间工艺美术品，如竹编器件、草编器件、","蜡染织物、泥塑、木雕、剪纸等；再一类是特种工艺美术品，如景泰蓝器皿、象牙雕刻、瓷","器、玉雕等，它们采用的原材料比较珍贵。","考古材料证明，实用工艺是人类历史上最古老的艺术种类之一。大汶口出土的兽形器，","马家窑尖底瓶。","（3） 实用工艺美术品， 顾名思义， 首先应当具有实用性， 审美性应当寓于实用性之中。","甚至作为观赏用的特种工艺品，也需要在设计中考虑到适应环境和满足消费者的需求。实用","工艺美术品应当适用、经济、美观。","（4）工艺美术品的审美特性与建筑艺术相仿，集中体现为造型美。工艺美术品十分注","重造型设计， 并且尽量发掘材料和装饰的潜力， 注意运用色彩、 线条、 形状等多种形式因素，","以及夸张、变形、均衡等多种艺术手法，来创造工艺美术品的外观形式美。金银错工艺品。","为了实现造型美，会挖掘和发挥原材料的美，如充分利用木质天然纹理的美，利用紫砂","器皿的色泽与质感等，有时甚至利用原材料的瑕疵或斑痕，通过精心构思，取得意想不到的","艺术效果。例如著名的玛瑙雕《虾盘》。","（5）中华民族灿烂的文化宝库中，工艺美术品是重要的组成部分，它们具有鲜明的民","族风格和时代特色。从仰韶文化时期的彩陶，到奴隶制社会时期的青铜器，从战国、秦、汉","时期的漆器，到唐代的丝绸制品和“唐三彩”，从宋代精美的陶瓷工艺品，到明代简洁古朴","的木器和清代富丽华贵的景泰蓝。","（6）现代设计（design），是从传统的工艺美术中发展起来的。“它是工业革命后，从","包豪斯到现在国际上广泛兴起的一门交叉性应用学科，既区别于手工业品制作也不同于纯艺","术品创作，它是在现代大工业生产基础上产生的工业产品创新的社会实践形态。”","现代设计是 20 世纪中叶迅速发展起来的，涉及范围十分广泛。从总体上讲，现代设计","大致包括以下三个方面的内容：","其一是产品设计，从家具、餐具、服装等日常生活用品到汽车、飞机、电脑等高新技术","产品，都属于产品设计的范畴。它最突出的特点，是将造型艺术与工业产品结合起来，使得","","","","","工业产品艺术化。产品设计追求功效与审美、功能与形式、技术与艺术的完美统一。","其二是环境设计，是指人类对于各种自然环境因素和人工环境因素加以改造和组织，对","物质环境进行空间设计，使之符合人的行为需要和审美需要。“环境设计包括室内设计、庭","园设计、建筑设计、城市设计和国土设计等，它是以整个社会和人类为基础，以对空间进行","规划为中心的创造性活动。”环境设计主要涉及以下三个方面：一是以自然风景和名胜古迹","为主的景观环境，二是以城镇街区和建筑组群为主的空间序列环境，三是以陈设、小品和人","工绿化为主的日常生活环境。","其三是视觉设计，是指人们为了传递信息或使用标记所进行的视觉形象设计。视觉设计","的范围十分广泛，包括装帧设计、印刷设计、包装设计、展示陈列设计、视觉形象设计、广","告设计等。","（7）综上可知，现代设计已经同传统的工艺美术有了根本的区别。现代设计针对的是","现代化的工业批量生产， 体现出技术与艺术的完美统一， 使产品既能够满足人的物质需要 （使","用功能），又能满足人的精神需要（审美功能）。","第二节  实用艺术的审美特征","一  实用性与审美性","第一，应当对实用性作比较宽泛的理解。","第二，实用艺术以实用性与审美性相结合为基本特点，但对于大多数实用艺术品来讲，","实用是为主的，审美应当从属于实用，服务于实用。","第三，实用艺术与生产技术具有紧密的联系，物质材料直接制约和影响着实用艺术的展。","第四，实用性尽量做到省工省料和降低成本。","实用艺术可以说是一种最普及、最常见的大众艺术，在美育中具有特殊的地位和作用。","一般认为，美育的实施途径包括家庭美育、学校美育和社会美育三个方面，实用艺术在这三","个方面都可以发挥作用。","随着社会生产力的不断发展和人民群众生活水平的不断提高，审美性在实用艺术中的比","重越来越大，人们对实用艺术美的要求，比过去任何时候都更加广泛和迫切。","","","","","二  表现性与形式美","实用艺术作为表现性空间艺术，不注重模仿客观事物的再现性，而是注重表现某种朦胧","抽象的情调和意味。 英国现代著名美学家克莱夫·贝尔所说的那样， 是一种 “有意味的形式” ，","也就是用色彩、线条、造型、图案等外部形式，来传达和表现出一定的情绪、气氛、格调、","意味。而所谓“意味”，就是某种朦胧宽泛的情绪或情感。","所谓形式美，主要是指各种形式因素的有规律的组合，从而形成了某些共同的特征和法","则，它包括色彩、线条、形体等因素，也包括对称均衡、多样统一等形式法则。人类在长期","实践活动中发现和总结了许多形式规律，并且不断地创造出新的形式规律，从而大大提高了","美的创造力和艺术的表现力。 古希腊帕提农神庙， 采用了雄浑刚健的多立克柱式， 造型端庄，","比例匀称，被视为古希腊神庙的典范。帕提农神庙之所以这样美，是因为它的高、宽和柱间","距等，都符合“黄金分割”比例的形式美法则。","三  民族性与时代性","实用艺术具有浓郁的民族风格和鲜明的时代特色。因此，实用艺术还有一个重要的审美","特征，就是民族性与时代性的有机统一。","由于中国在制瓷方面的杰出成就，被誉为“瓷器之国”；中国古典园林，同样具有与西","方园林和阿拉伯式园林迥然不同的民族风格，我国古典园林与文化传统关系密切，许多园林","意境取材于古代文化，引用神话传说，借鉴文化典故，诗化自然风光，追求诗情画意的审美","境界。","实用艺术的时代性，首先在于它总是表现出特定时代、特定社会的情感和理想。殷商时","期的青铜器，大多是兽面纹亦即“饕餮纹”，它既像牛头，又像虎头，既像某种凶猛的兽类，","又像令人恐怖的妖魔鬼怪，它显示出一种神秘的威力，一种恐怖狰狞的美，具有明显的奴隶","社会印记，象征着奴隶主阶级统治的权威和秩序。到了铁器时代的春秋中晚期和战国时代，","更是“礼崩乐坏”的时期，对传统宗法束缚的挣脱和对世间现实生活的肯定，出现了狩猎、","采桑、宴饮、攻占等各种现实生活的图景，表明时代已经发生了巨大变化。","","","","","第三节  中外实用艺术精品赏析","一  北京故宫（建筑艺术）","故宫是中国古代皇宫建筑群，明清两朝的皇宫。位于北京城的中心，明清时称紫禁城，","1925 年始称故官。","故宫占地面积 72 万平方米， 现存建筑980 余座， 房屋9000 余间， 建筑面积15 万平方米。","分为南部前朝部分和北部后寝部分，沿着一条南北向的中轴线排列，南北取直，左右对称。","前朝有太和殿、中和殿、保和殿这三座故宫中最高大的建筑物。","故宫是全世界规模最大、保存最完好的古代皇宫建筑群，它的平面布局、立体效果，以","及形式美都是罕见的，也是中国古代建筑最高水平的杰作。","［赏析］","于明代永乐四年 （1406） 始建， 历时14 年基本建成， 明清两代先后有24 位皇帝在此居住。","北京故宫作为明清皇家宫殿，突出了皇权至高无上和封建等级森严的社会观念。在故宫","建筑群中，以皇帝处理政务的三大殿为主。三大殿中又以太和殿最为高大雄伟，位居故宫的","中心部位，俗称金銮殿。中国封建社会的建筑艺术，突出了“皇权至上”的理念，北京故宫","就是一个鲜明代表；而欧洲中世纪的建筑艺术，都是突出了“神权至上”的理念，法国著名","的哥特式教堂巴黎圣母院就是一个典型的例子。","封建社会的建筑艺术体现出那个时代的伦理观念和社会制度。故官作为封建社会的皇宫","建筑， 自然也十分讲究对称、均衡，故宫最重要的建筑都依次排列在中轴线上，其他建筑","则对称、均衡地分布左右，形成个十分稳定的建筑群。甚至整个北京城的建筑，当年也是以","紫禁城为中心，左右对称、南北均衡。","色彩和装饰也都渗透着儒家的观念意识，凝聚着封建社会的历史文化。从色彩来看，故","宫的总体色彩是金碧辉煌、富丽堂皇。尤其是朱红色的围墙、白色的台基、金黄色的琉璃瓦","顶、大红色的柱子和门窗，故宫建筑的屋脊上都有走兽，古代大型建筑屋脊上的雕塑装饰物","都是有严格规定的， 包括数量和种类都不能随便乱用， 对于皇室、 大臣、 平民都有严格规定，","故宫各个大门的门钉也十分讲究。","","","","","二  悉尼歌剧院（建筑艺术）","悉尼歌剧院是澳大利亚悉尼市班尼朗岛上，丹麦设计师约翰 ·伍重设计于 1957 年，建成","于 1973 年。根据班尼朗岛三面临海、南面与陆地相连的地理特点，在歌剧院的上方设计了","三组薄壳屋顶，使整座建筑物不仅具有东、西、南、北四个立面造型，还获得了从上往下看","的第五个立面的造型效果。成为后现代建筑最成功的作品之一。","［赏析］","古罗马建筑师维特鲁威就提出了建筑的三原则 :“实用、坚固、美观”。","澳大利亚的悉尼歌剧院堪称“有机建筑”或环境艺术的一个杰作。造型奇特，远看像帆","船，近看像贝壳，从上往下看又像是荷花，都和水有关。巧妙地利用了环境，使建筑成为环","境的艺术。","三  北京颐和园（园林艺术）","颐和园始建于 1750 年 1860 年在战火中严重损毁， 1888 年在原址上重新进行了修缮。","主要由万寿山和昆明湖组成，全园分三个区域：以仁寿殿为中心的政治活动区；以玉澜堂、","乐寿堂为主体的生活区；由万寿山和昆明湖组成的风景游览区。共有亭、台、楼、阁、廊、","榭等不同形式的建筑三千多间。","吸收了中国各地建筑的精华，容纳了不同地区的园林风格。人工景观、自然山峦和开阔","的湖面和谐地融为一体，堪称中国风景园林设计中的杰作。","［赏析］","园林艺术则首先是为了人的游玩，将审美需要放在第一位。尤其是中国园林历史悠久、","富于民族特色。","世界三大园林体系， 包括东方园林 （以中国园林为代表） 欧洲园林 （以法国园林为代表） 、","阿拉伯式园林（从古代巴比伦园林和波斯园林发展起来）。中国园林特别重视人与自然的亲","和，可称为自然式；欧洲园林强调规整的几何形图案，崇尚人工美；阿拉伯式园林常常将水","池设计在十字形道路交叉处的中心位置，成为这类园林的传统样式与固定格局。而日本园林","作为东方园林的一种特殊样式，既受到了中国园林的影响，也受到了欧洲园林的影响，并且","深受佛教禅宗美学的影响，从而发展出自己的特色。","北京颐和园是清代留存的大型皇家园林，借鉴了中国历代园林艺术的精华，容纳了不同","","","","","地区园林艺术的风格。","大量采用了对比的手法。从整体上看，万寿山上建筑密集、雕梁画栋，昆明湖上碧波荡","漾、长堤小岛，山与水之间形成了强烈的对比；与此同时，颐和园的前山建筑富丽堂皇，后","山景色幽静深邃， 人工美与自然美之间也形成了强烈的对比；除此之外， 昆明湖上游船戏水、","来往穿梭，与昆明湖边巨大石块雕砌而成的清晏舫（石舫，园中著名的水上建筑），更是形","成了动与静之间的强烈对比。","颐和园在造园时就有意采用了“借景”“分景”“隔景”等多种艺术手法。颐和园中的","“借景”，是指站在颐和园长廊东头的鱼藻轩，向西眺望，可以望见园外的玉泉山和远处的","香山。长廊还有一个很重要的美学功能，这便是“分景”。这条贯通东西的长廊，将颐和园","分成了以万寿山为主的北部山区和以昆明湖为主的南部湖区。采用了“隔景”的艺术手法，","就是用围墙隔出了一个“园中之园”，就是在万寿山东麓的谐趣园，此园仿照江苏无锡惠山","脚下的寄畅园建造，富有江南园林情趣。","四  苏州拙政园（园林艺术）","始建于 15 世纪初，历时 16 年建成，是江南古典园林的代表。现存建筑大多为太平天国","及其后修建，但明清旧制大体尚在。","全园包括东、中西三个部分和部分住宅，主要景点有香洲、留听阁、浮翠阁、雪香云蔚","亭、秫香馆、天泉亭、三十六鸳鸯馆、荷风四面亭等。","[ 赏析 ]","江南小型私家园林更富于中国传统艺术精神，更具有情景交融的艺术意境，更能反映文","人士大夫的审美情趣。江南私家园林以苏州园林为代表。苏州园林众多，其中最负盛名的是","四大名园，即拙政园、留园、怡园、网师园。","中国北方大型皇家园林气势宏伟、富丽堂皇、面积巨大、以大见长，堪称崇高或壮美，","体现出皇家园林艺术的气派；中国南方小型私家园林则都是小巧玲珑、 曲径通幽、 诗情画意、","以小取胜，堪称优美或秀美，体现出私家园林艺术的风采。前者可以用颐和园作为代表，后","者则可以用拙政园作为代表。","拙政园的造园艺术通过以少胜多的方法，在不大的天地里创造出美妙的空间，真正体现","出明代园林家计成《园冶》一书所讲的“虽由人工，宛自天成”的境界，创造出一种重含蓄、","","","","","重神韵，咫尺山林、小中见大的景观效果。","中国园林艺术是由自然美、建筑美、文化美三部分构成。园林的自然美由水池、假山、","花草、树木等构成；园林的建筑美由亭、台、楼、阁、廊、榭、堂等民族建筑形式构成。然","而，中国园林真正的精华与核心是它的文化美。中国古典园林中，大量采用楹联、匾额、碑","刻、书画题记等；有的还流传着许多为园林增添异彩的传说或典故，中国园林艺术深深植根","于中华民族文化沃土，将自然风景美、建筑艺术美、历史文化美三者融为一体，体现出浓郁","的民族风格和民族特色。","拙政园正是体现出中国园林艺术的基本特征，寓情于景、情景交融、诗情画意、富有意","境。“与谁同坐轩”体现出中国传统艺术主张情景交融、心物一元、天人合一的审美理想。","","","","","第六章  造型艺术","第一节  造型艺术的主要种类","造型艺术是指运用一定的物质材料（如颜料、纸张、泥石、木料等），通过塑造静态的","视觉形象来反映社会生活与表现艺术家思想情感的艺术。它是一种再现性空间艺术，也是一","种静态的视觉艺术。它主要包括绘画、雕塑、摄影、书法等。","造型艺术与实用艺术二者之间既有联系，又有区别。","①从联系上讲，它们都属于空间艺术，并且都是以平面或立体的方式，用物质材料创造","出静态的艺术形象，使人们凭借视觉感官就可以直接感受到。","②从区别上讲，造型艺术（绘画、雕塑、摄影、书法）的基本特征是造型性，即通过美","的形式来表现艺术家的思想情感和丰富的文化内涵， 它并不直接模拟或再现客观对象， 因而，","这类艺术属于表现性空间艺术。 二者之间还有一个重要区别， 即造型艺术主要具有审美功能，","满足观赏者的精神需要；而实用艺术兼有实用功能与审美功能，同时满足人们的物质需要和","精神需要。","一  绘画艺术","（1）绘画是造型艺术中最主要的一种艺术形式。它是一门运用线条、色彩和形体等艺","术语言，通过构图、造型和设色等艺术手段，在二维空间（即平面）里塑造出静态的视觉形","象的艺术。","①从体系来划分，绘画分为东方绘画和西方绘画两大体系。","②从使用的材料、工具和技法来划分，则分为中国画、油画、版画、水彩画、水粉画、","粉笔画等等。","③从题材内容来划分，又可以分为肖像画、风景画、风俗画、静物画、历史画、宗教画、","动物画等体裁。","","","","","④从作品的形式来划分，还可以分为壁画、年画、连环画、宣传画、漫画等样式。","（2）中国画的特点：","第一，首先表现在工具材料上，往往采用中国特制的毛笔、墨或颜料，在宣纸或绢帛上","作画。因此，中国画又可称之为“水墨画”或“彩墨画”。“笔墨”成为中国画技法和理论","中的重要术语， 所谓 “笔” ， 是指勾、 勒、 皴、 点等运用毛笔的不同技巧和方法；所谓 “墨” ，","则是指中国画以墨代色，运用烘染、泼、积等墨法，“墨分五彩”（指墨色的焦、浓、重、","淡、清这五种不同的色度）。","第二， 在构图方法上不受焦点透视的束缚， 多采用散点透视法。 最主要的有三种， 即 “全","景式空间”“分段式空间”和“分层式空间”。","①“全景式空间”是一种由高转低、由远转近的回旋往复式流动空间。荆浩《匡庐图》。","②“分段式空间”突破了时空的局限，可以将不同时间和不同空间的事物安排在一个画","面中，犹如一组运动镜头把不同的场面集中到一起，组成一幅整体有机的画面。顾闳中《韩","熙载夜宴图》；张择端《清明上河图》。","③“分层式空间”，最典型的是长沙马王堆汉墓出土的 T 形帛画，画分三层，分别展现","了天界、人间、地界的不同景况，并且通过一个共同的时间把这三个空间联系起来。","第三，绘画与诗文、书法、篆刻有机地结合，将画意、诗情、书法融为一体。文人画将","诗、书、画、印的结合推向完美的艺术境界。","第四， 中国画的特点来源于中华民族悠久的传统文化和丰富的美学思想。 不管是工笔画，","还是写意画，在处理形神关系时都要求“神形兼备”，在造型和意境的表达上都要求“气韵","生动”。","（3）如果用一句话来简单概括中国画与西方绘画的区别，那就是西方绘画更加重视客","观物象形貌逼真的再现，中国画则更加重视物象内在精神和作者主观情感的表现。因此，中","国画非常强调“立意”和“传神”。东晋顾恺之就提出“以形写神”和“迁想妙得”。南齐","画论家谢赫提出了著名的“绘画六法”，其中第一条便是“气韵生动”，张彦远将绘画创作","规律总结为“意存笔先，画尽意在”。","（4）中国艺术精神，用六个字来概括，就是:“道” （中国传统艺术的精神性）、 “气”","（中国传统艺术的生命性）、“心”（中国传统艺术的主体性）、“舞”（中国传统艺术的","乐舞精神）、“悟”（中国传统艺术的直觉思维）、“和”（中国传统艺术的辩证思维）。","","","","","正是这种中国传统艺术的精神，使中国艺术迥异于西方艺术，中国绘画迥异于西方绘画，而","具有自己鲜明的民族风格与民族特色。","（5）西方绘画的审美趣味，在于真和美。西方绘画追求对象的真实和环境的真实。十","分讲究比例、明暗、透视、解剖、色度、色性等科学法则，运用光学、几何学、解剖学、色","彩学等作为科学依据。","概括地讲，如果中国绘画尚意，那么西方绘画则尚形；中国绘画重表现、重情感，西方","绘画则重再现、重理性；中国绘画以线条为主要造型手段，西方绘画则主要是由光和色来表","现物象；中国绘画不受空间和时间的局限，西方绘画则严格遵守空间和时间的界限。","总之，西方绘画注重再现与写实，同中国绘画注重表现与写意，形成鲜明差异。","二  雕塑艺术","（1）雕塑是一种重要的造型艺术。雕塑是立体（三维）的空间艺术和视觉艺术，它是","用一定的物质材料制作出具有实体形象的艺术品，由于制作方法主要是雕刻和塑造两大类，","故被称为雕塑。","（2） 从制作工艺来看， 它可以分为雕和塑两大类。 还可以进一步细分为刻、 镂、 塑、 凿、","琢、铸等各种技艺和手法。","从体裁来区分，雕塑又可以分为纪念性雕塑；建筑装饰性雕塑；城市园林雕塑；宗教雕","塑；陵墓雕塑；陈列性雕塑。","从样式来区分，雕塑还可以分为头像、胸像、半身像、全身像、群像等。从表现手法和","形式来区分，雕塑一般又可分为圆雕、浮雕和透雕三类。","（3）在造型艺术中，雕塑与绘画、摄影、书法最大的区别，就在于雕塑是在三维空间","里用物质材料创造出实体形象。欣赏雕塑作品不仅需要依靠视觉感官去感受，而且还可以用","触觉去感知，使观赏者唤起更多的艺术想象。","三  摄影艺术","（1）摄影艺术是一门现代的造型艺术。它是摄影师运用照相机作为基本工具，根据创","作构思将人物或景物拍摄下来，再经过暗房工艺处理，塑造出可视的艺术形象，用来反映社","会生活与自然现象，表达作者思想情感的一种艺术样式。","","","","","（2）1839 年法国人达盖尔发明摄影技术。摄影艺术将技术性与艺术性结合起来，却不","是为了实用的目的，而是为了审美的需要。","（3）摄影艺术独具的审美特征主要表现在纪实性与艺术性的统一上。","①一方面摄影艺术具有纪实性，这首先表现在它运用科学技术手段能够逼真精确地将被","摄对象再现出来，使得摄影作品具有客观性、真实性。其次，这种纪实性还表现在它必须直","接面对被摄对象进行现场拍摄，如实地反映现实生活中实际存在的人物、事件和环境。","②另一方面，摄影艺术又必须在纪实性的基础上具有艺术性。摄影艺术形象的创造，首","先需要摄影师熟练掌握摄影的艺术技巧和艺术语言，熟练运用画面构图、光线、影调（或","色调）三种主要造型手段。其次需要摄影师主观情感的熔铸。","摄影作品应当通过光、色、影来体现艺术家的思想情感和艺术创造力。","（4）摄影艺术的样式和体裁繁多。","<1> 按感光材料和画面颜色，可以分为黑白摄影和彩色摄影；","<2> 按摄影器材和技术，可以分为航空摄影、水下摄影、全息摄影、红外线摄影等；","<3> 按题材来分，可以分为肖像摄影、风光摄影、舞台摄影、体育摄影、建筑摄影等。","在世界各国出现了各种不同的风格和流派，其中最主要的有：绘画主义摄影；纪实主义","摄影；印象主义摄影；超现实主义摄影；抽象主义摄影、前卫派摄影，等等。","四  书法艺术","（1）书法艺术是中华民族特有的一种传统艺术形式，它主要通过汉字的用笔用墨、点","画结构、行次章法等造型美来表现人的气质、品格和情操，从而达到美学的境界。形式上，","它是一门刻意追求线条美的艺术；内容上，它是一门体现民族灵魂的艺术。","（2）造型性可以说是书法艺术与生俱来的最重要特点。正因为这样，虽然也可以将书","法归为实用艺术之列， 但我们仍然主张将书法艺术与绘画艺术等一道， 归属于造型艺术之列。","中国书法建立在中国文字（汉字）的基础之上。迄今为止，世界上还只有汉字的书写真","正成为一门艺术。","（3）中华民族书法艺术随时代的发展体现出各种书体不断发展演变的过程。总体上，","汉字书法可以分为五种书体，即篆书、隶书、楷书、行书和草书。","书法艺术的基本技法和表现形式，主要是用笔、用墨、结构、章法、韵律、风格等几个","","","","","方面。","宗白华先生认为 :“中国的书法， 是节奏化了的自然， 表达着深一层的对生命形象的构思，","成为反映生命的艺术。”因此，中国的书法，不像其他民族的文字，停留在作为符号的阶段，","而是走上艺术美的方向，而成为表达民族美感的工具。","第二节  造型艺术的审美特征","一  造型性与直观性","顾名思义，造型艺术作为一门空间艺术和视觉艺术，它的审美特征首先体现在造型性和","直观性。","（1）造型艺术最基本的特征就是造型性。它是指艺术家运用一定的物质材料，塑造出","欣赏者可以通过感官直接感受到的艺术形象。 以塑造客观事物的形象来作为基本的表现方式。","另一方面，造型艺术的这一特点，使它只能用间接的方式去表现那些没有外部形体的客","观事物， 例如声音、 气味等， 以有形表现无形， 充分调动观众的联想和想象来达到艺术效果。","（2） 直观性， 或称视觉性， 也是造型艺术的重要特征之一， 它是由造型性派生出来的。","都是直接诉诸欣赏者的眼睛，凭借视觉感官来感受的。文学形象、音乐形象具有间接性和不","确定性， 需要通过想象去感知， 依靠情感去体验。 而造型艺术的形象却是以直接性、 具象性、","视觉性和永固性为根本特性。","二   瞬间性与永固性","（1）造型艺术要反映客观现实生活，就必须找到恰当的表现方式，也就是在动和静的","交叉点上， 抓住客观事物发展变化的某一瞬间的形象， 将它用物质材料和艺术语言固定下来，","这就是造型艺术瞬间性的特点。","莱辛在他的名著《拉奥孔》中，通过比较拉奥孔这个题材在古典诗歌（《荷马史诗》）","和古代雕塑中的不同表现手法，来论证了文学与造型艺术在本质特征上的根本区别。","莱辛认为，诗歌与雕塑之所以在处理同一题材时产生明显的区别，其根本原因就在于前","者是时间艺术，而后者是空间艺术。莱辛由此认为绘画表现动作时必须“寓动于静”，也就","是选取动作发展的某一瞬间。莱辛还进一步探讨了造型艺术（尤其是雕塑）如何选取最佳的","","","","","瞬间， 他以古希腊雕塑 《拉奥孔》 为例证 （这个作品就是选取了巨蛇缠住拉奥孔父子三人时，","受难者濒临死亡前最后挣扎那一瞬间）。","莱辛认为最佳的一瞬间，应当选取即将到达顶点前的那一顷刻因为“最能产生效果的只","能是可以让想象自由活动的那一顷刻了，我们愈看下去，就一定在它里面愈能想象出更多的","东西来”。“在一种激情的整个过程里，最不能显出这种好处的莫过于它的顶点。到了顶点","就到了止境，眼睛就不能朝更远的地方去看，想象就被捆住了翅膀。”","（2） 由于造型艺术必须采用物质材料和艺术语言将事物发展变化的典型瞬间固定下来，","使得造型艺术具有了永固性的特点。所谓永固性，就是指造型艺术的瞬间形象一旦被创作出","来，也就同时被物质材料固定下来，可以供人们多次欣赏，甚至可以千百年流传下去。正因","为如此，流传至今的原始艺术作品，其中相当数量是绘画、雕塑等造型艺术作品。","三  再现性与表现性","（1） 造型艺术的基本特征是再现性空间艺术， 再现性自然成为它最重要的审美特征之一。","但是，造型艺术同样要表现形象的内在意蕴，表现艺术家的情感，因此，表现性也是造型艺","术一个重要的审美特征。","（2）造型艺术同样离不开表现性，需要通过艺术作品来表现艺术家的思想情感与审美","追求。正如汉代文学家扬雄所说“书者，心画也”，这就是讲书法艺术作为写意的艺术，应","当在作品中表现出书法家的情感、情绪和审美理想。所谓“书如其人”“画如其人”“文如","其人”，正说明杰出的艺术作品都有自己独特的个性。","造型艺术的表现性，集中在以下三个方面：","<1> 其一，它要表现出对象内在的精神气质。中国画提倡“以形写神”“形神兼备”，","提倡“传神”“神似”，都是要求处理好形似与神似的关系，强调在创作中把握对象的精神","特征。亚里士多德就认为“画家所画的人物应比原来的人更美”，罗丹更明确地指出，“在","艺术中，有‘性格’的作品，才算是美的……因为性格就是外部真实所表现于内在的真实，","就是人的面目、姿势和动作，天空的色调和地平线，所表现的灵魂、感情和思想”，“美，","就是性格和表现”。","<2> 其二，造型艺术的表现性在于它传达了艺术家的思想情感和审美理想。南朝画家宗","炳在总结山水画创作经验时就提出“应目会心”，也就是画家在观察生活时，应当熔铸进自","","","","","己的思想感情。唐代画家张璪更是精练而深刻地概括了绘画创作中的主客体关系，就是“外","师造化， 中得心源” 。 黑格尔认为:“艺术作品比起任何未经心灵渗透的自然产品要高一层。 ”","绘画、 雕塑、 摄影这一类再现艺术中， 艺术家的情感和理想往往凝聚为作品的艺术形象，","也就是在再现中蕴藏着表现。因此，山水画中的一山一水都是画家的自我表现，都体现出画","家的种种思绪和情趣：花卉画中的梅兰竹菊，也成了中国古代文人画家性格和理想的化身，","他们通过描绘“四君子”来寄托自己的思想感情；人物画中的高人逸士实际上是画家在抒发","自己的情怀；红颜薄命的仕女图是画家在感叹自己的遭遇。书法艺术尤其擅长于表现艺术家","自身的情感。晋代“书圣”王羲之的代表作品《兰亭集序》堪称一篇流传千古的名迹，字里","行间不仅流露出当年兰亭风雅集会之时，王羲之乘兴而书的感情色彩，而且体现出鲜明的魏","晋风韵。这幅作品变化多端看似无法而万法皆备， 《兰亭集序》中，相同的字如二十个“之”","字、七个“不”字、六个“一”字等，绝不雷同。加上随手书写的自然姿态，浑然天成的节","奏起伏，颇得天然潇洒之美。因此，宗白华先生认为，这篇作品是“从晋人的风韵中产生的。","魏晋的玄学使晋人得到空前绝后的精神解放，晋人的书法是这自由的精神人格最具体、最适","当的艺术表现”。","<3> 其三， 造型艺术的表现性， 还在于艺术家自觉地运用形式美的法则去进行艺术创造。","再现艺术并不是完全照搬生活或模仿生活，它同样需要艺术家的创造性劳动。在造型艺术家","的手中，线条、色彩、构图也融入了艺术家独特的兴趣、爱好、个性从中也能感受到艺术家","的审美追求、创作特色，乃至于他的艺术风格和艺术流派。","第三节  中外造型艺术精品赏析","一  《韩熙载夜宴图》（绘画艺术）","《韩熙载夜宴图》，五代南唐画家顾闳中作。图为绢本纵 28.7 厘米，横 335.5 厘米，设","色画，现藏故宫博物院。此画是我国古代人物画的杰作，全幅长卷分为五段，以屏风和床榻","来起到了分隔画面的作用，各段相互联系，又独立成章，使全卷成为统一的大画面。","［赏析］","这幅长卷画可以分为“听乐”“赏舞”“休息”“演奏”“散宴”共五段，画面上的屏","风、床榻等作为隔断，它们既是画中的物件，同时又起了分隔的作用。","","","","","第一段“听乐”，表现的是夜宴上的演奏刚刚开始，韩熙载坐在床榻上与宾客们一起听","乐的情景，画上每个人的视线都集中到琵琶女的手上，好友与同僚，画家刻画出了他们各自","不同的姿态和神情。","第二段“赏舞”，韩熙载击鼓伴奏，旁边的宾客都在观赏舞蹈。","第三段“休息”，韩熙载坐在床榻上一边洗手，一边和众家眷交谈。","第四段“演奏”，韩熙载袒胸露腹盘腿而坐，挥着扇子欣赏乐伎演奏音乐。屏风两侧的","一男一女正在偷偷调情。","第五段“散宴”，宴会结束，韩熙载站立送客。","《韩熙载夜宴图》最精彩、最深刻的地方，在于表现出了夜宴过程中韩熙载自始至终闷","闷不乐、郁郁寡欢的精神状态。尽管夜宴的排场很豪华，气氛很热烈，韩熙载的形象在画中","也先后出现五次，但他始终处于沉思和压抑的精神状态。充分体现出画家顾闳中“传神”之","笔力。","二  《清明上河图》（绘画艺术）","《清明上河图》，中国北宋风俗画作品，绢本，淡设色画，纵24.8 厘米，横 528.7 厘米，","现藏故宫博物院，作者为北宋末年宫廷翰林画院画家张择端。","该作品是中国绘画史上最著名的社会风俗画杰作， 它描绘了清明时节， 北宋京城汴梁 （今","开封市）及汴河两岸的繁华景象和自然风光。全图分为三个段落，首段表现的是汴京郊野的","春光，中段集中展示水陆交通的集合点繁忙的汴河码头，后段则描绘了市区街道市井行人摩","肩接踵的热闹景象。","作品采用长卷形式， 运用了中国画特有的散点透视技法。 画中人物500 多个， 牲畜50 多匹，","车 20 多辆，大小船只 20 多艘。房屋、桥梁、城楼等也各有特色。其间穿插各种活动，注重","戏剧性，构图疏密有致，注重节奏感和韵律的变化，笔墨章法都很巧妙。同时该作品还具有","很高的历史价值，是研究北宋人文、地理、社会生活的珍贵资料。","［赏析］","大致可以划分为三段，“城郊景色”“汴河虹桥”“市区街道”三部分。","第一段“城郊景色”，描绘了汴京郊区农村景色。","第二段“汴河虹桥”是全画的中心，展现了汴河两岸繁荣的场景。这幅画中最引人注目","","","","","的焦点“虹桥”，这是一座横跨汴河之上的大型拱桥。桥下一艘大船正逆流而上，船身翘起","的弧形正与拱桥构成呼应关系。桥上站着众多围观者，密切关注着船夫们与水流搏斗的紧张","场面。","第三段“市区街道”，描绘汴梁城内市区的繁华气象。","《清明上河图》犹如宋代社会一部形象化的百科全书，展现了北宋汴梁城各阶层人物的","生活状况和社会的风貌。这幅画不仅在美术史上占有重要地位，同时也为历史学、社会学、","经济学、民俗学、建筑学等多个学科提供了翔实的研究资料，使它不但具有审美价值和艺术","价值，同时还具有一定的史料价值和文献价值。","其次，这幅画又突破了自唐五代以来，宫廷画家多以贵族官宦生活为主题的人物画的桎","梏，走向以中下层市民的现实生活为题材，从而反映普通百姓的生活情景，直接反映市民社","会，影响到后来的明清时代美术中的插图和年画的发展。","再次，画家张择端具有至深的艺术功力，为了将郊区、汴河、市区绵延数十里的情景组","织成一个完整的长卷画面，他采用了散点透视的构图方法，以及中国传统美学中“游”的审","美方式。","三  《最后的晚餐》（绘画艺术）","《最后的晚餐》 ， 意大利文艺复兴时期的著名壁画作品， 作者达·芬奇生于意大利佛罗伦萨，","是文艺复兴时期卓越的代表人物。","《最后的晚餐》是所有以耶稣和他的十二门徒为题材的艺术创作中最负盛名的，该画直","接画在米兰一座修道院的餐厅墙上。画作构图以耶稣为中心，沿着餐桌坐着十二个门徒，形","成四组，耶稣坐在餐桌的中央。","［赏析］","从结构上看，让耶稣和十二个门徒坐在一排，全部面向观众，将耶稣放在长排的中央，","并将他的门徒三人一组，分成左右对称的四个小组。","从人物上看，达·芬奇此画也是抓住了一个瞬间，造型艺术最应当抓住即将到达顶点前","的那一刻，“我们愈看下去，就一定在它里面愈能想象出更多的东西来”（莱辛语）。","从空间上看，这幅壁画成功的透视是人们最为称道之处，立体透视法使得这幅壁画给人","的感觉就像置身于一个房间，似乎耶稣和他的门徒正坐在那个房间里用餐，尤其是窗外的风","","","","","景更增添了此画的纵深感，在二维平面的壁画上表现了三维的立体空间。","四  《蒙娜·丽莎》（绘画艺术）","《蒙娜·丽莎》 ， 意大利文艺复兴时期著名画家达·芬奇的肖像画杰作， 这是一幅半身肖像画，","画面上的蒙娜·丽莎神态安详端庄，眼神宁静温柔，身体微侧，肩披轻纱。尤其是蒙娜 ·丽莎","含而不露的笑容深不可测，因而被称为“神秘的微笑”。","蒙娜·丽莎丰润温柔的双手交叉地平放在胸前， 更使得她庄重的姿态增添了宁静与安详感，","身体姿态与面部表情显得十分和谐。画面深处的背景上，缥缈朦胧的山岩和流水，如同梦境","一般，更增添神秘的意味，突出了蒙娜 ·丽莎这个人物，出色地表现了一个摆脱中世纪的宗","教束缚和封建桎梏的新的女性形象，生动地体现出文艺复兴崭新的时代氛围。","[赏 析]","从生理学和解剖学的角度深刻分析了女主人公的面部结构。","最完美地表达了文艺复兴时期人文主义的理想。经历了中世纪长期的宗教束缚和封建桎","梏，在人性遭到长期压抑之后，自然十分向往真实的活生生的人物形象，《蒙娜 ·丽莎》正","是最完美地表达了这种人性美的理想。","五  《日出·印象》（绘画艺术）","法国印象派著名绘画作品，1872 年创作。 纵48 厘米， 横63 厘米， 现藏巴黎马蒙达博物馆。","作者克劳德·莫奈。","该画作描绘了法国勒阿弗尔港口一个多雾的早晨，两只摇曳的小船显得朦胧模糊，船上","人影依稀可辨，远处的工厂烟囱，大船上的吊车等若隐若现。莫奈在创作中准确把握了自然","界真实的色彩，海水被晨曦染成淡紫色，天空被各种色块晕染成微红色。","莫奈擅长风景画，该作品突出体现了他追求最真实的光效和色彩，恰如其分地表达自然","界的微妙变化的艺术风格。 受 《日出·印象》 的影响许多艺术家开始注重追求瞬间的印象表现，","打破了写生和创作的界限。","[赏 析]","当时的科学发现人们日常生活中所熟悉的色彩并不是物体本身固有的，而是光线照射的","结果。没有光线，就没有色彩。","在《日出·印象》中，莫奈描绘了法国勒阿弗尔港口日出时的景象，他在画中一反古典","","","","","主义画派的传统方法，不去逼真地再现港口，而是在日光、雾气、水色之中来绘出一幅梦幻","般的奇妙图画，在浓雾和晨曦中港湾的色彩瞬息万变，海面上微波荡漾，倒影在水中晃动，","一轮红日正冲破黎明前的浓雾冉冉升起，表现了画家对日出前转瞬即逝的海港景色的鲜明印","象。","六  《巴尔扎克像》（雕塑艺术）","《巴尔扎克像》，法国著名雕塑家罗丹（1840——1917）最重要的雕塑作品之一，作于","1891—1897 年，共花费了 6 年的时间。作品高 3 米，现存于法国巴黎市。","巴尔扎克身披睡衣，仿佛正忙于夜间写作，他的两眼炯炯有神，闪现着智慧的光芒。","［赏析］","现实主义雕塑大师罗丹，堪称 19 世纪法国最重要的雕塑艺术家。","1891 年法国文学家协会为纪念已故大文豪巴尔扎克，委托罗丹为巴尔扎克创作一尊雕","像。罗丹抱着崇敬的心情，决心用全部心血来塑造这尊雕像。为此，罗丹收集和阅读了有关","巴尔扎克的大量资料。经过认真的思索和艰苦的探索，最终选取了大文豪巴尔扎克习惯夜间","写作的典型情景。","在这个作品中，巴尔扎克的全身，包括他的双手，都被一件宽大的睡袍包裹起来，一切","细枝末节都被置于长袍之中，这样就突出了巴尔扎克硕大智慧的头颅，使观众的注意力自然","而然地集中到头部，尤其是巴尔扎克那双炯炯有神的眼睛和蓬松浓密的头发，充分体现出巴","尔扎克愤世嫉俗的性格。","七  《二次大战时的丘吉尔》（摄影艺术）","《二次大战时的丘吉尔》 （又名 《愤怒的丘吉尔》 ） ， 加拿大摄影大师尤瑟夫·卡 希（1908","—2002）最著名的摄影作品，拍摄于 1941 年 12 月 30 日。","照片上的丘吉尔一反惯例，嘴上没有叼着著名的雪茄，脸上充满了愤怒而威严的表情，","左手叉腰，右手握杖，仿佛马上要一跃而起，尤其是丘吉尔的眼睛闪现出愤怒的火花，犹如","一头即将跳起来把敌人撕碎的雄狮。这幅照片充分体现了英国人民在反法西斯战争中同仇敌","忾、不屈不挠的大无畏气概，极大地鼓舞了全世界人民战胜纳粹德国侵略者的士气和勇气。","[赏 析]","","","","","卡希的肖像摄影作品《二次大战时的丘吉尔》之所以能够成为世界摄影艺术史上的经典","之作，正是因为它达到了“传神”的最高艺术境界。在这幅肖像摄影作品中，丘吉尔的姿态","和手势传达出了人物某种特定的情绪，只见他一手腰，一手握杖，这富于动感的姿态和手势","使人物显得十分威严、不可侵犯，这恰恰是这幅肖像摄影作品希望传达出的精神境界。","八  《兰亭集序》（书法艺术）","东晋著名书法家王羲之的《兰亭集序》，是著名的行书法帖。","全书共 28 行， 共计324 字。 通篇笔势纵横， 点画相映， 变化无穷， 似有神助。 行书起伏多变、","节奏感强，布局错落有致、浑然天成。","［赏析］","宗白华先生所说 :“中国独有的美术书法——这书法也是中国绘画艺术的灵魂——是从","晋人的风韵中产生的。魏晋的玄学使晋人得到空前绝后的精神解放，晋人的书法是这自由的","精神人格最具体最适当的艺术表现。这抽象的音乐似的艺术才能表达出晋人的空灵的玄学精","神和个性主义的自我价值”。","唐太宗指出其“若断还连”与“如斜反直”两大特点。","“若断还连”是指这幅书法作品的总体布局错落有致、疏密相宜，因而在章法上具有生","动活泼的气韵。","“如斜反直”是指《兰亭集序》中每个字的大小、斜正均有变化，其中不少字均以侧势","取胜，放在整幅作品之中，呼应对比，变化无穷，充分体现出行书起伏多变、节奏感强、骨","力劲健的气势和特色。","《兰亭集序》的成功之处，关键还在于人格的风韵与书法的风韵。","","","","","第七章  表情艺术","第一节  表情艺术的主要种类","所谓表情艺术，是指通过一定的物质媒介（音响、人体）来直接表现人的情感，间接反","映社会生活的这一类艺术的总称，它主要是指音乐、舞蹈这两门表现性和表演性艺术。","音乐与舞蹈这两种艺术样式，同其他艺术样式相比较，能够最直接、最强烈、最细腻地","表现内心情感，袒露人的心灵。因此，人们常将音乐、舞蹈这两门长于抒情的艺术称作表情","艺术。","表情艺术最基本的美学特征就是抒情性和表现性。音乐与舞蹈能够最直接和最强烈地抒","发人的情绪情感，无需通过其他任何中间环节，直接撼动听众或观众的心灵。总是需要通过","表演这个二度创作的过程，才能创造出可供人们欣赏的音乐形象或艺术形象，因此，表演性","构成了表情艺术另一个重要的美学特征。音乐与舞蹈这两门艺术还有一个鲜明的美学特征，","这就是它们都具有强烈的节奏性和韵律美。","一  音乐艺术","（1）音乐是通过有组织的乐音在时间上的流动来创造艺术形象、传达思想感情、表现","生活感受的一种表现性时间艺术。","（2）音乐的种类相当繁多，有各种不同的分类方法。一般来讲，人们常将音乐划分为","声乐和器乐两大类，还可以细分为多种多样的乐种、样式和体裁。声乐，是指用人声歌唱为","主的音乐。器乐，是指用乐器发声来演奏的音乐。","我国声乐一般又被划分为民族唱法、美声唱法和通俗唱法三大类。","根据器乐的不同种类和演奏方法，可以分为弦乐、管乐、弹拨乐和打击乐四大类。","（3）音乐的艺术语言和表现手段非常丰富，主要包括旋律、节奏、和声、复调、曲式、","调式、调性等。其中，最主要的是前三者，旋律堪称音乐的灵魂，节奏体现出音乐的时间感，","","","","","和声体现出音乐的空间感。","①旋律， 称得上是音乐最主要的表现手段， 它把高低、 长短不同的乐音按照一定的节奏、","节拍乃至调式、调性关系等组织起来，塑造音乐形象，表现特定的内容和情感。旋律具有很","强的艺术表现力，它可以表现出音乐的内容、风格、体裁，甚至还可以体现出音乐的民族特","色和地域特征，因此，人们常把旋律称为音乐的灵魂。","②节奏， 也是音乐最基本的表现手段， 它是指音响的长短、 强弱、 轻重等有规律的组合，","它是旋律的骨干，也是乐曲结构的主要因素，使乐曲体现出情感的波动起伏，增强了音乐的","表现力。","③和声，同样是音乐最基本的表现手段之一，它是指多声部音乐按照一定关系构成重叠","复合的音响现象，使音乐具有结构感、色彩感和立体感。","此外，复调、曲式、调式、调性，以及速度、力度等音乐语言和表现手段，也都是通过","有规律的变化与组合，共同将乐音在时间中展开来塑造出音乐形象。","现代关于交响乐的概念，形成于 18、19 世纪之交。以海顿、莫扎特、贝多芬三位音乐","巨匠为首的维也纳古典乐派，使得交响乐真正进入了黄金时代。","（4）中国音乐发展：","<1> 先秦时期的著名思想家孔子、墨子、老子、庄子等人的著作，都从不同角度涉及了","音乐，并有“子在齐闻《韶》，三月不知肉味”等故事流传下来。孔子对音乐的评价，有着","严格的儒家标准，尤其强调音乐的社会作用。 “子谓《韶》：尽美矣，又尽善也。谓《武》：","尽美矣，未尽善也。”西周还专门设立了掌管音乐和音乐教育的乐官，出现了由周王朝制","定的“雅乐”和流行于民间的俗乐“郑、卫之音”。先秦时期的乐器有了更大的发展，1978","年在湖北随州曾侯乙墓出土了举世闻名的编钟。","<2> 汉魏时期是我国古代音乐史上的一个重要发展时期，当时北方的相和歌和南方的清","商乐都达到了很高的艺术成就，汉武帝时还正式建立了乐府这种音乐机构，大量采集民歌民","谣，制定乐谱，配乐演唱，培训乐工等。","<3> 隋唐时代由于社会经济的发展变化以及与各民族文化的交流融合，在大量吸收西域","音乐的基础上，出现了新俗乐（燕乐）和众多曲目，尤其是唐代的教坊成为当时天下音乐舞","蹈精英的荟萃之地，长安的乐工曾经多达万人以上，隋唐的音乐专著多达 400 多卷。","<4> 宋元明清时期，民间音乐有了较快的发展，尤其是元杂剧、南北曲、昆曲中，蕴藏","","","","","着中国传统音乐文化的宝贵财富。","<5> 我国近现代音乐史奠基人之一的萧友梅于 20 世纪 20 年代在北京大学音乐传习所任","教，后来在蔡元培的支持下筹建了我国第一所音乐学校——国立音乐院，后改为上海音专。","现代音乐史上，还涌现出了刘天华、华彦钧（阿炳）、黄自、聂冼星海等一批著名的音乐家，","以及众多蜚声中外的优秀音乐作品。","（5）西方音乐发展：","<1> 毕达哥拉斯学派从音乐与数学的关系出发，强调音乐是和谐的表现。柏拉图认为音","乐的节奏与曲调有最强烈的力量，能浸入人的心灵的最深处，通过音乐美的浸润能使人的心","灵得到美化。在柏拉图构想的理想国中，他只允许音乐家留下来，而要把悲剧和喜剧表演艺","术家们全部赶出去。亚里士多德也认为音乐是一种最令人愉快的艺术，他认为音乐具有教育","作用、净化作用，以及精神享受的作用。","<2> 欧洲中世纪在教会的控制下，民间音乐与世俗音乐遭到限制和扼杀，而教会则利用","宗教音乐来宣传教义、 扩大影响， 使宗教音乐中的赞美歌、 多声部合唱等均有了较大的发展。","<3>16 世纪末叶开始的，从这个时期起，世俗音乐逐渐占据主导地位，主调音乐取代了","复调音乐， 器乐得到了相当大的独立发展， 特别是诞生了歌剧这一综合了音乐、 戏剧、 美术、","舞蹈的新的艺术形式。","<4> 近现代欧洲音乐史上最重要的音乐流派主要有：①古典乐派，它是从 18 世纪下半","叶至 19 世纪初在维也纳形成的以古典风格为创作标志的音乐流派，以海顿、莫扎特和贝多","芬三人为主要代表，这个流派推崇理性和情感的统一，追求艺术形式的严谨和完美，创作手","法上注重戏剧的对比、冲突和发展，成为当时的典范。","②浪漫乐派， 是19 世纪在欧洲兴起的音乐流派， 浪漫乐派音乐最大的特点就是强调激情，","强调抒发主观情感， 强调表现性。 前期浪漫乐派的代表人物主要是德国作曲家舒伯特和舒曼、","匈牙利的李斯特、波兰的肖邦、法国的柏辽兹等人；后期浪漫乐派的代表人物主要是德国音","乐家瓦格纳和勃拉姆斯、俄国音乐家柴可夫斯基等。","③ 19 世纪中叶以后，在欧洲各国又兴起和发展了民族乐派，民族乐派主张音乐应当具","有鲜明的民族风格和民族特色，注意采用本国的民间音乐作为创作素材，将传统音乐成果与","本民族音乐密切结合起来。 民族乐派的主要代表人物有挪威的格里格 （管弦乐组曲 《培尔·金特》","等）、捷克的德沃夏克（《自新大陆交响曲》等），以及俄国“强力集团”的一批著名音乐","","","","","家如穆索尔斯基 （交响音画 《荒山之夜》 等） 、 里姆斯基- 萨科夫 （交响组曲 《舍赫拉查德》 ）","和鲍罗丁（交响音画《在中亚细亚草原上》）等。","<5>20 世纪西方音乐主要有以法国音乐家德彪西为代表的印象派音乐，以奥地利音乐家","勋伯格为代表的表现派音乐，以意大利音乐家布梭尼为代表的新古典主义音乐，相继出现了","爵士乐、 摇滚乐、 电子音乐， 等等， 尤其是 “偶然音乐” 与观念艺术， 在20 世纪中期影响很大。","1952 年，美国作曲家约翰·凯奇在一次音乐会上，向听众们奉献了一部作品《4′ 33》。","20 世纪音乐创作呈两极发展趋势：一种是更加严格、科学、精密，另一种是更加自由、","解放、随意，使西方现代音乐呈现出十分复杂的状况。","二  舞蹈艺术","（1）舞蹈是以经过提炼加工的人体动作为主要表现手段，运用舞蹈语言、节奏、表情","和构图等多种基本要素，塑造出具有直观性和动态性的舞蹈形象，表达人们的思想感情的一","种艺术样式。","（2）最早的舞蹈常常是歌、舞、乐三者合为一体，既是巫术仪式，又是歌舞活动。","商代的巫舞， 周代的文舞与武舞， 春秋战国的优舞， 以代百戏中的舞蹈， 均曾盛行一时。","唐代除了豪华壮观的大型宫廷乐舞 “立部伎” 和精致典雅的小型宫廷宴乐 “坐部伎” 外，","还有著名的“健舞”，如胡腾舞、胡旋舞、剑器舞，以及歌舞大曲如著名的《霓裳羽衣舞》","等。民间舞蹈也十分普遍。","宋代民间盛行的综合性表演形式“舞队”，明清时代戏曲中的舞蹈表演等，都具有十分","浓郁的民族特色。","自宋以后，宫廷舞蹈走向衰落，转入民间，稍后又成为戏曲这种中国特有的综合表现艺","术的一个重要组成部分。戏曲舞蹈一方面吸收借鉴了民间舞蹈并有所提高，另一方面又继承","了古代舞蹈。","（3）1581 年意大利籍艺术家们在法国演出了第一部真正的芭蕾舞作品《王后喜剧芭蕾》","后，芭蕾舞迅速在欧洲各国传播开来。 19 世纪更堪称芭蕾舞艺术的黄金时代，芭蕾舞的脚","尖舞与外开性技巧和一整套的训练方法日臻完善，逐渐形成了芭蕾舞艺术的意大利学派、法","国学派和俄罗斯学派，出现了《吉赛尔》《天鹅湖》《睡美人》等一批闻名于世的优秀芭蕾","舞作品。","","","","","（4）20 世纪初以美国著名舞蹈家邓肯为先驱的现代舞，以自然的舞蹈动作打破了古典","芭蕾舞传统的程式束缚，更加自由地表现内心情感。强调古典艺术与现代艺术的有机统一。","斥责古典芭蕾舞是“违背自然的僵硬而陈腐的体操动作”，她主张“观摩自然，研究自然理","解自然，然后努力表现自然”，同时吸取前人的艺术营养，强调通过身、心、灵三者的结合","来展示人的生命力。印度的古典舞、印度尼西亚的巴厘舞、日本的盆舞、斯里兰卡的象舞、","爱尔兰的踢踏舞、波兰的马祖卡舞，以及非洲大量力度很强的民间舞蹈。","<1> 总体上讲，舞蹈可以分为生活舞蹈与艺术舞蹈两大类别。","①生活舞蹈，是指与人们日常生活联系密切的一类舞蹈，这种舞蹈动作简单，未曾受过","专门训练的人也容易学会，目的主要在于自娱或社交，具有广泛的群众性和普及性。 20 世","纪以来在世界各国流行的有舞步优雅潇洒的华尔兹（俗称“慢三步”）和布鲁斯（俗称“慢","四步”），后来是节奏鲜明、动作跳跃的探戈和伦巴。","②艺术舞蹈，是指专业或业余舞蹈家通过艺术创作在舞台上表演的艺术作品。这类舞蹈","常常需要较高的技艺水平、完整的艺术构思、鲜明的主题思想和栩栩如生的艺术形象。","<2> 从表现风格区分，艺术舞蹈还可以分为古典舞与现代舞、民间舞与宫廷舞，等等。","民间舞是指在民间广泛流传的传统舞蹈形式，它生动地反映出各地区、各民族的性格爱","好、 风俗习惯和审美趣味， 具有强烈的民族风格和鲜明的地方色彩。 我国的民间舞源远流长，","十分丰富，一般又可以分为汉族民间舞和少数民族民间舞两大类。","汉族民间舞常常采用载歌载舞的形式，如秧歌、花灯、二人转等均如此；还常常利用各","种道具来加强舞蹈的造型能力和表现能力，如狮子舞、龙舞、高跷、跑旱船等就是采用特别","制作的道具来增强表演效果；此外，汉族民间舞常常是自娱性和表演性相结合，参加者为数","众多，如秧歌、腰鼓舞等在许多地区广为流传。","少数民族民间舞：蒙古族的民间舞蹈安代舞、筷子舞、盅子舞等，动作劲健，节奏强烈，","豪迈奔放；维吾尔族的民间舞蹈赛乃姆、多朗舞等，活泼、开朗、风趣、乐观，急速的旋转","更是令观者眼花缭乱；朝鲜族的民间舞蹈扇子舞、长鼓舞等，舞姿优美节奏轻快；藏族的民","间舞蹈弦子舞、锅庄等，雄健有力，节奏激昂。此外，还有瑶族的铜鼓舞、傣族的孔雀舞、","苗族的芦笙舞、彝族的阿细跳月等。","芭蕾舞，是法文 Ballet 的音译，起源于意大利，形成于法国。古典芭蕾舞有一整套严格","的程式和规范，尤其是脚尖鞋的运用和脚尖舞的技巧。芭蕾舞动作要求规范化，尤其注意稳","","","","","定性和外开性。著名的大型古典芭蕾舞剧有《吉赛尔》 《爱斯梅拉达》 《天鹅湖》 《睡美人》","《罗密欧与朱丽叶》等。","芭蕾舞艺术在我国有了迅速的发展，涌现出《白毛女》《红色娘子军》等一批大型现代","题材芭蕾舞剧。","第二节  表情艺术的审美特征","一  抒情性与表现性","（1） 抒情性是音乐、 舞蹈的基本属性。 对于这一点， 中外美学史上都有许多精辟的论述。","汉代的《毛诗序》就强调了音乐与舞蹈在抒发情感方面具有独特的力量，而语言艺术等其他","艺术种类在这方面都无法与之相比，即“情动于中而形于言，言之不足故嗟叹之，嗟叹之不","足故永歌之，永歌之不足，不知手之舞之，足之蹈之也”。“歌以叙志，舞以宣情”。黑格","尔则认为 :“音乐所特有的因素是单纯的内心方面的因素，即本身无形的情感”，“音乐是","心情的艺术，它直接针对着心情”。","音乐、舞蹈的抒情性，来源于它们内在的本质属性和特殊的表现手段，音乐中有组织的","乐音，舞蹈中人的形体动作，都可以通过力度的强弱、节奏的快慢、幅度和能量的大小等多","种方式，来表现人们繁复多样、深刻细腻的内心情感。","李斯特认为， 音乐之所以被人称为最崇高的艺术， “那主要是因为音乐是不假任何外力，","直接沁人心脾的最纯的感情的火焰 ； 它是从口吸入的空气， 它是生命的血管中流通着的血液。","感情在音乐中独立存在，放射光芒”。音乐的这种特殊性，根源于音乐特殊的物质媒介和表","现手段，它以乐音为材料作用于人的听觉，可以直接传达和表现音乐家感情的起伏、变化和","波动。贝多芬的音乐有两个主要特征，即哲理性和戏剧性。","（2）还需要指出，音乐作品的情感内涵往往还具有多义性和模糊性，因此它更需要欣","赏者充分调动自身的联想和想象，用全部身心去感受和体验，才能最终完成音乐情感的传达","和接受。","由于音乐形象具有多义性、模糊性和朦胧性的特点，常常是只可意会不可言传。不同的","人欣赏同一首乐曲，由于各自的生活经历、文化修养和审美趣味不同经常会有不同的审美感","受。同一首乐曲完全可以多次欣赏，常听常新。","","","","","第二，由于音乐形象具有抽象性、象征性和复杂性的特点，使得音乐最具有形而上学的","意义，最富有哲学的深度。","二 表演性和形象性","（1）音乐、舞蹈都属于表演艺术。所谓表演艺术，是指通过演员表演并借助舞台来完","成的艺术形式。 表演艺术都应当包括一度创作和二度创造这样两个过程， 而且， 二度创作 （实","际的表演、演奏或演唱）可以多次进行。","没有表演，也就没有音乐和舞蹈。波兰当代著名音乐理论家丽莎认为“属于音乐的特殊","性的，还有作品与听众之间的中间环节，即表演，它具有自己的历史发展规律，具有自己的","美学价值，并在很大程度上服从于社会的要求，同时也改变着作品本身的面貌。构成音乐特","殊性的这个因素同戏剧艺术和舞蹈艺术是共同的。”","（2）由于舞蹈是以人体的姿态、表情、造型，尤其是动作来表现思想情感，表演在塑","造舞蹈形象时具有更加重要的意义和作用。德国现代舞蹈家玛丽 ·魏格曼指出 :“舞蹈属于一","种表演艺术。舞蹈的舞台现实，有赖于合格的解释者，即舞蹈表演家。”","音乐作品有赖于表演（指挥、演奏、演唱）艺术家对作品的理解和表现。","（3）形象性也是音乐艺术和舞蹈艺术的重要的审美特征，但音乐形象和舞蹈形象又各","有自己的特点。","<1> 舞蹈形象的塑造，完全要依靠演员的形体动作来实现，可以说，舞蹈中的表演性是","形象性的基础。 在注重描写人物的舞剧或舞蹈作品中， 舞蹈形象主要是指以舞蹈动作、 姿态、","表情和造型所塑造出来的人物形象。例如大型民族舞剧《红楼梦》中，陈爱莲成功地塑造了","林黛玉这个人物形象。对于那些注重描写生活场景或抒发情感情绪的舞蹈作品，舞蹈形象同","样需要通过演员的形体动作和姿态表情， 来形成具有典型意义的舞蹈意境。 女子独舞 《水》 。","总之，不论是塑造人物，还是表现意境，舞蹈形象都需要依靠动作和姿态来表现人物性","格，创造情绪氛围。因此，舞蹈形象总是具有直观性、动态性和表情性的美学特征。","<2> 音乐形象的塑造，同样需要通过演员的演唱或演奏才能完成，因而音乐中的表演性","同样是形象性的基础，但音乐形象又有很大的特殊性，它的塑造完全以声音为材料来完成，","音乐形象看不见、摸不着，它需要欣赏者充分调动审美感受力，用全部身心去体验、想象和","联想，在内心唤起一定的情感意象，从而完成音乐形象的塑造。因此，音乐形象不具有空间","","","","","性，而具有时间性。","几种不同的关于音乐欣赏的理论 ： 一种被称为戏剧性欣赏的理论， 强调欣赏音乐的内容 ；","另一种是被称为技术性欣赏的理论，又被称之为学院派音乐欣赏理论；再一种是被称为情感","性欣赏的理论，强调音乐表达感情的特殊方式。","三  节奏性与韵律美","（1） 在音乐中， 节奏是最基本和最重要的表现手段。 音乐节奏具体是指乐音的长短、 高低、","强弱等变化组合的形式，它是旋律的骨干，也是乐曲结构的基本构成因素。","不同的节奏可以具有不同的表现作用，从而使旋律具有鲜明的个性。","节奏直接影响到音乐的抒情性，音乐家们常常利用节奏这个表现手段，在音乐作品中反","映出一定强度的情感情绪的脉律，并且通过如格式塔心理学家们所发现的同形同构的原理，","使听众产生情绪情感的共鸣，如柴可夫斯基著名的《悲怆交响曲》，贝多芬著名的钢琴奏鸣","曲《黎明》。","节奏同样是舞蹈艺术最基本的构成要素和表现手段。舞蹈节奏一般表现为人体的律动，","即人体动作的力度强弱、速度快慢，以及动作幅度和能量的大小等，因此，舞蹈节奏常常体","现为人体动作的韵律美。我国著名舞蹈理论家吴晓邦认为，构成舞蹈的三要素就是表情、节","奏和构图。例如大型民族舞剧《丝路花雨》。","舞蹈既是视觉艺术，又是听觉艺术，音乐在舞蹈中起着十分重要的作用，舞蹈中动作的","节奏常常是以音乐旋律的节奏为基础的。 “舞蹈节奏运动的进行是表现音乐内在灵魂的形象，","舞蹈动作的延续、重复变化始终伴随着节奏。”在舞蹈作品中，音乐与舞蹈紧密结合，而节","奏正是它们结合的纽带。","（2）富有韵律美的舞蹈动作，建立在节奏的基础之上；而音乐的节奏，又需要通过优","美的舞蹈动作来形象地展现。所以说，正是节奏将舞蹈音乐与舞蹈动作紧紧地联系在一起，","使之成为一个完美的舞蹈作品。显然，对于音乐、舞蹈这两种表情艺术来讲，节奏都有着十","分重要的意义。","","","","","第三节  中外表情艺术精品赏析","一  《第三交响曲》（音乐艺术）","德国著名音乐家贝多芬 （1770——1827）于1803 年创作的 《第三交响曲》 （ 《英雄交响曲》 ） ，","可以看作是贝多芬音乐风格成熟的标志。","在维也纳古典乐派中，贝多芬的音乐具有划时代的意义。一方面，他继承了海顿、莫扎","特的古典主义音乐传统，另一方面，贝多芬又开了浪漫主义音乐的先河。是古典音乐与浪漫","音乐之间的桥梁。","全曲共分四个乐章，以勇敢刚健的英雄主题来揭示英雄多方面的生活与性格，刻画出英","雄的情感和英雄的形象。","［赏析］","第一乐章为快板乐章，奏鸣曲式，主部主题坚毅雄壮，副部主题深情含蓄，从不同侧面","多角度地描绘了英雄的性格特征。配器手法多样变化，调性布局复杂转换，主题再现富有新","意，整个乐章热情澎湃、势不可挡。","第二乐章是一首慢板的葬礼进行曲，贝多芬是把哀悼英雄这样深刻的主题思想融入交响","乐的第一位作曲家，整个乐章深沉肃穆、庄严悲壮。","第三乐章是充满活力的谐谑曲。“谐谑”的原意就是滑稽或幽默，因此，这段乐曲带有","活泼、喜悦的成分。","第四乐章是终曲，变奏曲式，作者将传说中的神话英雄与理想中的人间英雄结合起来，","歌颂这种为全人类的幸福而献身的英雄精神。","表现宏大的题材，具有强大的戏剧性力量和哲理性内涵。正是在这部作品中，贝多芬毕","生追求的自由、平等、博爱的理想，最终成为他音乐创作的精神追求与力量源泉。","二 《e 小调第九交响曲》（音乐艺术）","捷克作曲家德沃夏克的《e 小调第九交响曲》，又称为《自新大陆交响曲》或《新世界","交响曲》，是 19 世纪民族乐派交响曲的代表作。","歌曲采用了美国印第安民谣及黑人民歌作材料，以独特的民族性手法加工整理而成，带","有捷克音乐显著的风格。全曲共分为四个乐章，第一乐章的主部主题具有鲜明的美国特色，","","","","","担负一种连贯全曲的特殊任务，甚至可称之为体现全曲精神的旋律。第二乐章是整部交响曲","中最为有名和感人的乐章，经常被提出来单独演奏，此部分被誉为所有交响曲中最为动人的","慢板乐章。","［赏析］","民族乐派是 19 世纪中叶在欧洲各国兴起和发展的一种音乐流派或音乐思潮。许多音乐","家开始致力于挖掘民族音乐的语汇和特色，大量采用民族民间音乐作为创作素材，将传统音","乐成果和民族音乐特色结合起来，努力创作具有浓郁的民族风格和民族特色的音乐作。","第一乐章为奏鸣曲式。","第二乐章是慢板乐章。","第三乐章是谐谑曲，其中既有活泼轻快的印第安舞曲，也受到捷克民间舞蹈的节奏和音","调的影响。","第四乐章是快板，奏鸣曲式，气势宏大而雄伟，这个总结性的乐章不仅有新的主题，更","是将前面三个乐章的主题一一再现，这些主题经过变化发展，相互交织在一起，在乐队全奏","的热烈气氛中，以辉煌的高潮结束了全曲。","《e 小调第九交响曲》表现了一位 19 世纪末叶刚到美国的捷克音乐家对于这片新大陆","的憧憬， 以及对于这个新兴工业国家各面生活的感受， 当然还有作曲家本人浓郁的思乡之情，","被称之为“最富有美国精神的交响曲”。","三  歌剧《费加罗的婚礼》（音乐艺术）","歌剧 《费加罗的婚礼》 取材于法国著名戏剧家博马舍的同名喜剧， 由剧作家达·彭特改编，","奥地利著名音乐家莫扎特作曲。该剧于 1786 年由莫扎特亲自指挥首演于维也纳。","该剧描写伯爵的仆人费加罗与伯爵夫人的女仆苏珊娜即将结婚，但是喜新厌旧的伯爵也","在追求苏珊娜， 因此想尽种种办法来阻止费加罗的婚礼。 费加罗与苏珊娜只好联合伯爵夫人，","共同设计了种种圈套来惩戒好色的伯爵，最后终于让伯爵当场出丑，费加罗与苏珊娜这对有","情人终成眷属。","《费加罗的婚礼》采用抒情喜剧的形式，全剧音乐部分由序曲、幕间曲，以及大量的重","唱、咏叹调、宣叙调等组成。","莫扎特的音乐不仅表达了喜剧的氛围，还描绘出人物的性格，尤其是作曲家善于运用重","","","","","唱展开剧情和戏剧冲突。 特别是这部歌剧中一些著名的咏叹调， 后来广为传唱， 成为独立作品。","［赏析］","歌剧《费加罗的婚礼》无情地嘲讽了以伯爵为代表的贵族阶级的道德堕落和腐败无能，","热情地讴歌了下层人民的机智和勇敢。 这部歌剧从头至尾充满了强烈的戏剧效果， 情节曲折。","四  芭蕾舞剧《天鹅湖》（舞蹈艺术）","《天鹅湖》，经典芭蕾舞剧，1877 年在莫斯科首演，1895 年在彼得堡","重排上演并大获成功。至今 100 多年的时间内重演不断。","最早的芭蕾舞剧《天鹅湖》共有四幕，音乐作于 1876 年，是俄国著名作曲家柴可夫斯","基所作的第一部舞剧。剧作取材于德国中世纪的民间童话，讲的是美丽的公主奥杰塔和王子","齐格弗里德的传奇爱情故事。","［赏析］","芭蕾舞在西方被称为“舞蹈艺术皇冠之珠”。由于表演技术上一个重要特征是女演员要","穿特制的脚尖舞鞋并用脚趾尖端立地跳舞，所以在民间也被称为是足尖舞。芭蕾舞起源于意","大利，形成于法国。人们普遍认为，世界上第一部真正的芭蕾舞诞生于 1581 年，意大利佛","罗伦萨的公主凯瑟琳嫁到法国并当了王后，在她的安排下，一批意大利舞蹈艺术家在法国首","演了《王后喜剧芭蕾》。 19 世纪可以说是芭蕾舞艺术的黄金时代，涌现出一批流传至今的","经典剧目，法国首演了大型古典芭蕾舞剧《吉赛尔》《海侠》等，俄国首演了大型古典芭蕾","舞剧《夭鹅湖》《睡美人》等。","俄国杰出的作曲家柴可夫斯基（1840—1893），将俄罗斯民族风格与世界音乐文化融为","一体。柴可夫斯基为《天鹅湖》《睡美人《胡桃夹子》等舞剧作曲，给舞剧音乐带来了交响","性内容和戏剧性动力。","","","","","第八章  综合艺术","第一节综合艺术的主要种类","综合艺术是戏剧、戏曲、电影、电视等一类艺术的总称。综合艺术吸取了文学、绘画、","音乐、舞蹈等各门艺术的长处，获得了多种手段和方式的艺术表现力。它将时间艺术与空间","艺术、 视觉艺术与听觉艺术、 再现艺术与表现艺术、 造型艺术与表演艺术的特点融会到一起，","具有更加强烈的艺术感染力。","综合艺术最基本的审美特征便是综合性，这种综合性体现为各种艺术元素一旦进入综合","艺术之后，就具有自己崭新的意义，产生出一种新的特质。例如，电影中的音乐。此外，综","合艺术都很重视文学性，对于戏剧电影来讲，优秀的剧本常常是作品成功的前提；同时，表","演艺术又是综合艺术的中心环节，表演性具有极其突出的地位和作用。","一  戏剧艺术","（1）从广义上讲，戏剧包括话剧、戏曲、歌剧、舞剧，乃至目前欧美各国影响广泛的","音乐剧等。从狭义上讲，戏剧主要是指话剧。","戏剧是在舞台上由演员以对话和动作为主要表现手段， 为观众当场表演的一门综合艺术。","戏剧艺术作为二度创作的艺术，包括两个重要组成部分，也就是作为舞台演出基础的戏剧文","学和演员创造舞台形象的表演艺术。","（2）按照作品容量大小，可以分为多幕剧和独幕剧；","按照作品题材不同，可以分为历史剧、现代剧、儿童剧等；","按照作品的样式类型，又可以分为悲剧、喜剧和正剧三大类型。","（3）作为戏剧艺术的主要类型之一，悲剧历来被认为是戏剧之冠，具有崇高的地位。","悲剧常常通过正义的毁灭、英雄的牺牲或主人公苦难的命运，显示出人的巨大精神力量和伟","","","","","大人格，正如鲁迅所说 :“悲剧将人生的有价值的东西毁灭给人看”，相反，“喜剧将那无","价值的撕破给人看”。","黑格尔则认为，悲剧的根源和基础是两种伦理力量的冲突，冲突双方所代表的伦理力量","都是合理的，但同时又因每一方都坚持自己的片面性而损害对方的合理性，从而不可避免地","造成悲剧性冲突。","<1> 最早出现的古希腊悲剧属于第一阶段的西方悲剧，题材大多来自神话传说与英雄史","诗。代表古希腊悲剧艺术最高成就的是埃斯库罗斯、索福克勒斯和欧里庇得斯，他们并称为","古希腊三大悲剧家。古希腊出现的“命运悲剧”，反映出这个历史阶段，社会力量与自然规","律作为一种不可理解和不可抗拒的命运和人相对立，表现了人对自然和命运的抗争，最终因","无法挣脱而导致悲剧的结局。如古希腊著名悲剧家索福克勒斯的《俄狄浦斯王》。","<2> 欧洲中世纪末出现的第二阶段的“性格悲剧”，反映出长期封建社会中，封建伦理","制度和宗教统治与反封建的社会力量的矛盾斗争，体现了人文主义理想与黑暗现实的尖锐冲","突。如莎士比亚的著名悲剧《哈姆雷特》。","<3> 到了 19 世纪的近代社会，第三阶段的“社会悲剧”揭露了各种不合理的社会现象","和罪恶，具有鲜明强烈的批判精神。如法国作家小仲马《茶花女》，易卜生的《玩偶之家》","等，均对社会确见与世俗势力作了一定程度的揭露，触及资本主义时代的尖锐社会矛盾，反","映了个人与社会势力的抗争。","总而言之，西方戏剧史上，不管是命运悲剧、性格悲剧、社会悲剧，可以说都是人在与","命运、性格、环境冲突中的挣扎，可以称之为“挣扎的悲剧”。","<4> 现当代西方悲剧作为西方悲剧历史的第四阶段，创作风格更加多样，尤其是出现了","将悲剧性与喜剧性融会到一起的悲喜剧作品。如瑞士剧作家迪伦马特的《老妇还乡》 。","（4）戏剧除了具有综合艺术共同的审美特征外，还有自身独具的特征。在戏剧的所有","特征中，戏剧性无疑占有最重要的地位。所谓戏剧性，就是戏剧艺术通过演员扮演的角色之","间的冲突来展开剧情、刻画人物，借以吸引众，实现其艺术效果和审美作用的特性。构成戏","剧性的中心环节是戏剧动作和戏剧冲突，或者说是行动中的人物的冲突。","剧场性构成了戏剧艺术的另一个特点。剧本、演员和观众称作戏剧艺术的三要素，其中","最本质的要素自然是演员。戏剧的中心应当是演员的表演艺术。","（5）戏剧理论家们都十分重视对戏剧表演艺术的研究，其中，影响最大的是斯坦尼斯","","","","","和布莱希特戏剧体系，这两种体系分别被称为“体验派表演艺术”和“表现派表演艺术”两","大类型。","①前者是由苏联戏剧家斯坦尼斯拉夫斯基创立的戏剧表演体系，他强调演员应当在剧本","的规定情境中设身处地地体验角色的生活、情感和思想，并且在演出时再体现于表演之中。","斯坦尼斯拉夫斯基表演体系主张“我就是角色”，并且根据戏剧情境来做出一连串的行动，","称之为“贯串行为”。","②德国戏剧家布莱希则倡导一种“间离效果”的表演方法，废除传统的“三一律”框框，","主张场景变换的自由化，在表演艺术上主张演员与角色在感情上保持距离，始终清醒地意识","到“我是在演戏”，用理性效果代替感情效果，主张演员始终要用理智来控制自己的表演，","始终清醒地意识到自己是在演戏，  “他一刻也不能完全彻底地转化为角色＂，以便让观众","冷静地去分析和判断","二  戏曲艺术","（1）戏曲是中国传统的戏剧形式的总称。包括全国性的剧种如京剧、昆曲，也包括地","方戏如川剧秦腔、河北梆子等。在世界上，古希腊戏剧、印度梵剧和中国戏曲，被为三种古","老的戏剧艺术。","（2）中国戏曲在形式美上“以一求多”与西方戏剧“以多见一”不同。","中国戏曲艺术形式美的基本特征是以 “一” 为起点， 例如戏曲的角色行当上是 “一行多用”","（生、旦、净、丑）、表演动作上是“一式多用＂（唱、念、做、打）、戏曲声腔与音乐上","是“一曲多用” （基本曲牌）、舞台布景上是“一景多用”  （如一桌两椅）、服饰脸谱上","是“一服多用”，等等。此外，在表演艺术上，还有“一人千面” （一套程式、万干性格）、","“一曲百情＂＂一步千态”“一笑百媚”，等等，充分体现出在传统文化影响下，中国戏曲","“以一求多”的美学追求。","（3）中国戏曲的渊源可以追溯到秦汉时期的乐舞、俳优、百戏。","唐代更有了较大的发展，出现了歌舞戏和参军戏，“戏”和“曲”进一步融会，表演形","式也更为多样。","宋金时期，戏曲艺术才真正趋于成熟，宋杂剧和金院本都能演出完整的故事，剧中角色","也较前增多，初步形成了我国戏曲表演分行当的体系。","","","","","元杂剧在中国戏曲史上占有重要的地位， 尤以关汉卿的 《窦娥冤》 和王实甫的 《西厢记》","最为著名。","明清时期，是中国戏曲史上又一个繁荣时期，特别是传奇作品大量涌现，包括中国戏曲","史上划时代的浪漫主义杰作汤显祖的《牡丹亭》等。出现了昆曲、京剧等全国性的大剧种，","而且涌现出几百个地方剧种。","昆曲，也称昆剧；京剧；豫剧；越剧；评剧；粵剧，中南地区的汉剧，西南地区的川剧，","华北地区的河北梆子等许多地方剧种，也都拥有大量的观众。","（4）中国戏曲往往具有十分重要的历史教化意义。","中国传统美学更加强调美与善的统一，再加上“天人合一”的宇宙意识和崇尚圆满的世","俗心理，中国古典戏曲多数以大团圆结局。不少的戏曲就戏剧冲突的本质而言是悲剧性的，","但是戏剧冲突的结果却是戏剧性的大团圆。","中国戏曲具有自身的审美特征，尤其是表现在综合性、程式化、虚拟性这三个方面。","<1> 第一，从综合性来看，它是一门歌、舞、剧高度综合的艺术。","<2> 第二，从程式化来看，中国戏曲的程式化，是指戏曲演员的角色行当、表演动作和","音乐唱腔等，都有一些特殊的固定规则。","①首先，戏曲演员的角色行当就具有程式化的特点。戏曲一般都划分为生、旦、净、丑","等四种基本类型，每种类型又可以再分出许多更加细致的角色。","②其次，戏曲演员的表演动作也具有程式化的特点。“起霸”；“走边”；“趟马”也","叫“跑马”；“甩发功” “水袖功”“扇子功” “手绢功”等。","③最后，戏曲音乐、唱腔和器乐伴奏也都有一些基本固定的曲牌和板式。例如京剧中，","皇帝出场大多用［朝天子］等曲牌伴奏，主帅出场大多用唢呐曲牌［水龙吟］伴奏等。","<3> 第三，从虚拟性来看，中国戏曲的虚拟性，是指戏曲充分吸收了我国古典美学注重","写意的特点，通过“虚实相生”“以形写神”，使演员能够更加充分地利用戏曲舞台有限的","时空，更加广阔地反映现实生活与表现思想感情。","①所谓虚拟性，首先是指戏曲演员表演时多用虚拟动作，不用实物或只用部分实物，依","靠某些特定的表演动作来暗示出舞台上并不存在的实物或情境。","②其次，戏曲舞台上的道具布景也具有虚拟性，戏曲舞台大多不用布景，常常只用很少","的几件道具。传统的戏曲舞台常常只设简单的一桌二椅，在不同的剧情中，通过演员不同的","","","","","表演动作，可以展示出不同的环境。","③最后，戏曲舞台的时空也具有极大的虚拟性。而戏曲舞台时空所表现的往往不是真实","世界中的客观时空，只是通过演员的唱腔、念白和动作，以虚拟的手法来表现空间和时间，","具有一种高度灵活自由的主观性。空间的转换全凭演员一系列虚拟动作表现出来。","三  电影艺术","（1）电影是现代科学技术与艺术相结合的产物。电影艺术是通过画面、声音和蒙太奇","等电影语言，在银幕上创造出感性直观的形象，再现和表现生活的一门艺术。由于电影诞生","在音乐、舞蹈、戏剧、绘画、雕塑、建筑之后，所以常被人们称作“第七艺术”。","1895 年 12 月 28 日晚上，法国人卢米埃尔兄弟在巴黎家大咖啡馆的地下室里，放映了","他们自己拍摄的《火车进站》《水浇园丁》等短片，这一天被电影史学家们定为电影正式诞","生的日子，标志着无声电影时代的开始。 1905 年，当时的北京丰泰照相馆拍摄了第一部国","产片《定军山》，由著名京剧演员谭鑫培主演，严格意义上讲是一部戏曲舞台纪录片。中国","第一部故事片是《难夫难妻》 （1913）。","（2）电影的样式分为故事片、纪录片、科教片、美术片等四大部类。","<1> 电影艺术史上的第一次大变革是从无声到有声。最初的电影都是无声电影，被称为","“默片”。有声电影诞生的标志，是 1927 年美国的《爵士歌王》。从此，电影由纯视觉艺","术成为视听综合艺术。中国第一部有声片，是 1931 年的《歌女红牡丹》。","<2> 电影艺术史上的第二次大变革是从黑白到彩色。 1935 年，使用彩色胶片拍摄的美","国影片《浮华世界》诞生，这是世界上第一部彩色电影。中国第一部彩色故事片《生死恨》","（1948），又是一部戏曲艺术片，由梅兰芳先生主演，费穆担任导演。","<3> 第三次大变革， 发生在20 世纪 90 年代以来至今， 电影正在大踏步地进入高科技时代，","计算机三维动画、数字技术、多媒体技术和虚拟现实等高科技手段正在应用于电影领域，以","极富想象力的艺术手法和极其逼真的艺术效果，大大增强了电影艺术的魅力。","（3） 电影也是一门综合艺术， 它的综合性可以分为三个层次 ： 其一， 它是各门艺术的综合 ；","其二，它是科学与艺术的综合；其三，它是美学层次上的综合。电影艺术将视觉艺术与听觉","艺术、 时间艺术与空间艺术、 纪实艺术与表演艺术、 再现艺术与表现艺术有机地综合到一起。","仅仅从各门艺术的综合来看。第一，电影和电视剧都与戏剧有着密切的关系。第二，电","","","","","影艺术也受到文学的极大影响。第三，电影艺术从绘画、雕塑中，吸取了造型艺术的规律和","特点，使得造型性成为电影艺术重要的美学特性之一。第四，电影艺术与音乐结下了不解之","缘，音乐成为影视作品概括主题、抒发情感、渲染气氛的重要艺术手段。第五，电影艺术与","摄影艺术有着与生俱来的天然联系。","影视艺术语言主要就是画面、声音和蒙太奇这三种。画面、景别（包括远景、全景、中","景、近景、特写等）、焦距（包括标准镜头、长焦镜头、短焦镜头、变焦镜头等）、镜头运","动（包括推、拉、摇、移、跟、降、升等几种基本形式和运动镜头等）、角度（包括平视镜","头、俯视镜头、仰视镜头等），以及光线、色彩和画面构图等，共同组成了画面造型。","对于影视声音来讲，人声（包括对话、独白、旁白等）、音乐、音响这三大类型，共同","组成了声音造型。","蒙太奇是法文 montage 的音译，原为建筑学用语，意为装配、组合、构成等，在影视艺","术中，这一术语被用来指画面、镜头和声音的结构方式。","蒙太奇的完整概念，还应当包括以下三层含义：其一，从技术层面上讲，蒙太奇就是剪","辑；其二，从艺术层面上讲，蒙太奇应当是电影的基本结构手段和叙事方式，不但镜头与镜","头、段落与段落，甚至画面与声音均可构成蒙太奇组合关系；其三，从美学层面上讲蒙太奇","是影视艺术独特的思维方式，也是一种创作方法。蒙太奇不仅体现在后期剪辑之中，而且也","体现在前期的文学剧本和分镜头剧本， 乃至各个创作部门合作完成的整个创作拍摄过程之中。","从这个意义上讲，蒙太奇思维是影视艺术独特的思维方法。","影视艺术具有鲜明的社会性与时代性；鲜明的民族性和国际性；深刻的思想意蕴和独","特的艺术追求。","四  电视艺术","（1）电视的崛起和普及， 使加拿大传播学家麦克鲁汉早在20 世纪 60 年代上就提出了 “地","球村”的概念，认为电视和卫星等技术的出现，使地球“越来越小”，人类已跨越空间和时","间的限制，使信息在瞬息间便可传送到世界的每一个角落，因而地球已变成了一个村庄。","（2）1936 年 11 月 2 日，英国广播公司（ BBC）在伦敦郊外的亚历山大宫播出了一场","规模盛大的歌舞，标志着世界上第一座电视台正式开播，人们普遍把这一天作为电视事业的","开端。","","","","","1954 年，美国正式开办彩色电视节目，成为世界上第一个播出彩色电视节目的国家。","我国第一座电视台——中央电视台的前身——北京电视台，于 1958 年 5 月 1 日开始实","验播出，标志着中国电视事业的开端，同年 6 月 15 日又播放了我国第一部电视剧《一口菜","饼子》，中国电视艺术从此诞生。","（3）一般认为，电视具有新闻信息功能、文艺娱乐功能、社教功能和服务功能。调查","资料表明，电视观众的收视动机主要是获取信息与休闲娱乐。","电视剧是电视艺术的主要类型。电视剧的品种较多，主要包括单本剧、连续剧、系列剧","或小品等。","（4）电视作为一门独立的艺术，又有自己独具的特征。","①首先，电视的技术性形成了这门艺术的特性。电视画面的面积较小，清晰度较差，难","以表现众多的人物和较大的场面， 在镜头运用方式上多用中、 近景和特写， 少用远景和全景，","场景转换不宜太快，以便让电视观众弄清人物和剧情。","②其次，电视的参与性形成了这门艺术独特的观赏特点。","③再次，电视传播的迅速性形成了这门艺术更加生活化的特点。同时，电视剧在剧情内","容、演员表演、服装道具、环境布置等方面，都要求更加亲切、自然和生活化，直接和逼真","地反映生活。","（5）20 世纪 90 年代荷兰的《老大哥》开创了世界电视“真人秀”节目的先河，之后，","美国，法国英国代类文化史上自从等国也相继推出了多档“真人秀”节目。","电视“真人秀”节目到底有些什么特点呢？概括起来讲，主要有三大特征：第一是“真”","与“秀”的结合，也就是纪实性与表演性的结合，或者说是纪录性与戏剧性的结合。第二是","平民性与参与性相结合。平民性、大众性、草根性、参与性是“真人秀”节目的另外一个十","分明显的特点。第三，电视“真人秀节目的核心是游戏，游戏性与竞争性是其突出的特点。","第二节  综合艺术的审美特征","一  综合性与独特性","（1）综合艺术首要的审美特征就是综合性，这种综合性体现在两个层次上。首先，从","艺术学的层次上讲， 吸收了各门艺术中的多种元素， 将它们有机融汇在自己的表现手段之中，","","","","","从而大大丰富了自己的艺术表现力。 电影；中国戏曲。 其次， 从更高一层的美学层次 上讲，","戏剧、戏曲、电影、电视艺术的综合性绝不仅限于各门艺术元素的有机融合，而是更加集中","地体现在它们将时间艺术与空间艺术、视觉艺术与听觉艺术、造型艺术与表演艺术综合在一","起，实现了美学层次上的高度综合，使得它们能够将视与听、时与空、动与静、再现与表现","集于一身，从而具有了巨大的综合表现能力，极大地扩展和丰富了观众的审美感受，成为最","具有群众性的艺术门类。","（2）综合艺术既有综合性，又有独特性。虽然都是综合艺术，戏剧和戏曲是古老的传","统艺术，而电影和电视艺术则是现代科学技术的产物，渊源于西方的话剧同植根于中国的戏","曲，作为银幕艺术的电影和作为荧屏艺术的电视，它们之间也有着鲜明的区别。话剧注重再","现生活；戏曲则注重表现生活，源于西方的话剧注重写实，植根中国的戏曲注重写意。","二  情节性与主人公","（1）综合艺术基本上都属于叙事性艺术，都需要由人物的行动、人物与人物之间的关","系来形成一个有完整过程的生活事件，因而，它们一般都具有故事情节，并且以矛盾冲突为","情节发展的主要线索，在紧张而激烈的矛盾冲突中，塑造出具有典型意义的人物形象。","叙事性文艺作品一般都离不开情节。关于情节，有多种定义，其中较有影响的是：亚里","士多德和福斯特把情节看作具有因果联系的事件，高尔基把情节看作人物性格发展的历史。","情节的核心是事件和人物。","从总体上讲，综合艺术的情节结构方式大致可以划分为戏剧性情节和非戏剧性情节。","所谓戏剧性情节，是指按照戏剧冲突律法则来结构的情节，它往往具有强烈的冲突和曲","折的故事，大量运用巧合、悬念等艺术技巧，情节结构上有开端、有发展、有高潮、有结","局。中国戏曲也十分注意运用戏剧性情节。相比之下，电影（故事片）和电视（电视剧）既","采用戏剧性情节，同时也越来越注意运用非戏剧性情节，充分发挥影视艺术的特性。","所谓非戏剧性情节，建立在纪实性美学的基础之上，它主要不是依靠人工编造故事而是","致力于从生活中发掘情节。更多地采用心理结构、情绪结构等方式，注重发掘人物内心的情","感冲突，使故事情节更接近于生活事件本身这一类非戏剧性情节结构的影视作品，并不追求","情节的戏剧性、冲突性、曲折性，而是追求情节的真实性自然性、生活化，尤其注意以一种","内在的情绪来冲击观众的心灵，如《克莱默夫妇》《金色池塘》。","","","","","（2）通过情节来塑造人物形象和刻画人物性格，尤其要塑造出典型人物或典型性格。","从这种意义上讲，综合艺术作品中的主人公具有重要的审美价值。","主人公，是指戏剧、戏曲、电影、电视剧作品中的主要人物，或叫中心人物。主人公应","当是戏剧影视作品中刻画的人物形象，是作品内可以呈现出容的中心，是矛盾冲突的主体，","是情节展开的依据。 塑造鲜明、 生动、 富有个性的主人公形象， 是戏剧影视艺术最根本的任务。","莎士比亚的《哈姆雷特》；元代关汉卿的杂剧《感天动地窦娥冤》；《巴顿将军》。从","以上这些例子可以看出，优秀的戏剧影视作品总是要通过矛盾冲突来展开情节，塑造出具有","鲜明性格和典型意义的主人公形象。","三  文学性与表演性","戏剧、戏曲、电影、电视剧等综合艺术都必须经过二度创作，才能产生舞台形象、银幕","形象或荧屏形象，并为广大观众所接受和欣赏。这些综合艺术一度创作的核心是文学剧本，","二度创作的体现是表演艺术。所以，文学性与表演性在综合艺术中占有重要地位。","（1）文学性是综合艺术的基础。戏剧影视作品的创作，首先是从剧作者编写文学剧本","开始的，只有在文学剧本的基础上，导演、演员和其他艺术工作者才能进行二度创作，将其","展现在舞台上、银幕上或荧屏上。","戏剧文学剧本应当是戏剧性与文学性相结合的产物，影视文学剧本应当是电影性与文学","性相结合的产物。戏剧文学应当考虑到舞台、场景、演出时间，以及观众在剧场中的欣赏条","件等情况，设法使剧中的人物、情节、场景都具有集中性，通过尖锐激烈的矛盾又因袭着沉","重冲突和波澜起伏的戏剧情节，紧紧扣住观众的心弦。例如老舍的话剧《茶馆》；郭沫若的","历史剧《屈原》。","影视文学则应当考虑到拍摄需要和放映效果，应尽量将剧本中的一切人物和事件转化为","可见的视觉形象，充分运用画面、声音和蒙太奇等影视艺术语言，通过影视手段展示在银幕","或荧屏上， 直接作用于观众的感官。 因此， 影视艺术十分重视造型性和运动性， 《孙中山》 ；","《豪门恩怨》。","在所有的艺术门类中，唯有综合艺术与文学的关系最为密切。","（2）表演性是综合艺术的中心环节。戏剧、戏曲、电影、电视剧都属于表演艺术，表","演性是它们最突出的审美特征。所谓表演，就是指演员依据剧作家提供的剧本，按照剧本的","","","","","规定情境和角色的思想感情，在导演指导下进行二度创作，运用语言、动作创造人物形象。","优秀的表演艺术应当达到演员与角色的统一，生活与艺术的统一，体验与表现的统一。表演","艺术的核心，是解决演员与角色间的矛盾，这就需要演员努力克服自我与角色的距离，认真","分析和理解角色，塑造出性格化的人物形象。","表演艺术的关键，是掌握好“体验角色”和“表现角色”这一对矛盾。","戏曲表演艺术具有特殊性，戏曲表演具有程式化、歌舞化的特点，戏曲演员必须结合剧","中人物的思想感情和行动逻辑，借助戏曲程式进行创造性地表演，才能塑造出活生生的舞台","形象。 戏剧表演艺术与影视表演艺术的最大不同， 就在于前者需要不断地在舞台上进行创造，","而后者则是在拍摄过程中一次性地完成。戏剧表演具有当场反馈的剧场效果，；影视表演的","逼真性和镜头感。","文学性作为综合艺术的基础，表演性作为综合艺术的中心环节，二者都具有重要的地位","和作用。","第三节  中外综合艺术精品赏析","一  《哈姆雷特》（戏剧艺术）","《哈姆雷特》 是英国诗人、 戏剧家莎士比亚的剧作， 写于1601 年， 是莎翁的 “四大悲剧”","之一，约在 1603 年首演。","《哈姆雷特》 取材于 《丹麦史》 和一个失传的丹麦王子复仇记旧剧。 此剧中的鬼魂申冤、","主人公复
