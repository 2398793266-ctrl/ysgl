仇、戏中戏和流属西方复仇悲剧的传统手法，但作品在人物塑造和思想内容的开掘","上取得了极高成就。哈姆雷特身上集中体现着文艺复兴运动中人文主义者的优点和缺点及他","们的迷惘、矛盾和痛苦，成为世界文学中不朽的典型形象。","［赏析］","英国文艺复兴时期杰出的戏剧家和诗人莎士比亚，一生创作了 37 个剧本和其他文学作","品，被称为“英国戏剧之父”。最具有代表性的当数“四大悲剧”，即《哈姆雷特》《奥赛","罗》《李尔王》《麦克白》。","《哈姆雷特》是最早创作并且影响最大的一部作品。作品取材于 12 世纪末一个丹麦王","子复仇的故事，莎士比亚在欧洲文艺复兴的历史大潮推动下，将其改写成一出具有深刻思想","","","","","内容和现实意义、渗透着人文主义理想的杰出悲剧。","所谓戏剧性，主要是指戏剧冲突和戏剧动作。戏剧动作是戏剧冲突的外在表现，戏剧冲","突是戏剧动作的内在因素。构成戏剧动作的是剧中人物形体的、语言的、表情的种种动作，","观众常常通过演员的戏剧性动作来了解剧情的发展与把握剧中人物的性格。所谓戏剧冲突则","是指剧中展开的矛盾、纠葛和斗争，包括人与人之间、人与现实之间，以及人物内心的各种","各样的冲突和斗争。戏剧冲突是戏剧动作深层的动力和原因，戏剧冲突不是一般的动作和冲","突，而是通过内心冲突引发外在冲突，通过性格冲突强化人物冲突，由此达到戏剧尖锐冲突","的高潮。","二  《老妇还乡》（戏剧艺术）","瑞士当代作家迪伦马特的悲喜剧《老妇还乡》（又名《贵妇还乡》），作于 1956 年。","［赏析］","在戏剧中将悲喜剧混同，成为 20 世纪 50 年代以后的欧美戏剧界十分流行的一种观点。","于是，欧美戏剧领域中一种新的类型——悲喜剧——便应运而生了。美国戏剧理论家柯列根","通过社会思潮的变化来考察悲喜剧的发展，“悲喜剧的景象，几乎是无法避免的绝望。”那","么，观众为什么还要到剧场去观看悲喜剧呢？他回答道 :“深入悲喜剧的中心——超过绝望","——我们发现希望。”","《老妇还乡》正是悲喜剧的一个代表性作品。剧中整个情节是荒诞滑稽的，许多细节具","有漫画式的夸张，剧中人物行为动作滑稽可笑，幽默的语言夹杂着尖刻的讽刺，这一切使得","这出戏剧具有了喜剧的风格。但是，与此同时，剧中主要人物的命运却又是悲剧性的。","20 世纪 50 年代以来，悲喜剧影响到了世界各国的电影和电视剧，在这些艺术领域里也","出现了一批著名的悲喜剧作品。如苏联电影导演梁赞诺夫著名的“爱情三部曲”《命运的捉","弄》、《办公室的故事》和《两个人的车站》都是典型的悲喜剧电影。日本著名导演山田洋","次拍摄的《幸福的黄手帕》。","三  《雷雨》（戏剧艺术）","《雷雨》，中国话剧艺术经典，四幕话剧，戏剧家曹禺创作。剧作完全运用了“三一律”","原则，写两个家庭几个人物在短短一昼夜之间出发生的悲剧故事，表现了 20 世纪初封建社","","","","","会环境中的社会矛盾和家庭矛盾，以及封建制度与专制思想对人的禁锢与摧残。","［赏析］","第一， 《雷雨》 有着精湛的戏剧结构。 曹禺的 《雷雨》 遵循欧洲古典主义戏剧的 “三一律”","原则，它要求剧作的情节、时间和地点三个方面完整一致，即剧本故事情节必须单一，剧情","必须发生在一个地点， 剧情延续的时间必须以一昼夜为限。 还运用了回溯式的戏剧结构方法，","通过顺叙与倒叙相结合的方式，将过去的矛盾冲突与现在的矛盾冲突交织起来，将 30 年的","恩恩怨怨在一个昼夜里展开。","第二，《雷雨》有着尖锐的戏剧冲突。戏剧特别重视矛盾冲突，要求通过人物性格的冲","突、行为的冲突、思想感情的冲突，乃至于心理状态的冲突，等等，去展开剧情与表现生活。","《雷雨》 全剧的矛盾冲突始于30 年前周朴园对女仆侍萍的始乱终弃， 酿成了罪恶的根源，","造成了 30 年后，大儿子周萍与继母蘩漪的乱伦关系、周萍与女仆四凤同母异父兄妹间的不","伦之恋，直到造成最后周萍、周冲、四凤相继死去，侍萍和蘩漪发疯的悲惨结局。","第三，《雷雨》塑造了独特的人物形象。全剧只有 8 个人物，他们不但有着时代的、社","会的、个性的特色，而且还都具有现实生活中人物性格复杂多样的特点。","经典名著的改编是一种艺术的再创造，总体上讲，经典名著的改编应当遵循八字方针，","即“忠实原著，超越原著”。所谓“忠实原著”就是不得随意更改原著的主题思想、重要情","节和主要人物，“忠实”是改编的基础。所谓“超越原著”，强调改编又是一种再创造，创","造是改编的灵魂。改编者必须在改编后的作品中，体现自己对原著的理解和认识，并且加以","升华和提高。","四  《窦娥冤》（戏曲艺术）","《窦娥冤》，中国十大古典悲剧之一，元代杂剧家关汉卿的代表作品。该剧讲述了窦娥","一生的悲惨遭遇。","［赏析］","西方悲剧之所以一贯遵循“一悲到底”的悲剧结局原则，主要因为西方传统美学强调美","与真的统一，强调艺术的认识价值。与之相反，中国戏曲悲剧中，无论主人公遭遇到多少苦","难和不幸，但是最终结果都会苦尽甘来，基本上以大团圆结局，正如清代著名戏曲理论家李","渔所讲“有团圆之趣”（《闲情偶寄》）。正是在悲剧结局和团圆结局上，构成了西方悲剧","","","","","和中国戏曲悲剧之间最鲜明的区别和差异。中国戏曲悲剧的结局往往是“善有善报，恶有恶","报”，坚持善必胜恶的原则。","中华文化是一种伦理型的文化范式，西方文化是‘智性文化’，那么中华文化可以称之","为‘德性文化’。中国传统美学强调美与善的统一，注重艺术的伦理价值，与西方传统美学","强调美与真的统一并且注重艺术的认识价值截然不同。","在中国人的传统观念中，受尽苦难的，一定会有善报；恶贯满盈的，一定会得到惩罚。","也有人提出，佛教自汉代传入中国以后，很快被世俗化了，尤其是佛教在中国广为传布之后","的事情，佛教产生了很大影响，进一步强化了中国戏曲惩恶扬善的教化功能。于是，“善有","善报，恶有恶报”的大团圆结局终于成为中国戏曲悲剧的传统范式，而《窦娥冤》正是其中","的一个典型例证。","五  《一江春水向东流》 （电影艺术）","《一江春水向东流》，中国电影故事片，联华影艺社、昆仑影业公司1947 年联合摄制。","该片被视为中国 20 世纪三四十年代现实主义电影艺术的最高峰。","影片分为上下两集，上集《八年离乱》，下集《天亮前后》，全片以抗战前后张忠良和","素芬这一个普通家庭的悲欢离合为主线，真实、生动概括地反映了当时的社会面貌。它以不","同性格的人物、曲折变化的情节、细腻质朴的风格，反映了抗战时期广大人民群众的心情和","愿望，揭露了上层社会的腐朽荒淫以及官场的黑暗。","［赏析］","在百年中国电影发展史上，曾经有过三次辉煌的时期。","第一个辉煌时期是 20 世纪三四十年代，这个时期的中国电影，具有丰富的社会内涵、","浓郁的时代气息、真实的生活场景、典型的人物形象，为世界电影艺术贡献出了一批杰出作","品，同稍后出现的意大利新现实主义电影交相辉映。","第二个辉煌时期是 20 世纪五六十年代，又被称为“十七年”中国电影。这个时期的中","国电影犹如社会的晴雨表和政治的温度计，直接反映出社会的风风雨雨和复杂多变的政治气","候。","第三个辉煌时期是 20 世纪 80 年代，即“新时期”中国电影。这个时期，中国香港、台","湾及内地相继出现了以徐克、许鞍华为代表的香港“新浪潮”电影，以侯孝贤、杨德昌为代","","","","","表的台湾“新电影运动”，还有以陈凯歌、张艺谋为代表的内地“第五代”导演创作群体。","《一江春水向东流》正是中国电影第一个辉煌时期的代表作品。以现实主义的创作精神","和创作方法，通过一个家庭的命运变化，浓缩了从抗战到胜利、从沦陷区到大后方、从城市","到乡村、从平民到官僚的社会生活场景。","蔡楚生和郑君里有意识地借鉴中国传统美学思想， 善于吸收我国古典小说、 诗歌、 戏曲、","绘画等艺术的表现技巧，将其融入自己的影片之中。","在民族风格和民族特色的探索方面，《一江春水向东流》巧妙地吸收了中国戏曲和章回","小说展开情节的手法，以悲欢离合的戏剧性情节来感染观众。还吸收戏曲的叙事手法，大量","运用悬念、巧合、误会、偶然等多种手段，使矛盾冲突尖锐激烈。该片善于运用中国传统艺","术的对比手法，在人物关系上形成鲜明的对比。","中国 20 世纪三四十年代现实主义电影同 20 世纪四五十年代的意大利新现实主义电影相","比较。","共同之处在于它们都将镜头对准普通老百姓，反映二次大战给人民带来的种种苦难，揭","示各种尖锐复杂的社会问题，具有现实主义的鲜明特色。","不同之处在于中国 20 世纪中三四十年代现实主义电影针对中国观众的审美心理和审美","习惯，采用戏剧化电影美学观，以悲欢离合的故事和情节剧的方式去感染观众。而意大利新","现实主义电影则采用纪实性电影美学观，“把摄影机扛到大街上”，追求一种接近纪录片的","质朴真实感，甚至大量起用非职业演员，大量采用景深镜头，追求一种纪实风格。","六  《卧虎藏龙》（电影艺术）","《卧虎藏龙》，由中国电影集团公司、中国电影合作制片公司、英国联华影视公司于","2000 年合作出品。","［赏析］","李安这部影片力图用一种西方人能够读懂并接受的方式， 讲述一个东方悲情的武侠故事，","并且让西方人真正进入东方情境。李安《卧虎藏龙》的真正意义在于，这部影片已经不再是","以所谓“东方奇观”或阴暗落后层面来满足迎合西方观众的猎奇心理，而是以一种人类共同","的情感来打动西方观众。因为，人类的许多情感是共同的爱情、亲情、友谊等是属于全人类","共通的情感，生命、死亡、人生价值真善美等更是全人类共同关心的问题，这些都属于“终","","","","","极关怀”的范畴。","标志着华语电影开始以一种新的姿态进入国际主流商业电影市场，使东方文化与西方文","化在电影领域内开始了真正的交流。","拍摄《推手》 《喜宴》 《饮食男女》时，李安仍然在用东方人的眼光看待中国传统文化，","所以中国人熟悉，外国人陌生。而在拍摄《卧虎藏龙》时，李安已经开始用西方人的眼光来","看待中国传统文化，因此，中国人不习惯，外国人却很熟悉。","七  《罗生门》（电影艺术）","《罗生门》，日本黑白故事片，编剧桥本忍、黑泽明，导演黑泽明。","影片描写日本古代一个武士带着妻子途经森林，林中出一个强盗强盗蒙骗武士至偏僻处","并把他捆在树上，然后当着武士的面占有了他的妻子真砂。真砂要求两个男人决斗，武士在","与强盗决斗中死去。在官署公堂上，围绕这一宗杀人案，三个当事人为了私利都在说谎，而","一位旁观者樵夫也因私利而无法说出真相。","［赏析］","日本著名电影导演黑泽明 （1910——1998），1950 年拍摄了使他一举成名的 《罗生门》 ，","也为日本电影赢得了世界的关注，标志着日本电影进入了一个新的纪元，黑泽明也被人们尊","称为“黑泽天皇”。","一批电影大师始终在用电影思考人生、思考社会。例如，法国“新浪潮”领军人物戈达","尔深受法国存在主义哲学影响，他的《筋疲力尽》体现出典型的非理性主义色彩。意大利著","名导演费里尼，在《八部半》这部影片中，以主人面公吉多的彷徨痛苦，象征着“自我”与","“本我的不断搏斗。瑞典电影大师伯格曼始终在执着地探索善与恶的问题，他的代表作《处","女泉》就是在探究人性到底是善还是恶的问题。日本电影大师黑泽明则是在思考真与假的问","题，他的成名作《罗生门》正是在探索世界上到底有没有客观真理。","黑泽明的《罗生门》最独特之处，就是同一个事件，四个人却有四种不同的说法。","除了独特的叙事结构外，《罗生门》的影像风格也非常独特。这部影片大量采用运动摄","影，以摄影机高超的运动来贯穿整个文本的叙事。《罗生门》中的运动摄影具有强烈的主观","色彩，片中每个人物在讲述事件时，黑泽明采用的节奏都不一样，有的用快速跟拍的方式，","有的则采用静态镜头，从而突出当事人不同的内心世界。采用了大量近景镜头与特写镜头，","","","","","强化了这部影片复杂性自己的与多义性的内涵。","总而言之，黑泽明的《罗生门》作为日本电影史上一个重要的里程碑，至今仍然有着不","朽的艺术生命力。","八  《现代启示录》（电影艺术）","《现代启示录》，美国宽银幕彩色故事片， 1979 年出品，导演科波拉，主演马龙 ·白兰","度和马丁·希恩。影片根据康拉德小说《黑暗的心》改编。该片获 1979 年法国戛纳国际电影","节金棕榈奖，以及奥斯卡最佳摄影、最佳音响两项金像奖。","影片讲述越南战争期间，美军特种兵上尉威拉德接受了一项特殊的秘密使命，美军司令","部命令他到柬埔寨丛林寻找美军库尔兹上校， 并将他处决， 因为库尔兹上校已经变成杀人狂，","当上了当地土著的头领，成了丛林之王。","［赏析］","《现代启示录》之所以被评论界认为是最深刻、最有代表性的一部越战影片，首先是因","为科波拉在这部战争题材影片中，融入了对人性、对战争、对现代文明的哲学思考，并且巧","妙地将哲理性与象征性有机地融入整作部影片的情节之中。","其次，《现代启示录》的视觉冲击力也使人们震惊。按照科波拉的导演意图，这部影片","追求一种歌剧风格的戏剧光效，大量运用逆光、轮廓光、背景光等，还专门施放了红、黄、","绿、 蓝、 紫各种颜色的烟雾和烟火， 使血腥的战场和神秘的丛林看上去如同五光十色的舞台，","这样的视觉造型也是对美国现代文明和侵越战争的讽喻。","此外，《现代启示录》这部影片在人物塑造上也十分成功，该片主要人物中没有女性，","是一部典型的男性题材战争片。","总而言之，深刻的寓意、宏大的场面、精彩的表演，再加上震撼人心的视觉造型，使得","《现代启示录》真正如评论所言，成为“一部登峰造极的战争史诗片”。","","","","","第九章  语言艺术","第一节  语言艺术的主要体裁","所谓语言艺术，就是指人们常说的文学，包括诗歌、散文、小说、剧本等各种体裁。由","于文学总是以语言为手段来塑造艺术形象，反映社会生活，表达作者的思想情感，语言作为","艺术媒介和基本材料始终发挥着重要作用，因此，人们一般将文学称之为语言艺术。","一  诗歌","（1）诗歌是文学的基本体裁之一，如同其他文学体裁一样，也是用语言塑造形象以反","映社会生活和表达作者思想感情的艺术。","（2） 我国最早一部诗歌总集是 《诗经》 。 它产生的时代上自西周初期 （公元前11 世纪） ，","下至春秋中期（公元前 6 世纪），最后于春秋时期汇编而成。这是我国现实主义诗歌的源头。","我国文学史上第一位杰出诗人屈原，创作了古代最早一篇抒情长诗《离骚》，开创了我国浪","漫主义诗歌的先河。 西方流传至今最早的文学作品， 是诞生于公元前8 世纪左右的古希腊 《荷","马史诗》，即《伊利亚特》和《奥德赛》，对后来诗歌的发展产生了很大影响。","（3）按照作品的性质和塑造形象的方式不同，可分为抒情诗和叙事诗；按照诗歌的历","史发展和语言有无格律，又可分为格律诗和自由诗。","抒情诗主要通过直接抒发作者的思想情感，袒露诗人的内心世界，来间接地反映社会生","活。唐代诗人张继的《枫桥夜泊》。叙事诗常常通过描述故事或塑造人物来间接反映诗人对","生活的认识、评价、愿望和理想。叙事与抒情水乳交融地结合在一起，将诗人的主观感情融","化在写人叙事之中。例如北朝民歌《木兰诗》。","格律诗，又称旧诗，是指按照一定的字句格式和音韵规律写出的诗歌作品。无论中国还","是外国，格律诗都是古代形成的诗体。如五绝、七绝、五律、七律等，都是格律诗，欧洲古","典诗歌中的十四行诗，也是格律诗。美国 19 世纪诗人惠特曼是自由诗的创始者，他的代表","","","","","作是诗集《草叶集》。五四前后，自由诗开始在我国流行，郭沫若、胡适、刘半农等在此期","间均有新诗问世。","（4） 诗歌的特征是通过诗人强烈的情感和丰富的想象， 集中而概括地反映客观现实生活。","社会生活往往需要通过诗人主观情感世界的折射才能反映出来。诗歌特别注意运用优美的语","言来创造情景交融的意境。诗歌的语言，可以说是一切文学作品中最凝练、最优美、最富有","音乐感的语言。诗人往往呕心沥血、字斟句酌，通过最精粹的语言使诗歌具有如同音乐一样","的节奏和韵律。","二  散文","（1）散文也是文学的基本体裁之一，散文的含义和范围随着文学形态的发展演变，在","各个历史时期有着不同的内涵和内容。我国古代的散文范围很广泛，主要是指一种与韵文、","骈文相对立的文体，包括经、史、传等各种散体文章。随着文学的发展，散文后来被专门用","来泛指诗歌以外的一切文学体裁，包括杂文、传记、小说等都被容纳在里面。散文是一种自","由灵活、不受拘束的文学样式，能够迅速地表现作者的生活感受，真实地反映社会生活它选","材范围广泛，表现手法多样，结构自由多样，以形散而神不散的艺术特长来集中而凝练地体","现主题思想。","（2）散文的种类丰富多样，一般将其分为抒情散文、叙事散文和议论散文三大类。","抒情散文注重在叙事写人时表现作者主观的感受与情绪，通过托物言志或借景抒情，抒","发作者微妙复杂的独特情感， 将浓郁的思想感情融会在动人的生活画面之中。 冰心 《往事》 ；","朱自清的散文《荷塘月色》。","叙事散文，包括报告文学、特写、速写、传记文学、游记等，侧重于叙述人物、景物或","事件，尤其是现实生活中的真人真事，并且将作者的主观情感蕴藏在对于人物和事件的叙述","之中。夏衍于 1936 年发表的报告文学《包身工》；柳宗元的游记《小石潭记》。","议论散文，主要是指杂文，它将政论性和文学性结合在一起，运用形象生动的语言，以","及比喻、反语等手法，乃至以幽默、讽刺等为锐利的武器，进行精辟深刻的说理和妙趣横生","的议论，成为一种相对独立的文学样式，具有以理服人的理论说服力和以情感人的艺术感染","力。","（3）散文的一个重要特征是自由灵活，表现为题材的广泛性、手法的多样性和风格的","","","","","多样化。从散文的选材来看，它几乎无所不包，完全不受时间和空间的限制，上至天文，下","至地理，古代历史、当代现实都可以作为题材。","从散文的手法来看，虽然有抒情散文、叙事散文和议论散文的区分，但这种划分只具有","相对的意义，因为叙述、抒情和议论都是散文常用的手法，只不过在每篇作品里有所侧重而","已。从散文的风格来看，更是百花齐放、丰富多彩。散文的这种自由灵活性，还表现在它的","文字可长可短，结构上不拘一格，无需像诗歌那样遵守韵律和节奏的和谐，也不必像小说那","样需要典型的人物和完整的情节，是一种最无拘无束的文学样式。","散文的另一个重要特征是形散而神不散。顾名思义，散文由于其自由灵活的特点，在结","构形式上显得比较“散”，事实上，优秀的散文总是形散而神不散，具有深刻的意蕴和凝练","的主题。不论记人、叙事、说理、抒情，散文都要借生活中的事件与人物，抒发作者自己的","思想和感情， 这种蕴藏在作品之中的深刻的思想意蕴， 就是散文的 “神” 。 陶渊明的散文 《桃","花源记》；朱自清的早期散文《背影》。","三  小说","（1）小说是一种以叙述故事、塑造人物形象为主的文学体裁，它的特点是在生活素材","的基础上用虚构的方式来再现生活。人物、情节和环境是小说不可缺少的三个基本要素。","（2）分类：","根据题材的不同可分为神话小说、传奇小说、历史小说、志怪小说、言情小说、武侠小","说、社会小说、战争小说、爱情小说、惊险小说、科幻小说；","根据艺术结构和表现形式的不同，又可分为话本小说、章回小说、日记体小说、书信体","小说、现代主义小说；","根据容量大小和篇幅长短，分为长篇小说、中篇小说和短篇小说这样三大类。","（3）人物、情节和环境是小说的三要素。人物在小说中是最基本的构成要素之一，通","过多个侧面和多种手法来塑造人物形象也是小说最重要的特征。","情节是小说另一个基本的构成要素。一般地讲，情节对于所有叙事文艺作品都是必不可","少的，但在不同种类和体裁的艺术作品中，情节的地位和作用是有所不同的。","小说的情节要求曲折生动， 《三国演义》 ；小说的情节也要求真实感人， 《人到中年》 ；","小说的情节还要求含蓄深沉，《老人与海》。","","","","","环境同样是小说的一个基本构成要素。环境一般是指文艺作品中人物活动于其中的社会","环境和自然环境。任何一部小说，它所描述的情节和刻画的人物，都只能在一定的社会环境","和自然环境条件下存在，绝对不可能脱离环境而存在。《红楼梦》通过对大观园环境的细致","描写，展现人物的身份地位和性格；《简 ·爱》详细描述了罗切斯特庄园的环境。小说中的","环境只能是一定背景下的具体社会环境或自然环境，而小说的背景则是指这一具体环境得以","产生的那个特定的时代和历史条件。《战争与和平》以 1812 年俄法战争为中心。","第二节  语言艺术的审美特征","集中体现为间接性与广阔性、情感性与思想性、结构性与语言美等几个方面。","一  间接性与广阔性","（1）文学运用语言来塑造艺术形象，传达审美情感，读者必须通过想象才能感受到艺","术形象，因此，文学形象具有间接性。这种间接性既是语言艺术的局限，也是语言艺术的特","长和优势，因为它使得文学形象具有了其他艺术无法与之相比的广阔性。","文学形象的间接性，可以说是文学区别于其他一切艺术的重要特征之一。需要读者凭借","自身的生活经验和文学修养，在阅读作品的过程中，通过积极活跃的联想和想象，在自己的","头脑中呈现出活生生的形象画面来，这就构成了语言艺术形象的间接性，因而人们把文学又","称作“想象的艺术”。","文学形象虽然不能通过读者的感受器官来直接把握，但它通过语言的中介，激发读者的","想象，同样可以使读者如闻其声，如见其人，产生如临其境的审美效果，使文学形象活灵活","现地、栩栩如生地呈现于读者的心灵。例如《水浒传》塑造了梁山一百零八个英雄形象，人","人性格不同，个个有血有肉。","（2） 文学天地的广阔性， 同样来自语言媒介的特性。 语言具有广泛而深入的表现能力，","用语言来表现现实生活，几乎很少受到时间和空间的限制。语言有着最大的自由和极大的容","量，能够全方位、多角度地展示广阔而复杂的社会生活。哥伦比亚作家马尔克斯的长篇小说","《百年孤独》；《战争与和平》。","文学的广阔性更表现在它不仅能描绘外部世界，而且能够深入到人的内心世界，直接揭","","","","","示各种人物复杂的、丰富的精神世界。向人的内心世界的深处发展，无疑使文学的天地变得","更加广阔，而这一点，恰恰是其他艺术种类难以达到的。司汤达在《红与黑》；奥地利现代","著名作家茨威格的小说《一个女人一生中的二十四小时》。","二  情感性与思想性","（1）任何文学作品都包含着作家的主观情感。文学的情感性越浓烈，越能感染读者，","就越富有艺术魅力。","语言艺术比起其他艺术来，更能表现人的丰富、复杂、细腻的情感。在这方面，文学由","于采用语言作为媒介，在表现人物的内心情感世界上，具有得天独厚的优势。例如，《红楼","梦》第二十七回“黛玉葬花”；《战争与和平》。","（2）语言艺术的思想性在深度和广度上也远远超过了其他艺术形式。这与它采用语言","作为媒介分不开的，因为只有语言才能直接表达人的思想，在直接披露人的思想认识、评价","判断方面具有最强的艺术表现力。当然，文学作品的思想性绝不是空洞、抽象的说教，它应","当蕴藏在作品的艺术形象之中，成为作品具有强烈艺术感染力的灵魂。","曹雪芹的《红楼梦》，巴金的《家》《春》《秋》，托尔斯泰的《战争与和平》，巴尔","扎克的《人间喜剧》系列社会小说等，都出色地展现了整整一个历史时期广阔而复杂的社会","现实生活，提出或回答了那一时代人们普遍关心的重大社会问题。作家总是通过鲜明生动的","艺术形象来表述出自己的认识、判断和评价，在一定程度上揭示出生活的哲理或社会发展的","历史规律。","（3）在文学作品中思想性和情感性二者的关系极为密切。文学作品的思想性总是被情","感所包裹并通过艺术形象表现出来的，只有将情感渗透在思想里的作品才具有震撼心灵的艺","术魅力，使读者在激动不已的同时去深入领会作品蕴藏的思想内涵。另一方面，文学作品的","情感性也离不开思想性， 因为这种情感往往是在理性的指导下才具有特定爱憎情感的倾向性。","所谓倾向性，其实就是作家的爱憎褒贬体现在文学作品中的思想艺术属性。","显然，文学作品中的思想性和情感性二者相互渗透、相互融会，成为一切文学作品所不","可缺少的要素。","","","","","三  结构性与语言美","（1）所谓结构，是对文学作品中各个组成部分的整体安排，它是文学作品的内部联系","和构成的方式。","结构本身也具有审美价值，结构美成为文学作品艺术美的重要组成部分。在各种类型的","文学作品中，结构都能提供一种自身的美感。以小说为例，有复线型小说结构，如《安娜 ·","卡列尼娜》；蛛网型小说结构；还有辐射型小说结构。","（2）文学是语言的艺术，语言自然成为这个艺术种类的第一要素。文学以语言为媒介","和手段，从而使得文学具有了与其他艺术相区别的审美特性，文学的语言因为具有准确性、","鲜明性、生动性、形象性等特点，本身也具有审美的价值。从某种意义上讲，这种语言美甚","至构成了文学的特质美。","文学语言的准确性，要求语言最恰当、最确切、最精练地表现对象。诗歌的语言常常需","要字斟句酌、 反复推敲， 通过锻字炼句的功夫， 用极少的文字去完美地表达异常丰富的内容，","唐代诗人贾岛对于“僧推月下门”还是“僧敲月下门”的斟酌，就是大家所熟悉的例证。","文学语言的鲜明性，要求语言清晰明确、新鲜活泼，富有特色。人物的对话一般都应当","少而精，而且要高度性格化，影视剧本在描写事件和人物时，同样需要视觉性强、画面感强","的语言。","文学语言的生动性，是指文学作品往往运用比喻、排比、夸张、拟人等多种修辞手法。","文学语言的形象性， 就是指文学作品中语言的准确性、 鲜明性、 生动性往往结合在一起，","达到情韵浓郁、形象传神的效果，使读者如闻其声、如见其人、如历其境、如经其事，从中","获得丰富隽永的感受。例如吴敬梓的《儒林外史》中。","第三节  中外语言艺术精品赏析","一  《离骚》（诗歌）","《离骚》是屈原的代表作，也是楚辞的代表作。《离骚》是我国古代最早且最长的一首","抒情诗。","《离骚》全诗可以分为三大部分。第一部分诗人诗人表达了自己坚持理想、至死不变的","决心。第二部分诗人开始驰骋想象，进一步借历史上的兴亡事例阐明自己的政治抱负，并通","","","","","过想象上天入地、 上下求索， 来表达自己对理想的热烈追求， 以及追求失败后所遭遇的痛苦。","第三部分从想象又回到现实，虽然幻想离开楚国远游，但终于恋恋不舍故国家园。在去与留","的矛盾痛苦之中，诗人最终决定以身殉国。","《离骚》全诗洋溢着浪漫主义精神，其想象之丰富，其辞藻之华美，其情感之强烈，其","意蕴之深远，均堪称千古绝唱。","[ 赏析 ]","袁行霈先生指出 :“诗与骚成为中国诗歌发展史的两条主流。 诗与骚是两种不同类型的美。","以国风与一小部分小雅为代表的诗型美，带有浓郁的生活气息和泥土气息，质朴淳厚，亲切","感人。骚型美，则带有强烈的传奇色彩和英雄色彩。”《诗经》代表着我国现实主义诗歌的","源头，《楚辞》则开创了我国浪漫主义诗歌的先河。","作为楚辞的代表作品，《离骚》闪耀着神奇的浪漫主义色彩。这种强烈的浪漫精神，尤","其表现为丰富奇特的想象和激越强烈的情感这两个特点一方面，《离骚》具有超人的想象，","诗人采用非现实的神话方式，超越时空的束缚，直接达到自由的天地，描绘出一幅气象万千","的瑰丽画卷。另一方面， 《离骚》又具有强烈的情感，通览全诗，洋溢着一种哀怨悲愤之情，","充满着一种为理想而献身的精神。","此外，《离骚》辞藻之华美，也向来为人所称道。诗人在《诗经》赋、比、兴的基础上","又有新的发展，将比兴从自然界扩大到社会生活，从现实扩大到历史，从人间扩大到神话，","大大丰富了比兴手法，使得比兴手法更加具有多样性。","屈原在《离骚》中对理想的执着追求和对祖国的无比热爱，以及卓然独立的人格美和积","极的浪漫精神，对于我们今天来讲仍然具有现实的美育意义。 《离骚》中“路漫漫其修远兮，","吾将上下而求索”，已经成为一代又一代华夏子孙的座右铭。","二  《荷马史诗》（史诗）","《荷马史诗》，古希腊两部著名史诗《伊利亚特》和《奥德赛》的总称，传为荷马编订，","故得此名。公元前 6 世纪正式用文字记录下来。","［赏析］","《荷马史诗》对于了解公元前 11 世纪至公元前 9 世纪，古希腊人的社会生活情况也具","有十分重要的认识价值，至今人们还把这一时期称为希腊历史上的“荷马时代”。","","","","","《荷马史诗》 不仅有很高的文学价值和艺术价值， 而且也有很高的历史价值和文化价值。","作为神话与历史相结合的作品， 《荷马史诗》其实也记载了公元前11 世纪至公元前 9 世纪，","希腊社会由原始氏族公社制向奴隶制社会过渡的历史时期， 史称 “英雄时代” 或 “荷马时代” 。","其次，《伊利亚特》和《奥德赛》的艺术成就，更在于这两部史诗成功地塑造了一批有","血有肉、个性鲜明的英雄人物形象。希腊联军的杰出将领阿喀琉斯是一名威震敌军的英雄，","黑格尔赞扬阿喀琉斯 :“这是一个人！高贵的人格的多方面性在这个人身上显出了它的全部","丰富性。”","再次，《荷马史诗》规模宏伟、布局巧妙，故事情节高度集中。《伊利亚特》集中描写","了十年特洛伊战争中最后一年几十天内发生的故事。以阿喀琉斯的愤怒为开端，又以他息怒","为终结，自始至终抓住“愤怒”这一线索来叙述故事和塑造人物。所谓“阿喀琉斯的愤怒”","也由此得名。《奥德赛》更是采用倒叙与插叙相结合的手法，把奥德修斯历经十年磨难回家","的漫长过程，集中压缩到最后四十天，使作品情节紧凑、详略得当。","三  《红楼梦》（长篇小说）","《红楼梦》，清代曹雪芹（约 1715——约 1763）所著长篇小说，共一百二十回。前","八十回为曹雪芹所作，后四十回多认为由高鹗续写。原名《石头记》，后由程伟元、高鹗于","乾隆五十六年（1791）首次印行，改名为《红楼梦》。","小说以贾宝玉、林黛玉的爱情悲剧为主线，联系着广阔的社会背景，描绘贾家荣，宁二","府大家庭内部错综复杂的人际关系，包括父子、兄弟、妻妾、嫡庶、主仆之间的各种各样的","矛盾冲突，包括家族之间的倾轧、骨肉之间的陷害，也有忍无可忍的抗争、对纯真爱情的追","求，等等，堪称一首封建大家庭没落的挽歌。","［赏析］","《红楼梦》塑造了许多脍炙人口、家喻户晓的人物形象。全书共四百多个人物。《红楼","梦》刻画人物形象，不光是性格独特、血肉丰满，而且特别擅长于刻画人物心理。","其次，《红楼梦》涉及社会生活的方方面面，从建筑园林到饮食文化，从诗词歌赋到器","皿酒具、从穿着服饰到医药知识，简直可以说是中国封建社会晚期的一部大百科全书，充分","体现出中国传统文化的积淀。","《红楼梦》最吸引人的地方，还在于它那永远无法穷尽的艺术意蕴。","","","","","叶朗先生认为 :“《红楼梦》的意蕴大致可分为三个层面。第一个层面，是《红楼梦》","以前所未有的广度和深度真实地反映了清代前期的社会面貌和人情世态。 第二个层面， 是 《红","楼梦》的悲剧性。第三个层面，是《红楼梦》处处渗透着作家曹雪芹对整个人生的很深的感","悟，一种哲理性的感悟、感兴、感叹。它引导读者去体验整个人生的某种意味。这就是《红","楼梦》的意境。”艺术意蕴就是作品所蕴藏的文化内涵和人文精神。","四   《安娜·卡列尼娜》（长篇小说）","《安娜·卡列尼娜》 ， 俄国文学大师列夫·尔斯泰最重要的代表作， 写于1873 年至 1877 年。","小说取材于俄国 19 世纪六七十年代的现实生活，由两条平行的线索构成，一条是安娜的爱","情悲剧，另一条是列文的婚姻和事业。","[赏 析]","这部作品的整体结构采用一种对比手法，将安娜和列文两条线索平行展开，形成了这部","小说结构上的一个鲜明特色。在广阔社会生活背景下进行了两个领域的探索，生动地反映了","俄国农奴制改革后，随着资本主义发展所引起的社会生活的巨大变化，以及这种变化给人们","心灵产生的巨大影响。","列夫·托尔斯泰生活在俄国 19 世纪，这是俄国历史上沙皇统治最腐朽、最黑暗的年代，","却也是俄国文学艺术群星璀璨、 成果辉煌的年代。 文学界除了列夫·托尔斯泰以外， 还有普希金、","陀思妥耶夫斯基、屠格涅夫等一批赫赫有名的作家和诗人。戏剧界出现了果戈理、契诃夫等","一批戏剧大师。音乐界出现了柴可夫斯基，以及以穆索尔斯基为首的“强力集团”。美术界","出现了以列宾、苏里科夫为首的“巡回展览画派”。舞蹈界出现了《天鹅湖》《睡美人》等","一批著名古典芭蕾舞剧。文艺理论界，也出现了著名的“别、车、杜”，即别林斯基、车尔","尼雪夫斯基、杜勃罗留波夫这三位杰出的文艺理论家。","为什么 19 世纪经济上落后、政治上黑暗的俄国，能够在文艺领域取得如此辉煌的成就","呢？一方面，这是由于物质生产与艺术生产之间具有一种“不平衡关系”，艺术的繁荣离不","开经济的发展，但并不是完全取决于经济的发展。另一方面，杰出的文学家和艺术家总是具","有超出普通人的艺术敏感，在沉沉的黑夜中他们能够最先感受到黎明的曙光，在漫漫的冬季","严寒里他们可以最先嗅闻到春天的气息。","","","","","下编  艺术系统","艺术生产理论，艺术审美价值的产生和实现，必须经过艺术生产的全过程，它包含着艺","术创作、艺术作品、艺术鉴赏这样三个部分或三个环节。艺术的创作过程，可以看作是艺术","审美价值的“生产阶段”，它是创作主体（艺术家）和客观现实生活相互作用的产物。","艺术作品，可以说是艺术生产的成果或产品，艺术作品的价值就在于满足人们的特殊的","精神需要——审美需要。艺术的鉴赏过程，可以看作是艺术审美价值的“消费阶段”，它是","鉴赏主体（读者、观众、听众）和鉴赏客体（艺术品）相互作用的结果。","艺术生产作为一种特殊的精神生产，应当包括艺术创作、艺术作品、艺术鉴赏这样三个","彼此独立又相互联系的环节，它们共同组成了一个完整有机的艺术系统。","","","","","第十章  艺术创作","第一节  艺术创作主体—艺术家","在艺术生产中，艺术家是艺术品的生产者和创造者。没有艺术家，就没有艺术创作，也","就没有艺术作品和艺术鉴赏。因此，我们要了解艺术，了解艺术创作，首先就必须了解作为","艺术生产创造主体的艺术家。","一  艺术家是艺术生产的创造者","（1）艺术家是专门从事艺术生产的创造者的总称。艺术家应当具备艺术的天赋和艺术","的才能，掌握专门的艺术技能和技巧，具有丰富的情感和艺术的修养，能够通过自己的创造","性劳动来满足人们特殊的精神需要即审美需要。","（2）艺术生产创造者的艺术家具有许多自身的特点。","第一， 艺术家内部有多种多样的职业和分工。 个体性艺术生产和集体性艺术生产的区分，","以个体劳动方式进行创作的文学作家、雕塑家、画家等，也包括以集体劳动方式进行创作的","戏剧艺术和影视艺术的编剧、导演、演员。","艺术生产的方式不同，有一次性的艺术生产如绘画、雕塑、文学等，也有多次性的艺术","生产如音乐、舞蹈、曲艺、杂技等表演艺术。对于同一个艺术作品，不同的表演艺术家往往","有各自不同的理解和感受，从而有不同的表演方式和演出效果。例如京剧《霸王别姬》，梅","派表演艺术讲究精湛优美，尚派表演艺术则以刚劲婀娜著称。","第二，真正的艺术家往往具有为艺术而献身的精神。由于艺术生产是一种自由自觉的精","神生产，真正的艺术家绝不把艺术作为谋生或获取名利的手段，而是看作自己毕生的事业和","追求，并为之奉献自己的全部心血和生命。比如被称为“后印象主义”三位大师的塞尚、凡","·高和高更。","真正的艺术家从事艺术创作，总是出于强烈的社会责任感和对艺术本身执着的爱。屈原","","","","","《离骚》，表达了他对祖国的炽热感情和为理想而献身的强烈愿望。司马迁《史记》。","第三，艺术家具有敏锐的感受、丰富的情感和生动的想象能力。艺术生产是一种特殊的","精神生产，它的突出特点是把艺术家强烈的主观因素渗透到艺术创作之中，并且“物化”为","艺术作品和艺术形象，因此，艺术家在艺术创作中占有核心地位，艺术家的内在精神世界显","得尤其重要和突出。艺术家自身的感受、情感、思想、心境、愿望、志趣等因素，对艺术创","作活动都有着至关重要的意义。正因为如此，艺术家必须具有超出常人的敏锐感受力、异于","常人的丰富情感、 强于常人的艺术想象力。 艺术家作为创作主体， 绝不能冷冰冰地对待生活，","也不能像思想家、科学家那样冷静客观地对待事物。艺术家应当具有特别敏锐的观察、体验","与感受生活的能力，并且将自己强烈的情感和逼真的想象力融入艺术作品中，才能创作出有","血有肉、生动感人的艺术形象。","第四，艺术家具有卓越的创造能力和鲜明的创作个性，具有强烈的创新意识。艺术创作","是人类一种高级的、特殊的、复杂的精神生产活动。艺术的生命就在于创造和创新。没有创","造，没有创新，就没有艺术。这就意味着艺术家必须不断地超越前人，超越同时代人，以及","不断地超越自己。","第五，艺术家必须具有专门的艺术技能，熟悉并掌握某一具体艺术种类的艺术语言和专","业技巧。艺术生产是一种特殊的精神生产，它与物质生产也有某些相似之处，这就是通过劳","动创造出“产品”来。对于艺术生产来讲，就是要创造出艺术作品或艺术形象，这就要求艺","术家应当具有艺术表现的技巧和艺术传达的能力。","画家必须经过长时间的刻苦训练和艰苦探索，才能熟练掌握绘画的艺术技能和技巧，掌","握和运用造型艺术的线条、色彩、形体等艺术语言；雕塑家必须掌握刻、镂、凿、琢、塑、","铸等各种技艺和手法，汉代画像石就是采用“刻”的方式。","二  艺术家与社会生活","（1）作为艺术创作的主体，艺术家与社会生活有着十分密切的关系。艺术创作从主客","体两个方面来看，都与社会生活有着十分密切的关系。","从创作客体来讲， 社会生活是创作的源泉和基础， 艺术创作不能离开客观现实社会生活 ；","从创作主体来讲，艺术家总是属于一定的时代民族和阶级，艺术创作归根结底受着一定社会","生活方式的制约，也与艺术家本人的生活实践与生活经历密不可分。","","","","","（2）一方面，社会生活是艺术创作的源泉和基础，因而，艺术家对社会生活的观察和","体验就显得十分重要。张璪有一句名言“外师造化，中得心源”，就是强调画家要向大自然","学习，这也是对于绘画创作中主客体关系的一个精辟独到的概括。清代绘画大师石涛也有一","句名言，叫作“搜尽奇峰打草稿”。","艺术家对社会生活的这种观察与感受又分为直接体验与间接体验两种情况。所谓直接体","验，是指艺术家在生活中亲历的所见、所闻、所感、所遇，这些亲身经历往往成为艺术家创","作的原料，激发起艺术家的创作欲望，激发起艺术家生动的想象和丰富的情感。所谓间接体","验，是指艺术家从他人的言谈和著作中所吸取的生活经验，这些间接的生活体验常常可以扩","大艺术家的视野，拓展艺术家的生活积累，诱发艺术家的创作灵感。","另一方面，艺术家本人作为创作主体，总是属于一定的民族和时代，他与社会生活有着","千丝万缕的联系。因此，艺术家在进行艺术创作时，不仅需要从社会生活中吸取创作的素材","和灵感，而且要对社会生活作出判断和评价，自觉或不自觉地表明自己的倾向和态度，从主","观方面也折射和体现出社会生活的影响来。艺术作品并不是社会生活的简单再现，从生活到","艺术是一个创造的过程， 艺术家总是要把自己的情感、 思想、 愿望、 理想熔铸到艺术形象中。","艺术既是再现，又是表现。但是，艺术家的这种主观表现，同样是以艺术家所处的社会生活","实践为依据的。","（3） 社会生活对于作为创作主体的艺术家来讲， 不仅影响到他的情感、 思想、 愿望、 理想，","甚至还可以推动艺术家提高技巧， 通过广泛地、 自觉地、 创造性地深入生活， 进而超越生活，","超越传统，自成一家。范宽《溪山行旅图》。如果画家本人没有亲身经历秦陇山区，露宿山","林村野之间，饱尝行旅之苦，绝不能将这幅画画得如此气韵生动，令观者犹如身临其境，神","游心赏。","一方面，社会生活作为艺术创作客体，为艺术家提供了创作的素材和灵感。另一方面，","社会生活又对艺术家的思想情感和创作风格产生了深刻的影响。","三  艺术家的艺术才能与文化修养","（1）艺术才能，是指艺术家创造艺术形象的能力，它是先天禀赋和后天训练培养相融","合而形成的艺术创造力。","艺术才能虽然同艺术天赋分不开，但更有赖于后天的刻苦训练和培养，有赖于长期的、","","","","","艰苦的、勤奋的艺术实践。","唐代“画圣”吴道子，艺术上兼收并蓄、刻苦钻研，使他在继承传统优秀技法的基础上，","创造出“吴家样”的整体艺术特色，在色彩、线条、造型、质感等多方面都有鲜明的独创性。","美术界对于画家、雕塑家的训练更是有着一整套严格的要求。就拿中国画来说，笔势变","化的训练和要求，还有“十八描”等手法供临摹之用。","（2）艺术家的文化修养包括深刻的思想修养、深厚的艺术修养，以及自然科学和社会","科学等多方面的广博知识。《清明上河图》中包含着众多的社会信息和风俗人情，因此一些","历史学家在研究北宋历史时也把它作为形象的参考资料。","艺术家的文化修养，同艺术才能的培养一样，同样需要长期勤奋的学习和实践。达 ·芬","奇之所以在绘画艺术中取得这样巨大的成就，除了优越的艺术天赋、刻苦的技巧训练外，同","他渊博的科学文化知识也有很大的关系。学习数学、透视学、光学、解剖学等多方面的科学","文化知识，为他后来的艺术创作奠定了深厚广博的文化基础。","艺术家深厚的文化修养，无不来自勤奋的学习、艰苦的探索和不懈的实践。这种学习，","包括学习和借鉴前人的经验，也包括学习和借鉴同时代本国和外国艺术家的经验，还包括学","习和借鉴其他姊妹艺术的经验，更包括学习哲学、历史、文学、美学、伦理学、心理学、社","会学和自然科学等多方面的广博知识。只有这样，才能使艺术家真正具有博大深厚的文化修","养。","第二节  艺术创作过程","（1）艺术创作活动 是人类特有的一种高级的、复杂的精神活动与实践活动。它是指艺","术家在创作欲望的推动下，运用一定的艺术语言和艺术手法技巧，通过艺术的加工和创造，","将自己的生活体验与思想情感转化为具体、生动、可感的艺术形象，将自己的审美意识物态","化为艺术作品。","（2）艺术创作过程又大致可以分为艺术体验活动、艺术构思活动和艺术传达活动这样","三个方面或三个阶段。","郑板桥描述画竹的过程可以用来作为例证。清代著名画家郑板桥曾经把画竹的过程分为","“眼中之竹”“胸中之竹”“手中之竹”这样三个阶段。所谓“眼中之竹”，就是指艺术家","","","","","应当观察生活、感受生活，这是艺术创作的准备阶段或酝酿阶段，也就是艺术体验活动。所","谓 “胸中之竹” ， 是指艺术家有了艺术体验和创作欲望后， 正式开始了在头脑中的艺术创作，","形成主客体统一的审美意象，俗话讲就是打腹稿，也就是艺术构思活动。所谓“手中之竹”，","是指艺术家通过艺术媒介或艺术语言，将审美意象物态化为可供其他人欣赏的艺术形象，形","成艺术作品，也就是艺术传达活动。","总体上可以大致划分为艺术体验、艺术构思与艺术传达这样三个方面或三个阶段。","一  艺术体验活动","艺术体验活动可以说是艺术创作的准备阶段，它可能是一个相当长期的过程。所谓艺术","体验是指一种活跃的、丰富的、深刻的内心活动，它伴随着强烈的情感情绪，把艺术家长期","对于生活的感受、 观察和思考， 形成艺术创作的基础和前提， 乃至萌发不可遏制的创作欲望。","托尔斯泰更是非常重视和强调“体验”在艺术创作中的重要性，他甚至认为全部艺术创","作的本质，无非就是把自己体验过的感情传达给别人。他说 :“在自己心里唤起曾经一度体","验过的感情，在唤起这种感情之后，用动作线条、色彩、声音以及言词所表达的形象来传达","出这种感情，使别人也能体验到这同样的感情——这就是艺术活动。”","艺术体验是艺术创作的起始阶段，也是艺术创作的基础。苏里科夫，是著名的俄罗斯巡","回展览画派代表人物之一，在《女贵族莫洛卓娃》这幅画中，画家多年前的深切体验，成为","创作这幅著名油画的重要契机，成为后来艺术构思和表现的重要准备。","艺术体验首先需要艺术家仔细地观察生活，深切地感受生活，认真地思考生活，同时，","艺术体验更需要艺术家以自己的全部身心去拥抱生活，需要艺术家饱含情感地切身体验。这","种饱含艺术家情感的切身体验，就是刘勰所讲的“登山则情满于山，观海则意溢于海”，就","是杜甫所讲的“感时花溅泪，恨别鸟惊心”。","这种切身的艺术体验，有时还需要调动艺术家的全部感觉，例如元代大画家赵子昂善于","画马，他在观察和体验时，不仅运用自己的视觉和听觉，而且运用自己的触觉、运动觉等来","进行切身体验，他在观察马时，常常解开衣服，趴在地上，学着马的跑跳腾跃等各种动作，","使自己的感受更加真切。","深切的生活体验和丰富的感性积累，不仅为艺术创作奠定了雄厚坚实的基础，而且常常","成为艺术家从事艺术创造的内在心理动力或诱因，成为一种重要的创作动机。艺术家在观察","","","","","生活、思考生活、体验生活的过程中，必然有大量的所见、所闻、所知、所感，在脑海里积","贮，一旦这种体验积累升华到不吐不快的程度，艺术家的创作激情就会像开闸的洪水一样喷","涌而出，一发而不可收。郑板桥画竹，秋天清晨早早起床到园中观看竹子，只见烟光、日影、","露气都浮动于竹子的疏枝密叶之间， 这种独特的审美体验不禁使画家怦然心动， “胸中勃勃，","遂有画意”， “因而磨墨展纸，落墨倏作变相”，使“眼中之竹”和“胸中之竹”变成了“手","中之竹”。","二  艺术构思活动","（1）有了艺术体验，并且萌发了创作欲望，正式的艺术创作就开始了，这也就是艺术","的构思活动。","艺术构思是一种十分复杂的精神活动，也是一项艰苦的脑力劳动，它是艺术家在深入观","察、思考和体验生活的基础上，加以选择、加工、提炼、组合，并融会艺术家的想象、情感","等多种心理因素，形成主体和客体统一、现象与本质统一、感性与理性统一的审美意象。如","果用一句话来概括，艺术构思活动就是在艺术家头脑中形成主客体统一的审美意象。而以后","的艺术传达活动则是把这种审美意象通过艺术媒介或艺术语言，物态化为可供其他人欣赏的","艺术形象。","“意象”这一概念，最早是中国古典美学中使用的术语，但是，近代西方哲学与艺术理","论也在使用这一概念。至于审美意象，则是指在对客观世界审美感知与体验的基础上，融会","主观的思想感情、愿望、理想，在艺术家头脑中经过艺术创造形成的意象。这种主客体统一","的审美意象，一旦经过艺术媒介或艺术语言等物质手段传达出来，就成为艺术作品的艺术形","象。因此，艺术构思阶段的主要任务，就是形成或产生这种审美意象。在艺术构思过程中，","形象思维贯穿始终，但灵感思维和抽象思维也起很大的作用。","（2）对于艺术构思来讲，多种审美心理因素都在发挥着积极的作用。但是，在这些心","理因素中，想象和情感，具有特别重要的地位和作用。","“想象”，黑格尔十分重视想象在艺术创作中的作用，他甚至认为“真正的创造就是艺","术想象的活动”，因为“艺术不仅可以利用自然界丰富多彩的形形色色，而且还可以用创造","的想象自己去另外创造无穷无尽的形象” 。 黑格尔强调指出:“最杰出的艺术本领就是想象。 ”","别林斯基也认为，形象思维的中心环节就是艺术家的想象活动。车尔尼雪夫斯基也指出，艺","","","","","术创作中最主要的东西就是创造性的想象。高尔基更是从艺术思维和形象思维的高度来说明","想象在艺术创造中的作用，认为想象是一种高度自由的思想活动，正是想象使艺术家具有了","自由创造的思维能力。 他说:“想象在本质上也是对世界的思维， 但它主要用形象来思维， 是 ‘艺","术的’思维。”高尔基还结合艺术创作的实践，结合艺术创作的经验与体会来进一步阐明艺","术想象的重要性。","许多艺术家在自己的创作实践或艺术生涯中， 对于想象的重要性的认识有着亲身的体会。","吴道子依据玄宗所描述的梦境，依靠非凡的艺术想象力，很快画成了一幅《钟馗捉鬼图》。","由于吴道子超人的想象力，这幅画画得十分逼真生动。","想象在艺术构思活动中之所以具有这样重要的地位和作用，是因为想象具有在原来生活","的基础上创造新形象的能力。正是由于想象具有这种创造的能力，使它在艺术创作构思活动","中占有核心的地位。艺术家们可以凭借想象创造出源于生活并高于生活的艺术世界，创造出","艺术家未曾亲身经历过的事件和未曾亲身接触过的人物。","想象为艺术家们开拓了无限广阔的思维空间，使他们能够“精骛八极，心游万仞”地去","进行艺术构思。一般来讲，想象又分为再造想象和创造想象两种形式。再造想象是把自己记","忆中或别人描述过的形象在头脑中产生出来，如吴道子根据唐玄宗的描述，通过再造想象画","出了《钟馗捉鬼图》中的钟馗这一人物形象。创造想象则不局限于原有的感性形象，而是在","大量经验的基础上创造出崭新的形象，吴承恩就是通过卓越的创造性想象，在《西游记》中","创造了孙悟空、猪八戒等许多生动的艺术形象和精彩有趣的故事情节。虽然想象具有极大的","自由性， 但归根到底， 想象并不是凭空产生的， 它离不开艺术家原有的生活体验与生活积累，","从根本上讲客观现实是想象活动的源泉和内容。","情感也是一个十分重要的心理因素，贯穿于艺术创作的始终。如果说想象是艺术构思的","核心，那么情感就是艺术构思的动力。在艺术构思活动中，尽管有感知、理解、联想、想象","等多种心理因素，但它们都是在情感的渗透和影响下发挥作用的，只有在艺术家炽烈情感的","浇灌下，才能形成审美意象，完成艺术构思。","三  艺术传达活动","（1）艺术创作的最终成果是艺术作品。艺术家的艺术体验和艺术构思，必须通过各种","艺术媒介和艺术语言才能形成艺术作品。 因此， 艺术传达活动在艺术创作中占有重要的地位，","","","","","离开了艺术传达，再好的体验与构思也得不到表现，无法让其他人欣赏，只能仍然停留在艺","术家的头脑之中。","艺术传达活动作为创作过程的最后一个阶段，它是指艺术家借助一定的物质材料和艺术","媒介，运用艺术技巧和艺术手法，将自己在艺术构思活动中形成的审美意象物态化，成为可","供其他人欣赏的艺术作品和艺术形象。","（2）艺术传达活动作为一种艺术生产的实践活动，离不开一定的物质材料，如绘画需","要纸、笔、墨等，雕塑需要大理石、青铜等，才能使审美意象物态化，成为客观存在的艺术","品。艺术传达活动更离不开一定的艺术媒介或艺术语言，如绘画语言包括色彩、线条，音乐","语言包括节奏、旋律，电影语言包括画面、声音、蒙太奇，等等。","黑格尔十分重视艺术技巧在创作中的作用。他说 :“艺术创作还有一个重要的方面，即","艺术外表的工作，因为艺术作品有一个纯然是技巧的方面，很接近于手工业；这一方面在建","筑和雕刻中最为重要，在图画和音乐中次之，在诗歌中又次之。这种熟练的技巧不是从灵感","来的，它完全要靠思索、勤勉和练习。一个艺术家必须具有这种熟练技巧，才可以驾驭外在","的材料，不至于因为它们不听命而受到妨碍。”","艺术传达又不仅仅是一个技巧问题，艺术传达更需要艺术家调动自己的联想、想象、情","感等多种心理功能，融入创作主体的生命和心灵，寻找到独特的艺术传达方式。古代画论十","分强调“以意运笔”“意在笔先”“以心运手”等，都精辟地阐明了这条道理。古今中外优","秀的艺术家，都是在创作过程中经过艰苦地探索，为自己独创的审美意象找到新的形式、新","的手法和新的技巧，创造出新颖独特的艺术形象。","（3）艺术传达活动与艺术体验和艺术构思活动相互渗透、密不可分。事实上，艺术构","思中包含着传达，艺术传达更离不开构思。在艺术创作全部过程中，体验、构思和传达三者","始终有机地融合在一起，它们在创作中完全是统一的。各门艺术的艺术体验和构思，都离不","开特殊的传达方式。吴道子，他之所以被推崇为“画圣”，原因之一就是他继承和借鉴了传","统的绘画技法，并且有重大的突破和创新，把中国画运用线条的方法发挥到了更高境界，创","造出一种笔简意全、圆转多变、超凡脱俗的“疏体”。","所有艺术创作活动中，体验、构思与传达都是互相依存、彼此渗透的，艺术创作既有精","神活动性质，又有实践活动性质，既有内心的体验与构思，又有外部的传达和表现，通过这","么一种高级复杂的艺术创造活动，将艺术家的审美意识物态化为艺术作品和艺术形象。","","","","","第三节 艺术创作心理","一   形象思维与抽象思维、灵感思维","形象思维是人类能动地认识和反映世界的基本形式之一， 也是艺术创作的主要思维方式。","抽象思维是运用一定的概念来进行判断、推理和论证的一种思维形式。而形象思维则是运用","一定的形象来感知、把握和认识事物，也就是通过具体、感性的形象来达到对事物本质规律","认识的一种思维形式。","形象思维有许多特点，第一，形象思维的特点是自始至终离不开具体可感的形象，总是","运用形象来进行思维。第二，形象思维过程不依靠逻辑推理，而是始终依靠想象、情感等多","种心理功能。 想象和联想成为形象思维的主要活动方式， 情感对形象思维也具有特殊的作用。","第三，形象思维具有整体性的特点。更侧重于综合。","首先， 从形象思维的第一个特点来看， 艺术创作的全部过程始终离不开具体可感的形象，","艺术家在着手创造艺术形象之前，先经过一个体验或构思的过程，将要创造的形象，已经以","表象的形式在他的头脑中自发和自觉地活动起来。在心理学中，表象就是指人们记忆中所保","存的客观事物的形象，表象的最大特点就是形象性。艺术创作的整个过程中，想象、情感等","多种心理功能异常活跃，它们不断地改造着原有的表象并创造出新的表象，最终形成艺术形","象。","从形象思维的第二个特点来看， 艺术创作的全过程始终依赖想象、 情感等多种心理功能，","因而艺术创作的主要思维方式只能是形象思维。它离不开艺术家生动的想象和丰富的情感，","通过艺术家积极能动的创造活动，发掘出蕴藏在事物中的“美”。完全可以这么讲，在艺术","创作中，想象是核心，情感是动力，离开了想象和情感，就没有艺术。","从形象思维的第三个特点来看，艺术创作的全过程始终具有整体性的特点，这也是形象","思维的一个基本特点。为了保持一个艺术作品的整体性，作家可以忍痛割爱，删去某些或许","够得上精彩的情节和细节。","所谓抽象思维，就是指运用概念来进行判断、推理和论证的一种思维形式。抽象思维主","要应用于社会科学、自然科学等领域，侧重于理论研究与逻辑推理。在艺术创作与欣赏中形","象思维也常有抽象思维的伴随。在艺术构思与创造的过程中，诸如作品体裁的选择、主题的","提炼、结构的安排、人物性格的设计、表现手法的选择，等等，或多或少都离不开抽象思维","","","","","活动。","特别是由于近现代科学技术的极大发展，抽象思维日益渗透进艺术领域，扩大了艺术表","现的手法和天地。20 世纪上半叶出现的抽象主义画派大大发展了西方绘画中的抽象化倾向；","钱锺书先生所讲“理之在诗，如水中盐…无痕有味”。在艺术活动中，形象思维与抽象思维","也正是这样相互融合、彼此渗透、共同发挥作用的。","所谓灵感思维，是指在创造活动中，人的大脑皮层高度兴奋时的一种特殊的心理状态和","思维形式，它是在一定的抽象思维或形象思维的基础上，突如其来地产生出新概念或新意象","的顿悟式思维形式。在科学、艺术等创造性活动中，都客观存在着这种灵感思维。“创造思","维中的‘灵感’是一种不同于形象思维和抽象思维的思维形式。”","作为一种特殊的精神现象，灵感具有突发性、偶然性和稍纵即逝等特点，并不是神的恩","赐，而是创造性活动中一种特殊的心理状态或思维形式。灵感的出现与潜意识或无意识活动","有密切的关系，但也与自觉的显意识活动的长期积累紧密相关。在艺术创作中，任何灵感的","产生都离不开艺术家的冥思苦想、 长期寻觅、 艰辛探索， 犹如人们常讲的 “踏破铁鞋无觅处，","得来全不费工夫”，这种茅塞顿开、突然触发的灵感，好像是不期而遇、突然涌现的，实际","上已经有“踏破铁鞋”的艰苦寻觅过程作为基础和前提。","柴可夫斯基指出 :“灵感是这样一位客人，他不爱拜访懒惰者。”黑格尔更是用形象的","语言生动地阐述了这个道理 :“最大的天才尽管朝朝暮暮躺在青草地上，让微风吹来，眼望","着天空，温柔的灵感也始终不光顾他。”","二  意识与无意识","所谓无意识，或称潜意识和下意识，是相对于意识而言的。在普通心理学中，无意识指","人的不知不觉、没有意识的心理活动。在弗洛伊德的精神分析心理学中，无意识主要是指人","的原始冲动和各种本能、欲望，特别是性的欲望。","弗洛伊德把人的心理分为意识、前意识和无意识三个部分，认为无意识就是现实中得不","到满足的本能冲动和欲望，被意识所压抑着，只能在暗中活动。弗洛伊德把人的全部精神活","动比作大海中的一座冰山，意识如同浮在水面上的冰山的一小部分，无意识犹如藏在水下的","冰山的大部分，占有主要的地位。将人的心理结构分成了“本我”“自我”和“超我”这样","三个部分。最下面一层是“本我”，它是人的各种原始本能、冲动和欲望在无意识领域的总","","","","","和，其核心是生的本能和死的本能，在生的本能中主要是性本能；第二层叫“自我”，它同","“本我”相对立，因为本能冲动在人类的文明社会中是不能够肆无忌惮、为所欲为的，“自","我”犹如一个看门人，专门控制和压抑各种不合现实标准的本能冲动；最高一层是“超我”，","它是道德的、宗教的、审美的理想形态。一方面“超我”对“自我”起监督作用，另一方面，","“超我”又与“自我”一道，从道德理想的高度来管制“本我”的非理性冲动。以上这些，","构成了弗洛伊德的无意识理论本能理论和三重人格理论。","在普通心理学的意义上，无意识是相对于意识而言的。在艺术创作中，这种无意识与灵","感、直觉等有着密切的联系。无意识其实也是人的一种心理活动，它是人脑一种潜在的特殊","反映形式。","“现代心理学实验通过关于脑对于阀下的各种不同的潜意识（无意识）信息的电反应的","测定表明，脑中的潜意识活动是客观存在的。人们可以在潜意识水平上处理所见到的形象并","理解之。”","古今中外，常有科学家和艺术家在“梦”或“醉”的状态下获得灵感。杜甫在《饮中八","仙歌》诗中讲到，“李白斗酒诗百篇”“张旭三杯草圣传”；“梦”和“醉”的状态，都是","意识活动减弱或停止、无意识活动大大增强的时期，在这个特殊的时期里，原来长期积累的","素材和资料在违反常规的方式下相互碰撞，迸发出意想不到的灵感的火花。而这种灵感火花","在完全清醒的正常状态下却无法得到。不自觉的无意识思维活动，常常成为艺术创造灵感和","直觉的源泉。朱光潜先生认为“灵感就是在潜意识中酝酿成的情思涌现于意识”，“灵感是","潜意识中的工作在意识中的收获”。","从总体上看，艺术创作无疑是艺术家有目的、有意识的创作活动，意识在艺术创作中起","着主要和支配的作用。然而，在艺术创作中又确实存在着一些无意识或下意识的活动，这种","无意识或下意识常常成为激发顿悟、 灵感的契机， 也常常成为表演艺术二度创作的最佳瞬间。","事实上，无意识或下意识并不神秘，它也是人的一种正常心理活动。意识与无意识之间构成","了一种辩证的关系。现代心理学、生理学的研究结果表明，在正常条件下，人的活动都是有","意识的活动，但对于一些比较复杂的活动来讲，又常常包含着某些无意识的活动。为什么有","时在“梦”和“醉”的情况下，艺术家能突然获得创作灵感呢？这是因为在这种情况下，艺","术家的大脑皮层暂时从紧张的创作状态中得到放松，在无意识或下意识的状态下，突破了常","规思维的局限和束缚，在无意识向显意识的转化过程中，以异于平时的方式冲破了原来的框","","","","","架， 获得了创造性的飞跃， 顿悟或灵感不期而至。 事实上， 这种灵感并不是从天上掉下来的，","也不是神的赐予，而是艺术家长期艰苦的艺术构思过程的瞬间爆发。显然，在无意识中渗透","着意识，在感性中交织着理性，在灵感中凝聚着艺术家孜孜不倦的追求和长期的潜心苦思。","第四节  艺术风格、艺术流派、艺术思潮","中外艺术史上凡是杰出的艺术家都有自己鲜明独特的风格。这种风格体现在艺术家的全","部创作之中，体现在他的作品的内容与形式等各方面。","中外艺术史上的某一个历史时期里，一批思想倾向、艺术倾向和创作风格相近或相似的","艺术家们，又会形成一定的艺术流派。如美术中的巡回展览画派、印象主义画派、野兽主义","画派等。","除了艺术风格与艺术流派外，在中外艺术史上一定的历史阶段，以几个或多个艺术流派","为核心，涉及多个艺术门类，在当时的社会思潮和哲学思潮的影响下，会形成具有相似或相","近的艺术思想与创作倾向的艺术潮流。在多数情况下，艺术流派往往是指某一个艺术门类中","的派别，而艺术思潮则往往包括多个艺术门类中的许多艺术流派。最明显的例子就是西方现","代主义艺术思潮，涵盖了文学、戏剧、美术、音乐、舞蹈、建筑、电影等在内的多个艺术门","类，并且具有为数众多、名称各异的艺术流派。","艺术风格促进和推动了一定艺术流派的形成，艺术流派又反过来扩大和发展了这种艺术","风格的影响。二者相互促进，相互推动，共同促成了艺术创作的繁荣发展。艺术思潮则是一","定历史时期的社会思潮和哲学思潮引起的文艺领域的变革，所形成的具有相近创作倾向的群","体性艺术潮流。","一  艺术风格","艺术风格就是指艺术家的创作在总体上表现出来的独特的创作个性与鲜明的艺术特色。","它既与艺术家主观方面的特点有关，也与题材的客观方面的特点分不开，它涉及艺术作品内","容与形式的各个层面，从艺术作品的整体上呈现出来。在艺术家个人的艺术风格中，已经不","可避免地打上了民族、时代、地域、群体的烙印。","","","","","1. 艺术风格多样性的形成","艺术风格最鲜明的一个特点，就是它的多样性。艺术风格多样性的形成，有着多方面的","原因，主要来自以下几个方面：","第一，艺术风格的多样性，首先来自艺术家独特的创作个性。艺术家作为艺术生产的创","作主体，他的性格、气质、禀赋、才能、心理等各方面的种种特点，都很自然地会投射和熔","铸到他所创作的艺术作品之中，即通过创造性劳动使主体对象化到精神产品之中。艺术风格","体现出艺术家的精神特性。","第二，艺术风格的形成更离不开艺术家独特的人生道路、生活环境、阅历修养和艺术追","求。始终具有自己独特的审美体验、构思方式和表现角度，从而形成自己的艺术风格。从根","本上讲，艺术家的创作个性又不能不受到他所在的社会环境的制约。由于艺术家总是处在一","定的时代、民族、文化、地域之中，使得艺术家的创作总是在个体性中体现出社会性，在主","观性中体现出客观性。 因此我们说， 艺术风格是艺术家在创作中表现出来的独特的创作个性，","它来源于艺术家主观方面的独特性，同时又凝聚着文化特色、时代精神、民族特性等多方面","的客观社会因素。","第三，艺术风格的多样性，还来自审美需求的多样化。由于欣赏主体存在着不同的社会","层次、文化层次、年龄层次，属于不同的民族、不同的地区，造成审美需要的千差万别，反","过来刺激和推动着不同艺术风格的形成。","2. 艺术风格的民族特色和时代特色","艺术风格的另一个重要特征，就是它常常具有鲜明的民族特色和时代特色。每个民族的","艺术总是具有某些共同的特征，形成艺术的民族风格；每个时代的艺术也常常具有某些相似","之处，形成艺术的时代风格。民族风格或时代风格，体现出艺术风格的一致性，它与艺术风","格的多样性一道，共同形成了辩证统一的关系，使艺术风格既有多样性，又有一致性。艺术","风格的多样性与一致性，往往互相联系、互相渗透。","艺术风格的民族特色，是由本民族的地理环境、社会状况、文化传统、风俗习惯等多种","因素决定的，体现出本民族的审美理想和审美需要，但归根结底还是根源于本民族的社会生","活与经济基础。丹纳在《艺术哲学》一书中认为，种族、环境、时代这三个原则决定着艺术","的发展，文艺复兴时期意大利画家的作品，都在不同程度上体现出当时地中海沿岸繁华富裕","","","","","的世俗气氛与色彩绚丽的自然风光，以及艺术家对生活、对自然的热爱。艺术家用宗教的题","材来表现世俗的生活；德国画家的作品，丢勒的《四使徒》都蕴涵着深刻的哲理，就像丹纳","所说，“在德国，纯粹观念的力量太强，没有给眼睛享受的余地”，“不是画的肉体，而是","画的神秘的、虔诚的、温柔的心灵”，在作品中流露出“深刻的宗教情绪”。","民族风格的形成，离不开各个民族独特的文化心理结构，它以一种“集体无意识”（荣","格语）的方式积淀下来，并且世代承传、延续下去。“所谓的艺术的民族性，或民族艺术，","并不仅仅是来自种族因素，种族因素只是它的一个前提条件，当它与其他社会条件结合或相","互作用时，才形成了一种独特的民族文化心理结构，产生出具有独特特色的艺术”。园林艺","术，中国传统园林与阿拉伯式园林迥然不同；同样是皇宫，北京的故宫同法国爱丽舍宫也有","区别。从总体上讲艺术的民族风格就是要体现出民族的精神、性格和气质，体现出民族的文","化、风俗和习惯，体现出民族的审美理想和美学传统。","艺术风格的时代特色，是指同一时代的艺术作品常常具有某些共同的特征，体现出这个","时代占主导地位的审美理想和审美追求。 中国古代的青铜器商周时代， 奴隶社会的鼎盛时期，","青铜艺术也随之达到了极盛的阶段，尤其是商代晚期和西周早期的青铜器，一般体积庞大厚","重，尤其流行一种“饕餮”兽面纹。春秋战国时期，青铜器已经不再为王室所垄断和专用，","相当一部分青铜器转为日常生活器皿，器壁变薄，器物变轻，特别讲究器用、造型、纹饰的","统一，并且出现了狩猎、采桑、宴乐、攻占等生活气息浓郁的纹饰图案。","二  艺术流派","（1）艺术风格体现出艺术家的创作个性，艺术流派则体现出风格相似或相近的艺术家","们的共性。","所谓艺术流派，是指在中外艺术发展的一定历史时期里，由一批思想倾向、美学主张、","创作方法和表现风格方面相似或相近的艺术家所形成的艺术派别。这些艺术派别的形成有时","是自觉的，有一定的组织形式或共同宣言；有时是不自觉的，仅仅因为创作风格类型的相近","而组合在一起。这些艺术派别有的局限于一种艺术门类或体裁，有的则包括不同艺术门类或","体裁的艺术家。","（2）艺术流派三种类型：","<1> 一种是由一批具有相同艺术主张的艺术家们，自觉结合而形成的艺术流派。他们或","","","","","者有一定的组织和名称，或者有共同的艺术宣言，甚至与其他艺术流派展开论争，以宣传自","己的艺术主张。例如，20 世纪西方现代主义文艺流派之一的达达主义。","<2> 另一种是由一批艺术风格相近或相似的艺术家们，不自觉而形成的艺术流派。这些","艺术派别一般没有固定的组织或纲领，也没有共同的艺术宣言。有的是由于某一地区集中了","一批艺术风格相近似的艺术家， 自然而然地形成了某一艺术流派。 例如， 美术上的威尼斯画派。","<3> 再一种是艺术家们本身并没有形成流派的计划或意愿，甚至自己并没意识到属于某","一流派，只是由于艺术风格的相似或相近，被后世人们在艺术鉴赏或艺术批评中，将其归纳","为特定的流派。","除了以上三种类型外，艺术流派的形成还存在着其他一些情况。艺术流派的出现常常与","一定的社会历史条件相联系。例如，19 世纪 60 年代俄国的“巡回展览画派”。","三  艺术思潮","（1）所谓艺术思潮，是指在一定社会历史条件下，特别是在一定的社会思潮和哲学思","潮的影响下，艺术领域所发生的具有广泛影响的思想潮流和创作倾向。","（2）艺术思潮与艺术风格、艺术流派之间有着密切的关系，但又存在着明显的区别。","一般来讲，艺术风格是创作主体独特个性的表现，艺术流派则是风格相近或相似的创作","主体的群体化，而艺术思潮却是倡导某种文艺思想的几个或多个艺术流派所形成的一种艺术","潮流。简言之，艺术风格、艺术流派和艺术思潮，分别针对个体、群体，以及在一定历史时","期内具有相当规模的较大群体而言。某种艺术流派可能发展成为一种艺术思潮，而某个艺术","思潮却可能包容许多艺术流派和不同的创作方法。艺术流派往往是指某一个艺术门类中的派","别，艺术思潮却常常包容各个艺术门类中的多个艺术流派。艺术思潮侧重于从社会历史的角","度来把握某种创作思想或创作主张，艺术流派侧重于从艺术史的角度来区分各种具有不同特","点的艺术派别。所以，它们之间既有联系，又有差别。","（3） 西方现代主义艺术思潮是于19 世纪末、20 世纪初从欧美各国兴起的一股文艺思潮。","西方现代主义的萌芽始于 19 世纪中叶象征主义的出现，标志是法国象征主义诗人波德","莱尔的诗集《恶之花》的问世。而现代主义艺术思潮的正式形成，却是在 20 世纪初叶，以","德国为中心的表现主义，以法国为中心的超现实主义，以意大利为中心的未来主义，以英国","为中心的意识流文学等。","","","","","20 世纪后半叶， “后现代主义” （postmodernism）在西方兴起，其影响迅速遍及全球。","作为同后工业社会相适应的一种文化思潮，是随着现代主义的衰落而逐渐崛起的，它是对现","代主义的一种批判与超越。","杰姆逊认为，西方资本主义经历了三个阶段，与此相应出现了三种文化范式。杰姆逊讲","道 :“我认为资本主义已经历了三个阶段：第一是国家资本主义阶段。第二阶段是列宁的垄","断资本或帝国主义阶段。第三阶段则是二次大战后的资本主义。第三阶段的主要特征可以概","述为晚期资本主义，或多国化的资本主义。这一阶段在 60 年代有其几种体现，这是一个崭","新的、与前面各阶段根本不同的新时代。”第一阶段文化上以现实主义为典型特征；第二阶","段文化上以现代主义为典型特征；第三阶段文化上以后现代主义为典型特征。后现代主义是","后工业社会的产物，也是后期资本主义或者媒介资本主义的文化特征。","后现代主义是和商品化紧紧联系在一起的，后现代文化批判超越了现代主义，进一步向","着两个极端发展 ,：一极朝着更为激进的方向迈进，以先锋艺术的精神体现出对传统文艺和","现代经典的彻底反叛 ； 另一极则面对整个被商品化了的社会， 朝着大众文化和通俗文化迈进，","追求大众性、平面性、游戏性、娱乐性。它将大众的世俗文化与知识分子的哲学文化融合起","来，将消费性文化与消解性文化融合起来将商业动机和哲学动机融合起来。后现代主义往往","采用荒诞、调侃、反讽、拼贴、嘲弄、游戏等多种手法，来突破传统文艺乃至现代主义文艺","的审美范畴，追求一种全新的表现方法。","（4）现代主义文化与后现代主义文化有以下几点区别：","第一， 从哲学基础看， 现代主义的思想根源主要是康德的批判理论、 叔本华的唯意志论、","弗洛伊德的精神分析学，后现代主义的思想根源则主要来自存在主义、非理性主义、德里达","的解构主义。现代主义更倾向于尼采哲学的“日神精神”，后现代主义更倾向于尼采哲学的","“酒神精神”，具有更加彻底的悲剧色彩。","第二，在人的主体性这个问题上，现代主义文艺具有鲜明的自我中心特色，强调弘扬个","性与表现自我；与此相反，后现代主义却突出自我怀疑，强调主体丧失，反对一切中心。如","果说现代主义的反叛表现在“上帝死了，只有人的主体存在”，那么后现代主义的反叛则更","加彻底，表现在“主体也已经死亡，人再也没有主体性可言”。","第三，如果说现代主义致力于建构，崇尚结构主义，那么后现代主义则更多地致力于解","构，崇尚解构主义。现代主义认为世界还是一个整体，当初的反叛只不过是以他们自己的新","","","","","秩序来取代陈旧的秩序。 但是， 后现代主义却力图打破整体性观念， 以解构主义为理论基础，","以零散化、边缘化、多元化、不确定性来取代整体性。后现代主义首先消解艺术与非艺术的","区别，其次消解各种艺术门类之间的区别，最后更是消解了精英文化与大众文化、高雅文化","与通俗文化的界限。事实上，后现代主义真正推崇的是大众文化在这个消费主义盛行的商品","社会里，在大众传播媒介的推波助澜下，后现代主义使大众文化更趋向于娱乐化和游戏化。","第四，现代主义文艺作品大多晦涩难懂，富有哲理性，需要欣赏者具有相当高的文化水","平和艺术修养，才能读懂或看懂，并且理解作品的深层内涵和哲理意蕴，后现代主义追求的","却是一种平面感， 反对文艺向深度开掘， 主张无深度的平面文化， 追求感官刺激和文化游戏，","使得文化进一步向世俗文化、娱乐文化、消费文化和商品文化发展。","第五，后现代主义为了适应商品社会的需求，通过工业化大批量生产和大众传播媒介，","突出“复制”的作用。","后现代主义取笑一切严肃，调侃一切神圣，嘲弄一切规则，抛弃一切深度。后现代主义","的这种怀疑论、否定论和颓废论具有极大的消极影响与负面作用。但是，与此同时，我们也","应当看到，后现代主义作为现代主义的继承人，攻击性最强，破坏力最大，终于摧毁了在西","方文艺界雄霸近百年之久的西方现代主义。后现代主义的出现，有着深刻的社会根源和时代","根源。","","","","","第十一章  艺术作品","第一节  艺术作品的层次","（1） 艺术作品是指艺术生产的成果或产品， 它是艺术家运用一定的物质媒介和艺术语言，","通过艺术构思和艺术创作，将头脑中形成的主客体统一的审美意象物态化，创造出来的审美","鉴赏的对象。","（2）在整个艺术生产活动中，艺术作品处于中心的地位与中心的环节。一方面，它是","艺术家创造性劳动的产物，是艺术生产的产品，另一方面，它又是欣赏者完成艺术鉴赏的基","础和起点，是艺术鉴赏的对象。","从艺术作品的构成来看，它既是内容与形式的统一，又是感性与理性的统一，还是再现","与表现的统一。从艺术作品的结构来看，任何艺术作品都既是一个有机的整体，又可以划分","为不同的层次。","（3）艺术作品由三个层次组合而成的。","第一层是艺术语言，它是作品外在的形式结构，是由文字、声音、线条、色彩、画面等","所构成的层次。","第二层是艺术形象，是作品内在的结构，是艺术家的审美意象的物态化，不同的艺术作","品可以分别具有视觉形象、听觉形象、综合形象、文学形象等。","第三层是艺术意蕴，优秀的艺术作品往往具有广泛的普遍性和深刻的思想性，具有象征","和寓意、哲理或诗情，这种深藏在艺术作品中的意蕴，常常需要鉴赏者仔细品味才能领会。","我们在欣赏一件艺术作品时，经常是既欣赏它完美的艺术语言，又欣赏它动人的艺术形象，","还欣赏它深刻的艺术意蕴。","一  艺术语言","（1）所谓艺术语言，是指任何一门艺术都有自己独特的表现方式和手段，运用独特的","","","","","物质媒介来进行艺术创作，从而使得这门艺术具有自己独具的美学特性和艺术特征。这种独","特的表现方式或表现手段，就叫作艺术语言。","（2）各门艺术都有自己独特的艺术语言，例如，绘画语言包括线条、色彩、构图等，","音乐语言包括旋律、和声、节奏等，电影语言包括画面、声音、蒙太奇等。这些艺术语言，","不但是创造艺术形象的表现手段，并且本身就具有审美价值。艺术作品首先诉诸欣赏者感官","的就是线条、色彩、构图、画面、文字等艺术语言，它们是人们感受艺术美的直接对象，从","这个意义上来讲，艺术语言本身也具有独立的审美意义。","艺术语言更重要的作用还是创造艺术形象。艺术创作无非就是艺术家把自己头脑中主客","观统一所形成的审美意象，通过一定的物质媒介和艺术手段物态化为艺术形象，成为可供欣","赏的艺术作品。这里所讲的“艺术手段”就是指艺术语言。正是艺术语言，使艺术家头脑中","的审美意象物态化为艺术形象。艺术语言的运用，对创造艺术形象起着直接的作用。","中国画十分重视笔墨的作用，中国画丰富的用墨技巧使得墨色似乎能替代一切颜色，用","墨可以绘制山川草木、花鸟人物、梅兰竹菊、世间万物。“墨分五彩”，就是讲墨具有焦、","浓、重、淡、清五种不同的色度，例如齐白石的《墨虾图》，主要运用淡墨，层次多变，富","有透明感，生动地表现出虾在水中浮游的动势，以及虾外硬内柔、透明如玉的身躯。这幅画","之所以能达到这样高的艺术水平，除了齐白石长期观察虾的生活习性以外，也与他对国画艺","术语言的熟练运用分不开，尤其是他仔细钻研过笔墨纸张如何才能适应画虾的要求，甚至专","门试验过利用不同含水量的笔墨在宣纸上渗化的特殊效果来表现虾体的透明感，因而，齐白","石所画的虾享誉中外，具有独特的艺术魅力。","（3）由于艺术语言不但可以创造艺术形象，而且自身也具有审美价值，所以，各门艺","术的艺术家们都致力于艺术语言的创新与探索。从这种意义上讲，艺术的创新也必然包括艺","术语言的创新。","除了艺术家们的不断探索与创新外，艺术语言的发展同科技进步也有密切的关系。 19","世纪末叶以来， 科学技术的迅猛发展对艺术产生了广泛而巨大的影响， 不但直接促成了电影、","电视等新兴艺术门类的诞生，而且不断丰富、完善和发展了艺术语言。例如，电影从无声到","有声、从黑白到彩色，以及大量采用计算机多媒体技术进行创作与制作，乃至目前正在迅速","发展的数字技术电影等等。","结构主义语言学之父——瑞士著名语言学家索绪尔，他的《普通语言学教程》 （1916），","","","","","提出了语言的结构主义模式。索绪尔提出应当将“语言”和“言语”区分开来，语言是社会","性的符号系统，而言语则是个人的表达方式。他用象棋规则和象棋游戏来比喻语言系统和言","语行为之间的关系。索绪尔进一步提出要将“能指”与“所指”区分开来，能指是符号的表","示成分，而所指则是符号的被表示成分。符号的意义产生于能指与所指的结合。","（4） 任何艺术作品的形成， 任何艺术形象的创造， 都离不开一定的物质传达手段客观化、","对象化的过程。人们在欣赏艺术作品时，首先接触到的就是线条、色彩、声音、画面等这样","一些人的感官能够直接感知的艺术作品的外部特征。当然，艺术语言或艺术符号的主要作用","不是创造艺术形象，在物质的、感性的外壳中蕴藏着意识的、精神的内涵。艺术语言或艺术","符号还是人类艺术思维的工具， 因而各门艺术都有自己独特的艺术语言体系或艺术符号体系，","画家用线条、色彩来构思创作。","二  艺术形象","（1）艺术形象是文艺反映生活的特殊方式。艺术形象总是具体可感的，是客观因素与","主观因素的统一，是内容与形式的统一，也是个性与共性的统一。","（2）艺术语言和表现手法的主要作用，是将艺术家头脑中主客观统一的审美意象物态","化为艺术作品中的艺术形象。可见，艺术形象构成了艺术作品的第二个层次。","（3）从艺术作品的角度来看，艺术形象可以分为视觉形象、听觉形象、文学形象和综","合形象。它们既有共性，又有各自的特性。","<1> 视觉形象，是指由人的眼睛直接感受到的艺术形象，视觉形象的构成材料都是空间","性的。例如，一幅绘画，一件雕塑，一幅书法作品。艺术中的视觉形象直接作用于欣赏者的","视觉感官，因而特别富有直观性和生动性。这类艺术形象常常带有明显的再现性，同样凝聚","着艺术家的思想感情，具有创造性。","<2> 听觉形象，是指由人的耳朵直接感受到的艺术形象，听觉形象的构成材料是时间性","的。艺术中的听觉形象主要是指音乐作品的形象。听觉形象具有空灵性和抽象性的特点。","<3> 文学形象，是指诗歌、散文、小说、报告文学等，依靠语言作为媒介来塑造的形象。","文学形象最鲜明的特征是间接性。要通过语言的引导，凭借想象来把握。","作为语言艺术，文学作品不仅可以描绘视觉形象、听觉形象，而且可以描绘人的嗅觉、","触觉、味觉等各种感觉；不仅可以描绘静态形象，而且可以描绘动态形象；不仅可以从外部","","","","","描写人的肖像、动作和语言，而且也可以从内部去描写人的内心世界和心理活动。文学形象","最少受到时间和空间的限制，具有最大的自由，可以多方面地展示广阔而复杂的社会生活。","<4> 综合形象，是指话剧、戏曲、电影、电视等综合艺术中的艺术形象，既有视觉形象、","听觉形象， 还有文学形象。 它们综合成为一个有机的整体。 综合形象有一个与众不同的特点，","就是它往往是通过演员在舞台银幕或荧屏上同观众见面来完成，它常常是集体创作的结晶。","（4）作为艺术反映生活的基本形式，艺术形象是艺术作品的核心。在艺术作品中，艺","术语言是为了塑造艺术形象，而艺术意蕴也是蕴藏在艺术形象之中。艺术形象不仅具有具体","可感的形象性，而且具有概括性，它把广泛的生活内容概括在形象之中。艺术形象又具有情","感性和思想性。","三  艺术意蕴","对于优秀的艺术作品来讲，还应当具有第三个层次，即艺术意蕴。","（1）所谓艺术意蕴，是指深藏在艺术作品中的内在的含义或意味，常常具有多义性、","模糊性和朦胧性，体现为一种哲理、诗情或神韵，经常是只可意会，不可言传，需要欣赏者","反复领会、细心感悟，用全部心灵去探究和领悟，它也是文艺作品具有不朽的艺术魅力的根","本原因。","（2）黑格尔曾经讲过 :“意蕴总是比直接显现的形象更为深远的一种东西。艺术作品应","该具有意蕴。”“遇到一件艺术作品，我们首先见到的是它直接呈现给我们的东西，然后再","追究它的意蕴或内容。前一个因素——即外在的因素——对于我们之所以有价值，并非由于","它所直接呈现的；我们假定它里面还有一种内在的东西，即一种意蕴，一种灌注生气于外在","形状的意蕴。”","黑格尔举了一个例子来说明，他认为，就像一个人的眼睛、面孔、皮肤、肌肉，乃至于","整个形状，都显现出这个人的灵魂和心胸一样，艺术作品也是要通过线条、色彩、音响、文","字和其他媒介，通过整体的艺术形象，来“显现出一种内在的生气，情感，灵魂，风骨和精","神，这就是我们所说的艺术作品的意蕴”。显然，黑格尔认为意蕴就是艺术作品的灵魂，它","必须通过整个艺术作品才能体现出来。","法国现象学美学的代表人物杜夫海纳，在分析艺术作品的基本结构时，认为艺术作品分","为感性、主题和表现三层。杜夫海纳认为艺术作品的第一层是感性，它包括物质质料（如雕","","","","","塑用石头，绘画用画布）和艺术质料（如雕塑的形状，绘画的线条、色彩），其实就是指艺","术作品的物质媒介和艺术语言。 第二层是主题， 就是由物质质料和艺术质料构成了再现形象。","第三层是表现，使得艺术作品的意义具有多重性，不可穷尽性，它是作品结构的最高层，也","是艺术作品最本质的东西。","克莱夫·贝尔在《艺术》（ 1914）一书中，提出了“艺术乃是有意味的形式”的论点。","贝尔认为 :“艺术品中必定存在着某种特性：离开它，艺术品就不能作为艺术品而存在；有","了它，任何作品至少不会一点价值也没有。这是一种什么性质呢？……可做解释的回答只有","一个，那就是‘有意味的形式’。”贝尔强调，这种“形式”是指艺术品内的各个部分和质","素构成的关系，这种“意味”则是一种极为特殊、难以言传的审美感情。","东晋顾恺之绘画思想的核心就是“以形写神”；南齐书法家王憎虔也提出“书之妙道，","神采为上，形质次之”；唐代书法家张怀瓘把书法艺术分为神、妙、能三品，认为“风骨神","气者居上” ； 唐代诗论家司空图提出诗歌应当具有 “象外之象” “景外之景” “韵外之致” “味","外之旨”；宋代严羽的“妙悟说”；清代王士禛的“神韵说”；司空图“韵外之致”“味外","之旨”。","（3）第一，艺术意蕴从一定意义上来讲，就是艺术作品蕴藏的文化含义和人文精神。","第二，艺术意蕴就是指艺术作品应当在有限中体现出无限，在偶然中蕴藏着必然，在个","别中包含着普遍。","第三，艺术作品中的这种深层意蕴，有时由于具有多义性和模糊性，不但欣赏者意见纷","纷、各说不一，甚至有时连艺术家自己也说不明白。","第四，艺术作品中的这种意蕴，并不完全是由艺术形象体现出来的主题思想。艺术意蕴","是一种更加形而上的东西。它是一种哲理或诗情，常常是只可意会，不可言传；只有通过对","整个作品的领悟和体味才能把握内在的意蕴。","在一定意义上讲，具有艺术意蕴的作品，常常达到了“终极关怀”的高度，因为人类的","情感是共同的，家庭、亲情、友谊、爱情等是属于全人类共通的情感；生命、死亡、存在、","毁灭、宇宙、时空等这些终极关怀的问题也是全人类共同思考的问题；真、善、美更是全人","类共同珍惜的价值。","第五，在艺术作品的层次构成中，任何一个作品都必须具有前两个层次，即艺术语言和","艺术形象。作为第三个层次的艺术意蕴，则并不是每一个艺术作品都必须具有的，某些偏重","","","","","于娱乐性、功利性或纪实性的作品，常常就不存在这一层次。","第二节  典型和意境","典型重再现，意境重表现；典型重写实，意境重抒情；典型重描绘鲜明的人物形象，意","境重抒发艺术家的内心世界。","一 典型","（1）典型，又称典型人物、典型性格或典型形象，  是指艺术作品中塑造得成功的人物","形象。广义的解释，认为典型应当包括典型人物、典型事件、典型环境等。典型的核心是塑","造鲜明生动的人物形象。","黑格尔认为 :“在荷马的作品里，第一英雄都是许多性格特征的充满生气的总和。” “每","个人都是一个整体，本身就是一个世界，每个人都是一个完满的有生气的人，而不是某种孤","立的性格特征的寓言式的抽象品”。","别林斯基指出 :“创作本身的显著标志之一，就是这典型性——如果可以这样说的话，","这就是作者的文章印记。在一位真正有才能的人写来，每一个人物都是典型，每一个典型对","于读者都是似曾相识的不相识者。”","真正阐明典型问题的，是马克思、恩格斯关于典型的论述。恩格斯认为，优秀的艺术作","品中，典型人物形象应当是个别性与普遍性的高度有机的统一体，“每个人都是典型，但同","时又是一定的单个人，正如老黑格尔所说的，是一个‘这个’。为了真正地塑造好典型，就","需要“真实地再现典型环境中的典型人物”。","《水浒传》中勇猛鲁莽、见义勇为的鲁智深，秉性刚烈、性格倔强的武松，脾气暴躁、","心地善良的李逵 ； 《三国演义》 中足智多谋、 料事如神的诸葛亮， 狡猾奸诈、 欺世盗名的曹操，","粗豪威猛、急躁暴烈的张飞。正是这些有血有肉、个性鲜明的人物形象，使得这些优秀作品","长期受到人们的喜爱，广为流传，影响深远，具有巨大的艺术感染力和永久的艺术生命力。","（2）艺术典型是普遍性与特殊性的有机统一，又是必然性与偶然性的有机统一。任何","艺术典型，都是在鲜明生动的个性中体现出广泛普遍的共性，在独一无二的个别形象中体现","出具有普遍性的某些规律。艺术典型的个性，是指作品中人物形象非常独特，不仅有独特的","","","","","外表、独特的行为、独特的生活习惯，而且有独特的性格、独特的感情、独特的内心世界，","也就是这个人物形象应当是独一无二，不可重复的。","艺术典型不仅在个性中体现出共性，在特殊性中体现出普遍性，而且也在现象中体现出","本质，在偶然中体现出必然来。这就是说，在具有个性的典型人物形象的塑造中，应当体现","出具有一定社会内容和社会意义的必然规律。典型人物作为个人来讲，他的遭遇、经历、命","运、性格、行为等可能具有偶然性，具有不可重复性，但是，在他的这种偶然性中，又常常","体现出特定的社会生活与历史发展的必然性。","（3）艺术作品要想塑造出具有典型意义的人物形象，首先需要艺术家从生活真实与艺","术真实出发，对客观现实生活加以艺术概括，在大量的生活素材中发掘出典型人物的原型，","再经过艺术加工和艺术虚构，创作出具有较高典型性的艺术形象来。","二  意境","（1） 意境， 是中国古典美学传统的一个重要范畴。 中国古典诗、 画、 文、 赋、 书法、 音乐、","建筑、戏曲都十分重视意境。意境就是艺术中一种情景交融的境界，是艺术中主客观因素的","有机统一。意境中既有来自艺术家主观的“情”，又有来自客观现实升华的“境”，“情”","和“境”是有机地融合在一起的，境中有情，情中有境。意境是主观情感与客观景物相熔铸","的产物，它是情与景、意与境的统一。","（2）意境，是中华民族在长期艺术实践中形成的一种审美理想境界。作为美学范畴的","意境，孕育于先秦至魏晋南北朝时期，诞生于唐代。中国禅宗对于意境范畴的形成产生了直","接的重大影响，然而意境范畴的思想源头却可以追溯到先秦的老庄哲学与魏晋玄学。唐代诗","人王昌龄所作的《诗格》中，就把诗分为三境：物境、情境、意境。王国维认为境界应当包","括情感与景物两方面，他所说的境界，其实质就是意境。","（3）艺术意境与艺术典型二者之间既有区别，又有联系。意境重表现、重抒情，以创","造景物意象为主；典型则是重再现、重写实，以塑造人物形象为主。然而，意境在景物中也","有人物，意境的产生本身就是情景交融的结果，它一方面以自然景物的意象描述为主，另一","方面也必然熔铸进艺术家的思想情感和美学情趣。简言之，如果说典型是在主客体统一中侧","重于客体，那么意境却是在主客体统一中侧重于主体；前者侧重于塑造人物形象，后者侧重","于抒发艺术家自己的情感。二者至少在有一点上是共同的或一致的，即它们都是在有限的艺","","","","","术形象中，体现出无限的艺术意蕴。艺术典型是在个别的人物形象身上体现出共性、普遍性","和本质必然性，艺术意境则是在情景交融的境界中让人们领悟出无穷的“象外之象，景外之","景”，从有限中把握无限，正是艺术的极致境界。因此，典型和意境才在艺术作品中占有如","此重要的地位。","（4）意境至少还具有以下三个方面的特点：","第一，意境是一种若有若无的朦胧美。虚与实可以说是中国传统美学对构成审美对象的","两大要素的区分，心与物、情与景、意与象、神与形，等等，大体上讲，前者为虚，后者为","实。“由此可以看出，意境的实的部分存在于画面、文字、乐曲及想象的意象之中；而虚的","部分， 即意境之重要或本质的部分存在于想象和感悟之中。 中国传统艺术的最高范畴 ‘意境’","即是人通过艺术对世界本体的体悟。而世界本体在中国传统思想中是非虚非实、即虚即实的","存在，只有这样去理解把握意境这一范畴，我们才能将中国哲学与中国艺术作一以贯之的理","解，才能对中国古代艺术两千年的追求作贯通的把握。”","中国传统艺术十分讲究虚实结合。清代画论家笪重光在《画筌》中所说 :“虚实相生，","无画处皆成妙境。”中国书法也同样讲究布白，强调“计白当黑”，甚至把书法中字的结构","称为“布白”。","第二，意境是一种由有限到无限的超越美。追求一种“韵外之致”或“味外之旨”。魏","晋时期王弼就提出了“得象忘言，得意忘象”。唐代司空图《二十四诗品 ·雄浑》篇中更是","提出了“超以象外，得其环中”。","中国古典诗文追求言外之意， 中国古典音乐追求弦外之音， 中国古典绘画追求画外之情，","都是要通过有限的艺术形象达到无的艺术意境。西晋文学家陆机在《文赋》中所讲 :“观古","今于须臾，无四海于一瞬” “笼天地于形内，挫万物于笔端”。苏轼曾经评价王维的诗和画，","“味摩诘之诗，诗中有画；观摩诘之画，画中有诗。”“诗中有画”，就是指诗中应有画的","意境， 诗歌最宝贵的并不在文字之内， 而在文字之外， 就是那种只可意会、 不可言传的意境；","“画中有诗”，就是讲绘画也要有诗的韵味，使诗情和画面融会在一起，通过绘画形象所表","达的，不仅是视觉看得到的景色人物，等等，而且还有视觉无法看到，却可以感受到、领悟","到的东西，也就是从有限的绘画中体悟到无限的意蕴。","第三，意境是一种不设不施的自然美。中国美学史上，历来有两种不同的美的理想，一","种是“错彩镂金，雕缋满眼”的美，另一种是“初发芙蓉，自然可爱”的美。这两种不同的","","","","","审美理想，代表着各自不同的艺术风格和审美追求，都创造出了富有特色的艺术作品。","宗白华先生指出 :“魏晋六朝是一个转变的关键，划分了两个阶段。从这个时候起，中","国人的美感走到了一个新的方面，表现出一种新的美的理想。那就是认为‘初发芙蓉’比之","于‘错彩镂金’是一种更高的美的境界…这是美学思想上的一个大的解放。诗、书、画开始","成为活泼泼的生活的表现， 独立的自我表现。 ” 这样一个境界， 被称为 “天趣” “天然” “天","真”，以自然的“天”的品格来表示，而“天”的对立面则是“人工”，是“巧”。","（5）中国的文学艺术，均重视创造意境，将意境创造作为艺术追求的极致，充分体现","出中国艺术重表现、重抒情、重写意的美学传统。在意境中起主导作用的仍是情、意。因为","艺术意境并不是生活境界的自然主义复制，艺术中的“境”已经不是生活中的自然风景，而","是经过艺术家提炼取舍，熔铸了艺术家思想情感，经过艺术构思和艺术创作而形成的意境。","王夫之曾说 :“情景名为二， 而实不可离。 神于诗者， 妙合无垠。 巧者则有情中景， 景中情。 ”","他还讲道 :“景中生情，情中含景，故曰，景者情之景，情者景之情也。”显然，意境中的","情是“景中情”，意境中的景是“情中景”，在客观意象中体现出主观情感，在艺术形象中","蕴涵着艺术意蕴，它是凭借艺术家的技巧所创造出来的情景交融的艺术境界，情与景契合无","间、高度统一，才能形成一个有机的艺术整体。","清初著名画家朱耷，别号“八大山人”，常常通过描绘花木鱼鸟的某种特征和动态，乃","至夸张变形，来寄托自己郁闷悲愤的情感，抒发他对现实的不满和愤慨，《荷花水鸟图》就","是他的一幅代表性作品。画面上，残荷斜挂，孤石倒立，一只缩着脖子、瞪着白眼的水鸟孤","零零地蹲在石头上，很像是画家本人的自我写照。全画以极其简练而苍劲的用笔，创造出一","种萧瑟惨淡的意境，画中的大片空白更增强了悲凉的氛围，这就是中国画善于利用空白，使","得“无画处皆成妙境”。","典型与意境是属于同一层次的范畴，二者之间既有区别，又有联系。艺术家在刻画艺术","形象时，应当努力达到塑造典型或营造意境的艺术高度。","第三节  中国传统艺术精神","一  中国美学与中国艺术","（1）中国传统美学强调美与善的统一，注重艺术的伦理价值；西方传统美学则强调美","","","","","与真的统一，更加重视艺术的认识价值。中国传统美学强调艺术的表现、抒情、言志；西方","传统美学则强调艺术的再现、模仿、写实。“模仿说”是古希腊美学的普遍原则，亚里士多","德以模仿为基础建立起的《诗学》体系，在欧洲雄霸了两千年。而“表现说”则成为中国先","秦美学的核心，“言志”“缘情”是我国诗论重视表现的最早见解，在情与理的统一中，将","“天人合”的审美境界作为最高境界。","（2）学术界一般认为，对中国传统艺术影响最为巨大的主要是儒家美学、道家美学和","禅宗美学。正是这三者的不断冲撞和融会，影响和决定着中国传统艺术思想审美趣味的不断","变化与发展， 形成了中国传统艺术的精神。 其中， 以孔子、 孟子为代表的儒家美学和以老子、","庄子为代表的道家美学，早在先秦时期就已经初具规模，在此后中国传统艺术漫长的发展历","程中，二者既互相对立，又彼此补充，共同构成了中国传统美学的主干。后来崛起的禅宗美","学，与儒家美学、道家美学既有相通之处，又有与它们截然不同的独特之处。正是这三大体","系的美学思想，共同构成了中国传统美学影响着中国艺术的发展。","以上区分只有相对意义。从整体上讲，儒、道、禅三家或多或少都会对每位艺术家产生","影响。更何况，儒道互补、庄禅相通，三者共同构筑了中国历代知识分子精神的家园。总结","起来，如果用一句话说，这就是：无论庄、易、禅（或儒、道、禅），中国哲学的趋向和顶","峰不是宗教， 而是美学。 中国哲学思想的道路不是由认识、 道德到宗教， 而是由它们到审美。 ”","二  中国传统艺术精神","中国传统艺术精神十分丰富 ，笔者主编的 《中国艺术学》里 ，曾将其提炼为","“道”“气”“心”“舞”“悟”“和”六个字，在这里简述如下：","1. 道——中国传统艺术的精神性","张岱年先生认为 :“中国古代哲学的最高范畴是道。道有天道、人道之分。”老庄道家","更加侧重于“天道”或“自然之道”，孔孟儒家更加侧重于“人道”或“伦理之道”，佛教","禅宗虽然不讲道，但禅学的“佛性”（“即心即佛”）却相似于儒、道两家关于道的概念。","显然，天、人统一于“道”，这个“道”也就是“天人合一”之“道”。","“天人合一”决定了中国古代哲学的基本精神是追求人与人、人与自然的和谐统一。汤","一介先生认为 :“中国古代哲学主要是儒道两大系统， 从这两大系统看， 无论是儒家还是道家，","","","","","他们讨论的根本问题都是‘天人关系’问题，而且发展的趋势更是以论证‘天人合一’为其","哲学体系的根本任务。”","“天人合一”是中国传统文化的核心范畴，它不仅是一种人与自然关系的学说，而且也","是一种关于人生理想、人生价值的学说。“天人合一”思想认为人是自然界的一部分，而自","然界具有普遍规律，人也应当服从这种规律。此外，“天人合一”还强调人性即是天道，道","德原则和自然规律是一致的，人生的最高理想应当是天人协调，包括人与万物的一体性，还","包括人与人的一体性。 中国文化与西方文化最根本的区别之一， 就在于前者强调 “天人合一” ，","而后者强调“主客分立”。","老庄道家学派注重于“天道”方面的探索。老子认为，天地万物都是由“道”产生的，","“道”是有与无的统一体，是宇宙天地万事万物存在的根据和本原。老子说 :“道生一，一","生二，二生三，三生万物。万物负阴以抱阳，冲气以为和。”中国人并不像西方人把物质和","精神截然分开，而是把精神和物质浑然一体，认为这就是宇宙天地本来的状态，而其中精神","又起着绝对作用。精神性成为中国传统艺术的特征和特性。中国艺术这种强烈的精神性，同","西方艺术形成了鲜明的对比。","中国传统艺术的这种精神性，影响深远并且是多方面的。例如，在“形神”关系上，中","国传统艺术从来要求“以形写神”或“以神写形”。顾恺之“传神写照，正在阿堵中。”在","“意境”范畴中，意寓于境中，通过世间万事万物的现象去体认宇宙生命本体的“道”，从","有限到无限，正是意境的关键与核心。","2. 气——中国传统艺术的生命性","物质的气被精神化、 生命化， 这可以说是中国 “气论” 的本质特征。 中国传统美学用 “气”","来说明美的本原，提倡艺术描写和表现宇宙天地万事万物生生不息气流动的韵律与和谐。一","方面，中国美学十分重视养气，主张艺术家要不断提高自己的道德修养与学识水平，“气”","是对艺术家生理心理因素与创造能力的总的概括；另一方面，又要求将艺术家主观之“气”","与客观宇宙之“气”结合起来，使“气”成为艺术作品内在精神与艺术生命的标志。","中国传统美学中的“气韵”范畴，极富民族特色，指的是审美对象的内在生命力显现出","来的具有韵律美的形态。 南齐谢赫在 《古画品录》 中提倡绘画六法， 将 “气韵生动” 作为第一条。","“气韵生动”已经成为中国画创作的总原则，相当深刻地反映了中国古典美学的基本特色。","","","","","对于“气韵”来讲，气为生命之动力，韵为生命之风采；动为气之核心，情为韵之根本。","气和韵的关系，在中国艺术史上仍然可以看出一条漫长的发展轨迹，这就是由“以气取韵”","到“韵中有气”，从以“气”为主到以“韵”为主。从商周青铜器开始，到秦代的兵马俑和","庞大的建筑群，再到汉代气势磅礴的雕塑与总括宇宙的汉赋，可以说都是“以气取韵”，自","魏晋南北朝开始，“气韵”成为中国传统艺术的核心范畴之一，文人书画诗词转而探求内心","世界逐渐发展为以韵为主。从尚气到尚韵，大约元代是个转折，尤其是“元四家”“明四家”","的绘画艺术更是以韵为主，他们的作品提倡以墨取韵，追求韵味和趣味。在这些绘画中常常","蕴涵着禅的机趣、道的自然、儒的真性，达到了“韵中有气”的审美境界。","3. 心——中国传统艺术的主体性","中国古典美学和中国传统艺术，一贯强调审美主客体的相融合一，一贯认为文学艺术之","美在于情与景的交融合一、心与物的交融合一、人与自然的交融合一，使得中国传统艺术具","有精神性、生命性、主体性、表现性的特色。宗白华先生说 :“艺术家以心灵映射万象，代","山川而立言， 他所表现的是主观的生命情调与客观的自然景象交融互渗， 成就一个鸢飞鱼跃、","活泼玲珑、渊然而深的灵境；这灵境就是构成艺术之所以为艺术的‘意境’。”","同时，中国传统艺术又十分重视情理交融、情理统一。有“言志”和“缘情”两大流派，","但是，“言志说”并不反对诗要抒情，“缘情说”也不反对言志言理。“可见，审美的境界，","在中国传统艺术中是一种情理浑然一体的境界。这个浑然一体的境界要求在尊重艺术主情的","时候，强调‘以理节情’；在要求艺术求真或求善的时候，又强调‘以情融理’。”","中国传统艺术的主体性，决定了人品与艺品之间的密切关系。中国传统文化从来强调艺","品出于人品、 人品决定艺品， 因而有 “文如其人” “画如其人”。中国历代艺术家论诗、 论画、","论乐、论字，差不多都要谈到“胸襟”与“面目”，把人品归之为“胸襟”，即人格的精神","境界，把人品在作品之体现比之为人的“面目”。人品决定艺品，“胸襟”决定“面目”。","4. 舞——中国传统艺术的乐舞精神","在中国古代艺术中，诗、乐、舞最初是三位一体的，只是到后来才逐渐发生了分化，形","成了各具特色的不同艺术门类。 宗白华先生说:“舞’ 是中国一切艺术境界的典型。 中国的书法、","画法都趋向飞舞。庄严的建筑也有飞檐表现 着舞姿。”又说 :“中国的绘画、戏剧和中国另","","","","","一特殊的艺术——书法，具有着共同的特点，这就是它们里面都是贯穿着舞蹈精神（也就是","音乐精神）。”","宗白华先生所说的“舞”，其实是指出了中国艺术外在形式的共同特点，或者说是从总","体上来概括了中国艺术的形态。前面谈到作为精神核心的“道”，可以说是中国传统艺术的","内在精神；而“气韵”既是中国传统艺术的内容特色，同时又是中国传统艺术的形式特色；","“舞”则是把中国传统艺术内在精神生命化推向彻底形式化。总而言之，道的精神——气的","生命——舞的形态，这就是中国传统艺术精神的整体结构。","乐舞精神的抽象化的最终形态是线，线实际上是对乐舞精神的一种造型。因此，中国传","统艺术又是线的艺术。在中国的各个艺术种类中，不仅绘画、书法是线的艺术，其他诸如雕","塑、篆刻、音乐、舞蹈，乃至戏曲、古典小说等，也都可以称之为线的艺术。","中国戏曲的结构表现的是一种纵向的线性美，西方戏剧的结构表现的则是一种横向的板","状美。","中国古典小说也主要是采用线性结构。吴承恩的《西游记》，虽然是一部神话小说，但","其结构方式仍是一种线性结构，故事情节线条清楚，有始有终，被有机统一在线性结构里。","这种线性结构的叙事方式，大多具有鲜明的开端、发展、高潮和结局，通过中国戏曲与章回","小说长期的熏陶和影响，对中国读者和观众的审美心理与欣赏习惯产生了极大的影响。","5. 悟——中国传统艺术的直觉思维","张岱年先生指出 :“在中国传统哲学中占主导地位的思维方式， 以重和谐、 重整体、 重直觉、","重关系、重实用为特色。”重直觉是中国传统思维方式的重要特点之一。而这种传统思维方","式，对中国的传统艺术思维和审美思维也产生了巨大的影响，尤其是形成了以“悟”为核心","的感性直觉的审美思维方式。","“悟”，作为中国美学与艺术学的重要范畴之一，衍生出“顿悟”“妙悟”等一系列相","关范畴。钱锺书先生认为，“悟”是一种最自由的精神活动状态，是一种体验有得的创造性","思维方式。 虽然人人都可具有悟性， 但只有博采众通、 工夫不断， 才能真正达到 “悟” 的境界。","艺术家要想达到“妙悟”境界，不可能一蹴而就，只有通过艰苦探索与辛勤实践才能达到。","要想达到“悟”的境界，审美主体还必须将自己的心灵从各种外在和内在的束缚中解放","出来，澄怀味象、乘物游心、扫除杂念、涤荡心胸，始终保持自由愉快、无私无欲的审美心","","","","","境，要做到这一点，首先必须做到躁归于静、静追于游，从忘物去物到忘我无己，达到凝神","遐想、妙悟自然、身与物化、物我两忘的自由王国。“游”的境界，对于艺术创造来讲，就","是要求主体首先要自我解放，心神超然于物外而逍遥，最大限度地释放自己的精神能量，获","得一种精神的自由感和解放感。庄子认为，只有通过“心斋”这种超越感官视听的特殊心态","去体悟虚无之道，以及通过“坐忘”这种忘我忘物的非理性精神状态，才能在“天人合一”","的境界中，得到精神的自由解放，建立精神的自由王国。","真正的艺术家必须具有悟性。艺术家与艺术匠人最大的区别就在于：前者是以道驭技，","而后者是有技无道。由技达道、技中见道，从而实现技道相通、以道驭技，离不开工夫，离","不开修养，更离不开悟性。","6. 和——中国传统艺术的辩证思维","中国传统艺术的审美思维，同样兼有直觉思维和辩证思维。","中国传统美学与传统艺术主张“中和为美”。“和”是指事物的多样统一或对立统一，","是矛盾各方统一的实现；“中”则是指处理事物矛盾的一种正确原则和方法，是实现这种统","一的途径与标准。“文质彬彬”克服了“质胜文”和“文胜质”这样两种片面性。在中国传","统文学艺术中，“中和之美”就是强调一种适中精神，既是指美刺讽喻要适中，也是指艺术","表现的形式要适中，更是指文艺作品的情感表现要适中。","“和”是指多样统一或对立统一。从多样统一来看， “和”与“同”是两个不同的概念，","在本质上是不一样的。“同”只是把同类的、没有差别的东西结合在一起；而“和”则是由","不同的、甚至相反的事物统一为一个整体，也就是追求多样的统一。因此，避免重复雷同，","求异求变，不仅不与求和谐的整体思维方式相矛盾，相反，它正是体现出这种“违而不犯，","和而不同”的艺术思维特点。齐白石先生讲 :“作画妙在似与不似之间，太似为媚俗，不似","为欺世。”","另一方面， 在发现多样统一而求 “和” 的同时， 中国古代哲人又发现了对立统一而求 “和” 。","与多样统一相比，对立统一更接近事物发展的根本规律。中国传统美学与艺术学的许多范畴","都是以对立统一的形式出现，如“刚柔”“虚实”“动静”“形神”“文质”“情理”“情","景”“意象”“意境”，等等。","“中”的本意是提倡一种正确的道德，一种正确的理性。“中”就是要不走极端， “中”","","","","","就是要辩证地处理问题，求得真善美的和谐统一。在中国传统审美思想中，一贯把正确的伦","理理性作为前提，把真与善作为前提，追求“质正得中”，中则必正，正则必中。在情与理","的关系上，强调“以中为节”，做到情与理的统。因此，中国传统艺术一方面强调表现情感，","另一方面又强调以理节情和情理交融；一方面强调艺术具有感官愉悦功能，另一方面又强调","温柔敦厚与感染教化，孔子就提出了“乐而不淫，哀而不伤”的原则。","“中”需要“权衡”。所谓“权衡”就是一种对“度”的把握，就是要在不平衡中求得","平衡。潘天寿“造险，再破险”。险，就是极端的不平衡；破险，就是从极端的不平衡中求","得平衡之点。","作为中国古典美学和传统艺术的最高目标，这就是物我同一、天人相和。这种“大乐与","天地同和”的艺术境界，实际上也就达到了善的境界、真的境界和美的境界，也正是在真善","美三者统一的基础上，中国传统艺术将审美境界作为人生的最高境界与理想追求。","","","","","第十二章  艺术鉴赏","第一节  艺术鉴赏的一般规律","所谓艺术鉴赏，是指读者、观众、听众凭借艺术作品而展开的一种积极的、主动的审美","再创造活动。 从这个意义上讲， 艺术鉴赏体现在 “人们对艺术形象感受、 理解和评判的过程。","人们在鉴赏中的思维活动和感情活动一般都从艺术形象的具体感受出发，实现由感性阶段到","理性阶段的飞跃”。因此，鉴赏的本身便是一种审美的再创造。","一  艺术鉴赏的重要意义","（1）20 世纪中叶以来，艺术鉴赏越来越引起人们的重视和注意。文艺研究的重心，逐","渐从艺术创作和艺术作品转移到艺术接受和艺术鉴赏。尤其是 20 世纪 60 年代末和 70 年代","初在联邦德国出现的接受美学，作为文学艺术研究领域一种全新的方法论。","（2）接受美学代表人物主要是两位文艺理论家姚斯和伊塞尔，他们的共同主张是：研","究文学与文学史，必须侧重研究读者的接受过程。","接受美学首先确立了读者的中心地位，认为读者在阅读活动中具有重要地位。其次，接","受美学强调了审美经验的中心地位，姚斯将接受方式分为垂直接受（历史发展角度）与水平","接受（同时代人对文学作品的接受状况）等。","接受美学影响最大的，是姚斯提出的“期待视野”和伊塞尔提出的“空白”这两个概念。","<1> 所谓“期待视野”，是指在文学接受活动中，读者原先的各种经验、素养、审美趣","味等综合形成的对文学作品的一种欣赏水平和欣赏要求，在具体阅读活动中，表现为一种潜","在的审美期待。在期待视野中有两点值得注意：其一是指读者的期待视野与新作品之间，应","当有一个适度的审美距离，一方面作品应当使读者出乎意料，超出他原有的期待视野，使读","者感到振奋，因为新的体验大大丰富和拓展了新的期待视野，这就是为什么艺术作品总是需","要创新；另一方面，作品又不能过分超前，不能让读者的期待视野处于绝对的陌生状态，这","又会使读者感到寡然无味、难以接受，这也是一些极端先锋派作品曲高和寡的原因。其二是","指期待视野的不同，使不同读者对于作品的需求与好恶不同。由于读者是千差万别的，每个","","","","","人的文化修养、审美趣味、生活经历、性格气质都各不相同，因而会形成不同的期待视野，","读者对同一作品的理解也会出现差异，读者赋予作品的意义也会各不相同。","<2> 伊塞尔则用 “空白”和“不确定性”来说明本文（ text）与读者接受的关系。伊塞","尔强调“空白的东西导致了本文的未定性”，“空白从相互关系中划分出图式和本文观点，","同时触发读者方面的想象活动”。显然，所谓“空白”就是指本文中未写出来的部分，只是","本文向读者所暗示或提示的东西，需要读者运用自己的想象去填补。所以，伊塞尔认为，任","何文学本文都具有未定性，它的存在本身就是一个“召唤结构”，具有很多“空白”，当读","者将自己独特的体验和想象置入本文，将作品中的这些“空白”填充起来时，作品才真正成","了读者的作品，作品的艺术世界才真正成为读者的世界，作品中的未定性才得以确定，文学","作品的审美价值才得以实现。显然，“空白”不仅不是文学本文的缺点而恰恰是它的特点与","优点。","（3）接受美学的苏联学派，文艺理论家梅拉赫文章《构思、电影、接受作为动态过程","的创作过程》为代表，首次提出了“艺术接受”的概念，认为艺术接受是整个艺术创作过程","的有机组成部分与不可缺少的环节，艺术创作过程实际上是艺术家与欣赏者不断交互作用的","动态过程。接受美学传入美国，以费希为代表的一批美国学者，形成了“读者反应批评”这","个新的学派，他们认为意义或理解是阅读活动的最终结果，阅读活动就是读者在阅读中不断","体验和反应的过程，费希把读者对作品的这种反应和经验称之为“意义经验”，他认为读者","反应批评就是对这种“意义经验”的分析。","艺术鉴赏作为一种审美再创造活动，主要体现在以下几个方面：","第一，艺术家创作出来的艺术品，必须通过鉴赏主体的审美再创造活动，才能真正发挥","它的社会意义和美学价值。","第二，鉴赏主体在艺术欣赏活动中，并不是被动、消极地接受，而是积极主动地进行着","审美再创造。伊塞尔认为“作品的意义不确定性和意义空白，促使读者去寻找作品的意义，","从而赋予他参与作品意义构成的权利”。英国著名学者科林伍德也认为“我们所倾听的音乐","并不是听到的声音，而是由听者的想象力用各种方式加以修补过的那种声音，其他艺术也是","如此”。","第三，从最根本的意义上讲，艺术鉴赏同艺术创作一样，也是人类自身主体力量在审美","活动中的自我肯定与自我实现。","","","","","二  艺术鉴赏力的培养与提高","（1）艺术鉴赏作为一种审美再创造活动，必然对鉴赏主体提出了相应的条件和要求，","需要鉴赏者具有一定的艺术修养和艺术鉴赏力。人的审美能力和艺术鉴赏力不是天生的，而","是长期实践的结果，作为历史发展的产物，人类的审美能力在不同的社会历史时期有不同的","水平，鉴赏者个体的审美能力更是需要在长期的艺术实践中培养与提高。","（2）艺术修养与鉴赏力的培养与提高，表现在以下几点：","第一，艺术鉴赏力的培养与提高，离不开大量鉴赏优秀作品的实践。","第二，艺术鉴赏力的培养与提高，离不开熟悉和掌握艺术的基本知识和规律。艺术修养","包括对一般艺术理论和艺术史的初步了解，也包括对各个艺术门类和体裁的艺术特征、美学","特性和艺术语言的熟悉和了解。","第三，艺术鉴赏力的培养与提高，离不开一定的历史、文化知识。文化知识水平对艺术","鉴赏也有很大影响，广泛的历史、文化知识十分重要。","第四，艺术鉴赏力的培养与提高，离不开相应的生活经验与生活阅历。","第五，美育与艺术教育在培养和提高艺术鉴赏力方面，具有特别重要的地位与作用。","三  艺术鉴赏中的心理现象","1. 艺术鉴赏中的多样性与一致性","（1）艺术鉴赏中的多样性是客观存在的，它反映出人们精神生活需要的多样性。","艺术鉴赏的这种多样性，原因在于艺术鉴赏的本质是一种审美再创造活动。鉴赏主体总","是要根据自己的年龄、文化、职业、环境、兴趣、爱好等多种因素来进行选择。这种选择包","括艺术门类的选择（有的喜欢音乐，有的喜欢绘画），艺术体裁的选择（有的选择诗歌，有","的选择小说），艺术题材的选择（儿童喜欢童话故事，军人喜欢军事题材），以及艺术层次","和风格的选择（文化层次高的需要“阳春白雪”，文化层次低的需要通俗文艺），等等。同","一个人，他的鉴赏要求也会是多样的、变化的，随着年龄的增长、环境的改变、生活阅历的","变化，也会逐渐改变他自己艺术鉴赏的趣味和要求。","（2）艺术鉴赏中又存在着某种一致性。尤其是同一时代、同一民族的鉴赏者，常常表","现出某种共同的或一致的审美倾向。从艺术鉴赏的时代性来看，由于各个时代在社会实践、","物质文化与精神文化等各方面具有自己的特征，从而使得这个时期的艺术风尚产生某种共同","","","","","性或一致性。从艺术鉴赏的民族性来看，由于历史上形成的民族共同生活，形成了各民族不","同的美学传统， 也形成了各民族艺术中特有的民族风格和民族特色， 形成一种 “集体无意识”","的审美风尚。","2. 艺术鉴赏中的保守性与变异性","（1）所谓鉴赏心理的保守性，就是鉴赏主体审美经验中的定向期待视野，是指人们的","鉴赏趣味习惯于按照某种传统的趋向进行，具体表现为鉴赏活动中人们的种种偏好与选择，","以及各种不同的欣赏方式与欣赏习惯，常常具有某种定势或趋向。这些不同的倾向和方式往","往与观众的文化层次和美学修养有关，也经常带有时代与民族的共同特色。","人们鉴赏心理中的保守性是客观存在的，瑞士心理学家让 ·皮亚杰在 20 世纪 60 年代提","出的“发生认识论”，认为，认识活动是主体已有的认知结构与客体刺激之间交互作用的结","果。因此，如果从“发生认识论”来分析，这是由于人们在鉴赏艺术作品时，总会按照自己","原有的审美心理图式去“同化”作品，使之适应自己的欣赏习惯或审美趣味，呈现出鉴赏心","理的保守性。","（2）所谓鉴赏心理的变异性，就是鉴赏主体审美经验的创新期待视野，是指随着时代","的前进和社会生活的变化，以及国际文化交流的发展和大众审美水平的提高，人们的欣赏习","惯与审美趣味也会随之发生变化。","同时，人们鉴赏心理中的变异性也是客观存在的。人们在艺术鉴赏中追求有独创性的艺","术作品，追求作品内容与形式的创新。从皮亚杰的“发生认识论”来看，这是由于人的审美","心理图式又具有“顺应”或调节的功能，它不断接收着新的信息，改变着原有的审美心理结","构和欣赏习惯图式，表现为鉴赏心理的变异性和发展性。","第二节  艺术鉴赏的审美心理","一  注意","（1）注意是心理过程最重要的特点，也是审美心理中最重要的因素之一。“注意就是","心理活动对一定对象的指向和集中，指向性和集中性是注意的两个特点。”","注意的指向性， 其实就是一种选择性， 把需要感知和认识的事物从众多事物中挑选出来。","注意的集中性，是指把主体的全部心理要素集中到所选择的事物之上。注意能够使人在一段","时间内暂时撇开其他事物，集中而清晰地反映某个特定的事物。","","","","","注意的生理基础是大脑皮层优势兴奋中心的形成和稳定。注意的产生有着客观和主观两","个方面的原因。客观原因是刺激物的特点，如突出鲜明、变化多端、新颖别致等；主观原因","则是主体的心境、兴趣、经验、态度等。","（2）鉴赏艺术作品，显然离不开“注意”的心理功能。艺术鉴赏的最初阶段，就需要","鉴赏主体的整个心理机制进入一种特殊的审美注意或审美期待状态，从日常生活的意识状态","进入到艺术鉴赏的审美心理状态之中，使主体从实用功利态度转变为审美态度。英国心理学","家布洛提出“距离说”，认为审美感受形成的原因，在于主体对客体保持了适度的“心理距","离”，就是完全排除实用的或功利的考虑，用一种纯粹的审美心境去欣赏对象。","“注意”这个心理功能还有另外一个重要作用，这就是把感知、想象、联想、情感、理","解等诸多心理要素指向并集中于某一特定的艺术作品， 并且保持相当一段时间的注意稳定性。","二  感知","艺术鉴赏心理是以感知为基础的，它包含着简单的感觉和较复杂的知觉。感觉是指客观","事物直接作用于人的感觉器官，在人脑中所产生的对事物个别属性的反映，感觉是一切认识","活动的基础，也是审美感受的心理基础。人们在欣赏艺术作品时，必须以直接的感知方式，","去感知对象的色彩、线条、形状、声音，等等。所谓知觉，则是在感觉的基础上对事物的综","合的、整体性的把握。知觉具有整体性、选择性、理解性和恒常性等基本特征，它是一种更","加积极主动的心理活动。在艺术鉴赏活动中，知觉起着至关重要的作用。感觉和知觉合称为","感知，感觉是知觉的基础，知觉是感觉的深入，在艺术欣赏中二者通常都是交织在一起，共","同发挥作用的。","艺术作品首先是以特殊的感性形象作用于人们的感觉器官。审美感知在表面上是迅速地","和直接地完成的，但它却是人的一种积极主动的心理活动，在感知的后面潜藏着鉴赏主体的","全部生活经验，还有着联想、想象、情感、理解等多种心理因素的积极参与。","格式塔心理学认为，任何事物的形状一旦被人所感知，都是被知觉进行了积极的组织或","建构的结果。有些格式塔心理学家还曾经对整个艺术发展的历史进行了考察，认为形状可以","通过变形、变位、对称、平衡等多种方式，使人们产生一种特殊的审美经验，甚至产生一种","与生命同形或同构的力的模式，使鉴赏者感知后产生强烈的心灵震撼，从而达到审美的高峰","体验。格式塔心理学家鲁道夫 ·阿恩海姆更是对视觉艺术进行了详细的研究，突出强调艺术","","","","","欣赏中审美知觉完整性的特点，他认为艺术作品就是通过物质材料造成的完整结构来唤醒鉴","赏者整个身心结构的反应。","三  联想","联想，是指“由一事物想到另一事物的心理过程。联想可以分为接近联想、相似联想、","对比联想、因果联想、自由联想和控制联想等。","联想在审美心理中有着不容忽视的地位和作用。 通过联想， 不仅使得艺术形象更加鲜明生动，","而且能使感知的形象内容更加丰富深刻，从而使艺术鉴赏活动不只是停留在对艺术作品感性形","式的直接感受上，而是能够更加深入地感受到感性形式中蕴涵的更为丰富的内在意义。","艺术鉴赏中的联想必须以艺术作品和艺术形象为依据，不能离开作品的内容和情绪。联","想作为一种积极的心理因素，受到鉴赏主体的生活经验、认识能力和情感情绪等主观条件的","影响。 鉴赏者本人的生活经验越丰富， 认识能力越深刻， 内心情感越炽烈， 联想力也就越强。","这样的联想更具有广阔性，也就是联想的内容更加广泛和丰富；更具有敏捷性，也就是","联想的速度高、 反应快；还具有选择性， 这就是在众多的事物中能够选择到最佳的联想对象，","使联想在艺术鉴赏中发挥更大的作用和功能。","四  想象","艺术鉴赏作为一种审美再创造活动，鉴赏主体并不是消极、被动地接受，而是运用想象","和其他心理功能对艺术形象进行着积极、主动的再创造。","想象是指人脑对已有表象进行加工改造而创造新形象的过程。想象的基本材料是表象，","但想象的表象与记忆的表象不同。记忆表象基本上是过去感知过的事物形象的重现，而想象","表象则是人们头脑中新创造的形象，它是对记忆表象进行加工改造，重新创造出来的形象，","甚至可以是世界上尚不存在或根本不可能存在的事物的形象。","“想象是人的创造活动的一个必要因素”，“想象，或想象力，也像思维一样，属于高","级认识过程，其中明显地表露出人所特有的活动性质。如果没有想象出劳动的已成结果，就","不能着手进行工作。人类劳动与动物本能行为的根本区别在于借助想象力产生预期结果的表","象，任何劳动过程必然包括想象。它更是艺术、设计、科学、文学、音乐以及任何创造性活","动的一个必要方面”。","","","","","想象分为再造想象和创造想象两种。再造想象是根据语言的描述或图形、音响的示意，","在头脑中再造出相应的新形象的过程。创造想象则是不依据现成的描述而独立地创造出新形","象的过程。艺术鉴赏活动以再造想象为主，同时也包含有一定的创造想象。","培养和发挥想象力，成为人们提高艺术鉴赏能力的一个重要环节。想象的活跃程度常与","艺术鉴赏的深刻程度成正比，它也是鉴赏主体充分发挥主观能动作用的重要表现之一。对于","鉴赏主体来说， 生活经验愈丰富， 艺术素养愈良好， 文化层次愈高， 想象的翅膀也就愈丰满，","所得到的审美享受和审美愉悦也就愈强烈。","五   情感","强烈的情感体验， 正是审美活动区别于科学活动与道德意识活动的一个最为显著的特点。","情感是人对客观现实的一种特殊的反应形式，是对客观事物是否符合人的需要的一种复","杂的心理反应，是主体对待客体的一种态度。","审美心理是注意、感知、联想、想象、情感、理解等多种心理因素的统一体。它们并不","是机械地相加或简单地堆积，而是通过情感作为中介，形成了有机统一的审美心理。艺术鉴","赏中的情感活动，以注意和感知为基础，与联想和想象密不可分，并通过理解因素在感性中","表现理性，在理性中积淀感性。","首先，艺术鉴赏活动中，情感总是以注意和感知来作为基础。刘勰在《文心雕龙》中所","讲 :“登山则情满于山，观海则意溢于海。”","其次，艺术鉴赏中的情感又与联想和想象密不可分。一方面，联想和想象常常受到鉴赏","主体情感的影响；另一方面，这种联想和想象又会进一步强化和深化情感。因此，鉴赏中的","联想与想象总是以情感为中介。","此外，艺术鉴赏心理中，情感与理解也有着极其密切的关系。心理学认为，人的情感与","人对事物的认识、态度有着直接的联系，尤其是对于美感道德感这一类的高级情感来说，必","然将“评价、判断、观点作为一个必要的因素包括在情感之中，因此，我们认为，这些情感","渗透着理智的因素”。","六  理解","艺术鉴赏心理中的理解因素，并不是单独存在的，而是广泛渗透在感知、情感、想象等","","","","","心理活动中，共同构成完整的审美心理过程。因此，审美心理中的理解因素，不同于通常的","逻辑思维，而往往表现为似乎是不经思索直接达到对于艺术作品的理解。","理解是逐步认识事物的联系关系直至认识其本质规律的一种思维活动。理解包括直接理","解和间接理解。“所谓直接理解是指没有中介思维参与，而是个体通过目前的亲身经验实现","的理解；所谓间接理解则是指借用前人经验和个体以往的经验，通过一系列分析综合、抽象","概括等中介思维而实现的理解。”美与艺术活动中的理解，常具有直接领悟的特点，表现为","一种心领神会、不可言传的体验。因此，艺术鉴赏中的理解多以直接理解为主，同时在一定","程度上也有间接理解的参与。","艺术作品不仅具有感性的形式和生动的形象，而且还有内在的寓意和深刻的意蕴，并且","常常具有朦胧性和多义性的特点。","艺术审美心理中的理解因素至少有以下三层含义：","首先， 对于艺术作品内容的鉴赏离不开理解因素。 一部艺术作品往往包含着题材、 主题、","情节、场面、形象、典型等许多内容，有的艺术作品还需要鉴赏者了解它的背景、典故、象","征意义等。在艺术鉴赏中，人们必须运用自己的生活经验和文化知识来理解作品的内容。","其次，对于艺术作品形式的鉴赏离不开理解因素。各门艺术都有自己独特的艺术语言和","表现手法。","最后，对于每一部艺术作品的内在意蕴和深刻哲理的认识，更不能脱离理解因素。","第三节  艺术鉴赏的审美过程","艺术鉴赏其中包含着非常复杂的心理活动内容，各种心理要素在其中形成了一个动态的","审美心理过程。","一  艺术鉴赏中的审美直觉","（1）所谓审美直觉，是指人们在审美活动或艺术鉴赏活动中，对于审美对象或艺术形","象具有一种不假思索而即刻把握与领悟的能力。德国哲学家、美学家鲍姆嘉通，在 1750 年","第一次使用“美学”（ Aesthetica）这个术语，标志着美学作为一门独立学科的诞生。这个","词照希腊文原意来看是“感觉学”的意思，也就是一门研究直觉的知识的科学。","（2）认识分为三种方式，即直觉、知觉和概念。直觉只注意事物的形象，而不注意事","","","","","物的意义。知觉则是在注意事物形象的同时，也关注事物的意义。概念则是超越形象，以抽","象思维的方式去把握事物的内在本质。直觉的对象是具体的形象，概念的对象却是抽象的意","义。直觉总是与事物的外在感性形式联系在一起的，总是与具体事物的形象联系在一起的。","（3）审美直觉的特点就是直观性和直接性。","直观性， 就是我们欣赏艺术作品必须亲身去感受， 它不能通过间接经验而获得审美感受，","必须鉴赏主体亲身参与和直接感受。","直接性常常表现为一种不假思索地直接把握或领悟，这种把握或领悟又常常是在一瞬间","完成的，无需通过逻辑判断或理性思维。","克罗齐就宣扬“直觉说”，认为直觉就是表现，就是艺术。","（4）在审美直觉中，还存在着一种特殊的现象——通感。所谓通感，是指在艺术创作","与鉴赏活动中，各种感觉相互渗透或挪移，从而大大丰富和扩展了审美感受。","显然， 在审美与艺术活动中， 通感是一种客观存在的现象。 “在日常经验里， 视觉、 听觉、","触觉、嗅觉、味觉往往可以彼此打通或交通，眼、耳、鼻、舌、身各个官能的领域可以不分","界限。颜色似乎会有温度，声音似乎会有形象，冷暖似乎会有重量，气味似乎会有锋芒。”","联觉是“感觉相互作用的一种情况，是一种已经产生的感觉引起另一种感觉的兴奋，或","一种感觉的作用借助另一种感觉的同时兴奋而得到加强的心理现象。例如，看到红、橙、黄","等色彩，可以引起暖的感觉；看见蓝、紫、绿等颜色，可引起冷的感觉。","接受美学的代表人物姚斯认为，读者在阅读任何一部文学作品时，绝不是脑子中一片空","白地去阅读，而是带着他原有的文学经验与生活经验来欣赏文艺作品，这就形成了每个读者","在进行审美阅读时的前结构和心理图式，也就是审美经验的期待视野。这种期待视野又分为","定向期待和创新期待。所谓定向期待就是由读者的文化素养、审美趣味、鉴赏能力等多种因","素构成的一种惯性心理力量，“它以不经意的、有时甚至是无意识的习惯的方式支配着阅读","过程。读者阅读中的定向、选择和同化，完全是在不知不觉、不假思索中进行的”。","艺术鉴赏中的审美直觉，作为鉴赏活动的开始，虽然宝贵和重要，但是仍需要进一步深","化和发展，需要进一步发挥鉴赏主体诸多审美心理因素的积极能动作用，因此，艺术鉴赏必","然进入第二个层次，即审美体验阶段。","二  艺术鉴赏中的审美体验","艺术鉴赏中的审美体验，作为整个审美活动过程的中心环节，是指鉴赏主体在审美直觉","","","","","的基础上， 达到艺术审美活动的高潮阶段， 调动再创造的想象力和联想力， 激起丰富的情感，","设身处地地生活到艺术作品之中，获得心灵的审美愉悦，把外在作品中的艺术形象转化为鉴","赏者自身的生命活动。","审美体验阶段则主要是鉴赏主体反作用于艺术作品，整个心理活动处于一种主动状态，","体现为一种积极的审美再创造活动。美国人本主义心理学家马斯洛则认为“高峰体验”是人","在自我实现的创造过程中产生的最激荡人心的时刻，它使人如痴如醉、销魂落魄，“这些美","好的瞬间体验来自爱情，和异性结合，来自审美感受（特别是音乐），来自创造冲动和创造","激情（伟大的灵感），来自意义重大的领悟和发现…”马斯洛指出这种“高峰体验”几乎存","在于人类活动的一切领域，但最容易发生在艺术和审美领域。艺术鉴赏活动中，审美体验越","丰富、越深刻，心灵受到的震撼越强烈、越深沉，鉴赏者就能获得更加高级的审美愉悦。","接受美学提出了文学作品结构的召唤性问题， 认为任何作品都必然存在着 “空白” 或 “不","确定性”，有待于读者在阅读活动中去参与作品意义的创造。接受美学认为，作品中的这种","“空白”或“不确定性”实际上是对读者的一种召唤和等待，召唤读者在其可能范围内充分","发挥再创造的才能，这就是所谓文学作品的召唤性结构。","三  艺术鉴赏中的审美升华","（1）作为艺术鉴赏活动的最高境界，审美升华是指鉴赏主体在审美直觉和审美体验的","基础上达到一种精神的自由境界，通过艺术鉴赏的审美再创造活动，在艺术作品和艺术形象","中直观自身，实现本质力量的对象化。","大凡优秀的艺术作品总是在生动感人的艺术形象中，富有更多形而上意蕴的追求。这种","艺术意蕴常常是只可意会，不可言传，它使艺术作品在有限中体现出无限，在偶然中蕴藏着","必然，在个别中包含着普遍。审美升华阶段正是需要鉴赏主体去思索、理解、领悟这种艺术","意蕴。","（2） 顿悟， 是审美升华阶段时常发生的现象。 我们在鉴赏艺术作品最深层次的意蕴时，","既不能依靠直觉，也不能依靠体验，甚至不能依靠单纯的理解。由于艺术意蕴大多是将无穷","之意蕴涵在有尽之言中， 具有多义性和模糊性， 要把握这种 “言外之意” “弦外之音” 或 “象","外之旨”，就必须通过哲理的顿悟和理性的直觉。","这时的直觉不同于艺术鉴赏刚开始时的直觉，而是渗透着理解因素的更高级的直觉，这","种直觉可以透过艺术作品感性直观的外部形象，直接把握作品最内在、最深刻的艺术意蕴。","","","","","鉴赏主体此时此刻将自己的心灵完全沉浸在艺术的境界里，在一刹那间获得顿悟，从艺术的","体验世界上升到艺术的超验世界，对作品达到形而上的理解，审美感受得到理性的升华。","顿悟中有直觉，但这种直觉已经在想象、联想、情感等多种心理因素的基础上渗透进了","理性的色彩；顿悟中有理解，顿悟中的理解，它是将感性和理性、认识与情感、体验与思维、","直觉与理解融汇在一起，是审美升华阶段一种更加深刻的理解。","（3） 共鸣， 也是审美升华阶段时常发生的一种现象。 所谓共鸣， 是指在艺术鉴赏过程中，","鉴赏主体在审美直觉和审美体验的基础上，深深地被艺术作品所感动、所吸引，以致达到忘","我的境界，由此达到鉴赏主体与艺术形象之间契合一致，物我同一，物我两忘。共鸣是鉴赏","过程中情感、想象等多种心理功能达到最强烈程度的表现，同时也离不开对作品意蕴的深入","的感受和理解。因此，共鸣不仅具有艺术鉴赏审美心理的各种特征，而且也是艺术鉴赏活动","的高峰和极致。","（4）现代格式塔心理学派用“异质同构”或“同形同构”理论来解释审美经验。格式","塔心理学家认为，艺术感染力来源于支配着自然和人类的无所不在的“场”的作用，“场”","表现为一种“力的结构图式”。当艺术品与鉴赏者的完形机能同一，也就是鉴赏者和艺术品","在“力的结构图式”上同一时，这种主客体之间“异质同构”的感染力就产生了。实际上，","即使用格式塔心理学来解释，共鸣的产生原因也应当是艺术家与鉴赏者之间在审美心理结构","上的“同形同构”。","从哲学美学的意义上讲，艺术鉴赏的审美升华，实际上就是鉴赏主体通过审美再创造活","动，在鉴赏对象（艺术作品和艺术形象）中直观自身，实现人的本质力量对象化，从而引起","审美愉悦，产生美感。","第四节  艺术鉴赏与艺术批评","艺术批评与艺术鉴赏是两个紧密联系而又有很大区别的活动。 艺术批评离不开艺术鉴赏，","它只能在艺术鉴赏的基础上才能进行。同时，艺术批评作为艺术接受的高级阶段，它又并不","仅仅停留在鉴赏阶段，而是需要在艺术鉴赏的基础上进一步深化和发展，在一定的艺术理论","指导下对艺术作品和艺术现象进行细致深入的研究分析，并作出理论上的鉴别和论断。","","","","","一  艺术批评的作用","艺术批评的第一个作用就是帮助人们更好地鉴赏艺术作品，提高鉴赏能力和鉴赏水平。","艺术批评的第二个作用就是通过对艺术作品的评价，形成对艺术创作的反馈。","艺术批评的第三个作用就是丰富和发展艺术理论，推动艺术科学的繁荣发展。","艺术批评的主要任务是对艺术作品的分析和评价，同时也包括对于各种艺术现象（如思","潮、流派）的考察和探讨。一方面，艺术批评必须以一定的艺术理论作指导，利用艺术史研","究提供的成果，另一方面，艺术批评也总是通过分析新作品，评论新作家，发现新问题，总","结新经验，从而不断丰富和发展艺术理论和艺术史的研究成果，使艺术理论和艺术史研究从","现实的艺术实践中不断获取新的资料和新的素材。","二   艺术批评的特征","艺术批评具有二重性的特点，即科学性与艺术性的统一。","一方面， 艺术批评具有科学性。 艺术批评家需要在艺术鉴赏的基础上， 运用一定的哲学、","美学和艺术学理论，对艺术作品和艺术现象进行分析与研究，并且作出判断与评价，为人们","提供具有理论性和系统性的知识。","由于艺术批评是一种偏重于理性分析的科学活动，它同艺术鉴赏既有联系，又有区别。","一般来讲，艺术鉴赏偏重于感性，艺术批评则偏重于理性；艺术鉴赏更多带有个人主观性的","特点，艺术批评则需要符合客观规律性。因此，“鉴赏可以不含有批评的意味，但批评却必","然是经历过鉴赏这个阶段。一个艺术爱好者，绝不应该止于鉴赏，应该作进一步的批评，因","为只有批评，才能认识艺术的真面目，才能对于艺术有正确的批评。”","另一方面，艺术批评又应当具有艺术性。艺术批评必须以艺术鉴赏中的具体感受为出发","点，因而优秀的批评家应该具有敏锐的感知力、丰富的想象力和强烈的情感体验，这样才能","真正认识和把握作品的成败得失。","艺术批评的二重性特点，还决定了艺术批评既带有强烈的个人色彩，又具有客观的共同","标准。艺术批评的标准应当是思想性和艺术性的完美统一。思想性是指艺术作品所具有的思","想意义和所达到的思想水平，它是艺术作品内在的灵魂。艺术性是指艺术作品在艺术构思、","艺术语言、艺术表现手法等方面所达到的水平，特别是从整体上达到完美的艺术境界，具有","独创的艺术风格。",""],"mage":["","","绪论","《艺术学概论》的中心指导","坚持马克思主义对于艺术学理论的指导，坚持辩证唯物主义和历史唯物主义的世界观与方","法论，这就是从“一般”到“特殊”，充分发挥出艺术学理论从宏观上、整体上引领各门具体","艺术的积极作用。","我国艺术学理论的根本任务，就是构建具有中国特色的艺术学学科体系。换句话说，就是","构建中国艺术学理论的学科体系。","（一）学习与研究艺术学理论的意义(作用)","艺术学理论是从艺术活动的实践中总结出来的。反过来，艺术学理论又可以指导艺术创作、","艺术批评等实践活动。","艺术学理论的第一个作用是指导艺术创作。","各个艺术种类都有自己的特点，但是作为一一个艺术学门类，它们又具有许多共同的特性。","作为“普通艺术学”或者“一般艺术学”的艺术学理论，正是要从宏观上或者整体上来指导各","个具体艺术种类的艺术创作，并且要从各个具体艺术种类中概括归纳出批具有宏观意义或者整","体意义的共性特征来。","艺术学理论的第二个作用是指导艺术批评。","我国艺术学理论的第三个作用是努力发掘和整理中华民族自身富有特色的艺术创作理论与","艺术批评理论，努力构建中国艺术学的学科体系，充分体现出我们的文化自信。加强对中国艺","术学的研究，不但是完善艺术学学科体系建设、培养艺术学人才的教学与科研方面的迫切需要，","而且也是当前我国各门艺术实践发展的迫切需要。","我国艺术学理论的第四个作用更加重要，就是繁荣与发展我国的哲学社会科学，繁荣与","发展我国的社会主义文化。一方面，艺术学理论需要不断地从哲学社会科学中汲取宝贵的营养，","从而能够与时俱进地不断发展;另方面，艺术学理论又从各个种类艺术实践中不断地发掘和提炼","出许多崭新的成果，并且将其升华到理论高度，从而极大地丰富与提升了我们的哲学社会科学","水平，提高国家文化软实力，就需要努力展示中华文化的独特魅力，包括中华民族优秀文学艺","术的丰富成果。正是从这些意义上讲，我国各门艺术与艺术学理论的发展，也是直接推进了我","国社会主义文化的繁荣与发展。","（二）学习与研究艺术学的方法","1、坚持以马克思主义文艺理论为指导","","","唯物史观正确说明了社会存在和社会意识的关系，揭示了生产力和生产关系、经济基础与","上层建筑之间的对立统一的辩证关系。例如，我们提倡艺术“源于生活，高于生活”，就是坚","持能动的反映论。","2.继承中国优秀文化传统","毫无疑问，我们中华民族艺术自身最大的优势和特点，就在于深植根于中华民族文化传统","沃土之中。","3、借鉴国内外艺术理论","中国传统艺术理论源远流长，从先秦时期开始，以孔子、孟子为代表的儒家美学，以老子、","庄子为代表的道家美学，就奠定了中国传统艺术的精神。","外国传统艺术理论同样是历史悠久、成果丰富。我们社会主义文艺要繁荣发展起来，必须","认真学习借鉴世界各国人民创造的优秀文艺。只有坚持洋为中用、开拓创新，做到中西合璧、","融会贯通，我国文艺才能更好发展繁荣起来。","（三）艺术生产（马克思艺术生产理论）","定义:马克思明确提出“艺术生产”的概念，把“艺术”与“生产”联系起来考虑，从生产","实践的角度考察艺术问题。两层含义，第一层含义：艺术活动的性质是生产实践，第二层含义：","艺术活动是作为和物质生产相对应的精神生产，是一种特殊的精神生产。","对艺术研究的启示:","第一，揭示了艺术的起源、性质、特点。艺术生产理论认为，归根结底，艺术的起源离不","开人类的社会实践活动。艺术的性质是主客体的有机统一。艺术的特点，是把创作主体强烈的","主观因素渗透到整个艺术创作过程当中，并融汇到艺术作品之中，是一种特殊的精神生产。","第二，阐明了两种生产(物质生产与艺术生产)的不平衡关系。艺术是一种特殊的意识形态，","最终在一定的经济基础上形成。但艺术作为一种特殊的精神生产，又具有相对独立性。从整体","社会发展上来看，两种发展是趋于平衡的，因为艺术生产最终必然受到物质生产的制约。但是","在社会发历史发展的某些阶段上，艺术的发展与物质生产呈现出某种不平衡现象。(例子）第","三，揭示了艺术系统的奥秘。把艺术生产作为完整的系统研究，艺术创作一艺术作品一艺术欣","赏，揭示出艺术品与欣赏者与主体、生产与消费之间的相互依存、相互转化的辩证关系。","","","第一章艺术观念（马工程独有）","第一节艺术观念的演变","艺术观念","“艺术观念’是人们对艺术的基本问题的思考的统称，主要回答“艺术是什么”“来自何","处”及“为什么人”等问题，构成关于艺术的性质、属性或特征的基本看法系统。艺术观念问","题历来是艺术理论的核心内容。马克思主义在其深厚的哲学与美学思想基础上，充分吸纳历史","上艺术观念中的优秀成分，创立了自己的艺术观念。","一、中国艺术观念演变","在漫长的历史过程中，中国人形成了丰富多样而又不断发展变化的艺术观念。儒家、道家","和禅宗是中国古典思想文化中的三个主要流派，它们彼此不同而又相互联系和渗透的关于艺术","的论述，可以代表我国传统艺术观念的主要内容。","儒家礼乐合一的艺术观念","以孔子为代表的儒家思想是中国古典思想中最重要的内容之一，它对中国人的政治、伦理、","生活、文学和艺术都产生了巨大而长久的影响。","第一，“礼乐合一”与“美善统一”。礼是礼仪、制度，是一整套的社会规范系统，用以","规范和治理社会，形成良好的政治秩序;而乐则是音乐，泛指今天所谓艺术。礼乐合一的理念将","艺术的情感濡染与社会政治治理结合为一个互补支撑的体系。在礼乐关系的基础上，儒家进一","步发展出美善、文质、文道、情理等关系范畴，主张美善统一、文质彬彬。","在礼乐合一，美善统一的基础上，儒家以，“中和为美”。中庸原则与“和”的理想使中","国古典艺术呈现出一种和美，敦厚，情理协调的美。","第二，“成于乐”与“游于艺”。在礼乐合一的基础上，儒家进而将艺术看作是完善人格","的重要手段。","第三，“情志”说。中国古典艺术更多处在一种抒情传统的脉络里，尤其体现在中国诗词、","戏曲、音乐、舞蹈等多种艺术形式。","道家自然自由的艺术观念","道家思想对于审美心理、艺术精神的阐发也对后世中国文人与艺术家产生了长久而深远的","影响。","第一，道家艺术观念将自然视为最高的美，认为一切人之艺术都需要遵从自然。道家艺术","观更多地强调美与真的一致性，艺术必须是这种自然、自由与真实的体现，崇尚天然去雕饰的","艺术风格，认为真是美的必要条件。","","","第二，自然无为的本质是自由，道家思想将自由视为人生和艺术的最高境界。庄子《逍遥","游》中“游”的境界正是自由与无限的境界，也是美和艺术的境界。这种道家所想象的人的理","想境地，也正是高超的艺术之境。","第三，道家提出了虚静、物化、心斋、坐忘等重要的艺术美学与艺术心理问题。主体进人","虚静的状态，心斋坐忘，超越有形与有限的自我，将己物化，与外物合一，身形虽具，但精神","已进入逍遥，驰骋于天地万物。这种状态恰恰与艺术创作的状态类似，强调艺术主体超越于一","切现实利害关系进入纯粹的自由的审美境地。","禅宗艺术观念","禅宗思想特别推进了中国士人的精神生活，其包含的独特的艺术与美学观念，在文学艺术","领域产生了巨大的影响。","第一，直观与妙悟。直观是对事物表象的直接把握，妙悟就是通过直观而在瞬间参透事理，","即所谓“目击道存”。而这正与艺术创作中的直觉、灵感与顿悟等心灵现象相通。","第二，韵味与境界。禅宗追求内在精神超越，特别表现为一种对无穷的“韵味”和空灵的","“境界”的追求。在唐宋时代，艺术理论上逐渐用神、趣、韵、味等概念，取代了道、气、理、","法等范畴。司空图的《二十四诗品》更明确将一种清澄淡远的“韵外之致”“味外之旨”作为","诗歌品质的标准","在韵味之外，境界是禅宗理论的又一核心内容，王国维更把“境界/意境”当作衡量文学","作品高下的最终依据，当作文学之所以为美的本质属性。王国维的“境界/意境”大概是指一种","真切鲜明地表现出来的情景交融的艺术形象。","二、西方艺术观念演变","从古希腊时期开始，西方艺术观念史概括为四种主要形态模仿论、表现论、形式论和体制","论。","模仿论可谓“西方第一艺术理论”，认为艺术的本质是对现实世界的模仿，是社会生活的","再现，其中，代表人物有亚里士多德和车尔尼雪夫斯基，亚里士多德认为艺术是对生活的模仿，","艺术高于生活，车尔尼雪夫斯基认为，艺术是对生活的再现，生活高于艺术，我认为他们的说","法都有弊端，因为现实生活是多面性的，艺术只是把生活的一面提炼出来，不能够完全模仿和","再现现实生活。","表现论认为艺术是自我意识的表现，生命本体的冲动，建立在主观唯心主义的基础上，其","中，代表人物有康德、尼采、康德认为艺术是艺术家的天才创作，这种自由创作不包含任何利","害关系，无任何目的，提出了艺术无功利的观点，尼采认为人的主观意志是世界万物的主宰，","他们都把主观精神的表现和抒发当作了艺术的本质。这一观点的弊端是，人确实拥有着主观能","","","动性，但是主观意志在这里被说成主宰一切的独立实体，人的本能欲望被夸大为无限能动性，","过分强调人的主观意志，忽视了客观现实。","形式论认为美根源并表现于事物的形式因素，代表人物有毕达哥拉斯学派，克莱夫贝尔，","毕达哥拉斯学派发现黄金分割比率，不断追求美的形式，克莱夫贝尔提出艺术是有意味的形式。","形式论在19世纪唯美主义者那里正式出场，随后在造型艺术领域发展为以李格尔、沃尔夫林和","格林伯格等为代表的形式主义艺术史观，形式论主张艺术的本质不在于其所模仿的外在社会现","实或者其所表现的艺术家的内在情感，而就在于艺术作品自身的形式。","艺术体制论是西方艺术理论在20世纪60年代以后对艺术实践领域出现的先锋派艺术、现","成品艺术、波普艺术、观念艺术等新形态进行分析与反思的成果。我们需要将问题从“什么是","艺术”转换到“是什么使某物被看作是艺术”，即从艺术的本质转换到艺术品的资格或身份。","问题视域的转换就带出了“艺术体制”这一当代艺术社会学的核心范畴。艺术体制是特定时期","存在的关于艺术的观念与知识系统，以及艺术品赖以存在的生产、传播、消费、评价的完整的","社会机制。体制论的思路是将艺术放置于一个结构性的艺术体制之内，在一定程度上，正是某","一时期的特定艺术体制决定了何为艺术，以及艺术如何被人们理解和接受。","有意味的形式","克莱夫.贝尔则将“有意味的形式”定义为艺术的本体:“在各个不同的作品中，线条、色","彩以某种特殊方式组成某种形式或形式间的关系,激起我们的审美感情。这种线、色的关系和组","合，这些审美的感人形式，我称之为有意味的形式。”贝尔反对描述性和再现性的绘画，最看","重象征的、抽象的。","艺术意志","李格尔提出“艺术意志”的概念，从根本上强调的是二种艺术形式的客观的自主的属性，","将古代美术到现代美术的发展图式概括为立体一平面、触觉-视觉、客观一主观这三种两极对立","的过程。","三、马克思主义艺术观念（包括什么？）","1、马克思主义艺术观念是在继承和发扬欧洲思想文明的基础上，针对人类艺术发展的历","史过程与现实的创作状态而提出的，同时内在于其历史唯物主义与辩证唯物主义的哲学思想与","政治经济学思想，马克思主义为我们理解艺术的本质、艺术的生产与发展、艺术的价值等基本","问题，提供了科学的、唯物主义的思想指导。","（1）从人的本质问题出发思考艺术与美","马克思主义是在人的本质和价值的基础上思考艺术和美的问题的。马克思认为，人不像动","物那样完全依靠本能来生存，人还可以进行劳动、创造、艺术活动等，这才是自由自觉的活动。","审美与艺术活动正是人的自由自觉的生命活动与类本质的最集中的体现。人的本质力量是指人","","","的一切主体能力，包括人的物质生产能力，也包括人在精神上把握对象的能力，其中就包括审","美能力。人的美感和人的艺术创造活动根本上就是人所具有的本质力量对象化的实践结果。","（2）艺术作为社会意识形态的形式","马克思将人类社会的构成分为经济基础和上层建筑两个部分，由生产关系的总和构成的经","济基础决定了包括政治和法律制度与社会意识形式的庞大上层建筑，在这个结构中，艺术与文","学、哲学、宗教等一起构成了社会意识形式中具有特定阶级属性的意识形态的形式。因此，艺","术具有一定的意识形态属性，是“更高地悬浮于空中的意识形态领域”。意识形态通常是某个","特定的阶级、民族或群体所共享的一套观念系统，具有鲜明的阶级属性。马克思的艺术意识形","态论，从根本上判定了艺术所具有的政治性，揭穿了艺术超阶级超历史的幻象。艺术的意识形","态属性这一判断还指导人们在整体的社会存在、历史环境、经济基础的复杂系统中来辩证地思","考艺术的问题。马克思意识形态及上层建筑的发展变化是由生产力与生产关系之间的牙盾关系，","即一个社会的物质生产方式所制约的。当人们思考艺术的起源。特性、发展变化等问题时，就","必须在社会结构的系统当中寻找答案，而非就艺术而谈艺术。","（3）艺术内容与形式的辩证关系","马克思批判地继承西方哲学传统，在辩证唯物主义的思想原则下重新思考事物的内容与形","式的关系，对我们正确理解艺术作品的构成问题具有重要意义。","第一，艺术是内容与形式的辩证统一。","艺术作品包括内容与形式两个层面，内容是艺术作品所构造的事物、所讲述的故事及其所","表达的思想感情，形式则是这一内容得以实现的方式、手法与语言符号构造系统。内容与形式","是相互依存、相互支撑、不可分割地联系在一起的。在一个具体作品中，既不存在不表现为一","定形式的内容，也不存在不表现一定内容的形式，内容与形式可以相互转化。在一件艺术作品","中，内容一定会外显为形式，因为内容是具体的内容，其本身就是具有形式的，一旦离开了形","式，内容也就成了抽象的非艺术的东西。形式转化为内容，形式如果适合于内容，最终就会融","合于内容之中，加强内容的表达，成为内容本身。正如罗丹所说:“最纯粹的杰作是这样的:不表","现什么的形式、线条和颜色再也找不到了;一切都融化为思想与灵魂。黑格尔也曾说：“内容非","他，即形式之转化为内容；形式非他，即内容之转化为形式。”","第二，内容决定形式，形式服从内容。","对于一件艺术作品来说，是其具体内容决定了特定形式的选择，只有当形式符合内容的需","要、有助于内容表达的时候，形式才是合格的、有意义的。例如电影《八佰》，在内容上讲述了","抗日时期，中国军队奋勇守卫四行仓库的历史故事，形式上导演运用了符合情节的的镜头运动，","带有情感的的构图设计、表现残酷的灯光色彩等，这正是表达了我们在创作中努力去表现人物","的个性和构图的形式感，画面的运动感等等，我们从主题思想出发思考如何拍摄，就更有利于","主题的突出，这就是主题内容在形式上的要求和选择。","","","第三，形式具有一定的独立性。","内容决定形式，但形式并非亦步亦趋地跟随内容，并非机械性地对应内容，而是具有一定","的独立性。形式自身具有一定的审美价值，比如电影镜头语言的发展，意大利电影大师安东尼","奥尼的作品在空间调度、摄影、运镜方式等电影美学方面有各种开创性的贡献，此外，形式的","相对独立性还体现在，艺术创作最终达到的内容与形式的和谐统一，不是形式消极适应内容的","结果，而是形式在其积极的探索或实验中，与内容最终达成多样的对立统一，创造出含义丰富、","意味深长的艺术效果。例如残酷沉重的故事却在一种平静的超脱的语调中被讲述出来。第三，","由于这种相对独立性，在特定的社会历史环境条件下，在内容决定形式的同时，形式也会反作","用于内容。","形式可以转化为内容，当形式符合内容的需求，就会增强内容表达的效果，比如伦勃朗在","画自己晚年的自画像时，采用了厚重的油画笔触，形成了粗糙的肌理效果，很好地凸显出人物","老年皮肤的质感，更有助于传达出人物粗粝坚定的精神气质。反之，形式落后会妨碍内容的发","展。","（4）马克思主义艺术观念在中国的发展","具体就艺术观念而言，毛泽东文艺思想和中国特色社会主义文艺理论代表了马克思主义艺","术观念在中国的两个发展阶段及其主要形态，是中国化马克思主义在艺术观念领域的主要成果。","尤其是习近平新时代中国特色社会主义文艺思想，既是中国特色社会主义文艺理论的一部分，","同时又代表着它已经开辟了一个新境界和新时代。","1.毛泽东文艺思想","毛泽东文艺思想是马克思主义文学理论中国化的结晶，是我国新民主主义革命时期至改革","开放前马克思主义文学理论中国化的重要理论成果，是对中国优秀文化传统与新文艺经验的科","学总结，对我国现代文艺发展产生了重大影响。","第一，主张文艺为人民大众服务。","毛泽东明确指出，文艺要站在“无产阶级和人民大众的立场”，为最广大的人民群众服务、","为工农兵服务。","第二，阐明文艺与社会现实之间的辩证关系。","毛泽东指出：“人民生活中本来存在着文学艺术的矿藏”，“是一切文学艺术的取之不尽、","用之不竭的唯一源泉”，艺术创作必须反映真实的社会生活。但是这种反映并不是机械的镜像","复制，“文艺作品中反映出来的生活却可以而且应该比普通的实际生活更高，更强烈，更有集","中性，更典型，更理想，因此就更带普遍性。革命的文艺，应当根据实际生活创造出各种各样","的人物来，帮助群推动历史的前进”。这就是社会主义现实主义的创作原则，以现实主义的手","法表现社会主义的理想。","","","第三，强调文艺作品的思想内容与艺术形式的统一。","毛泽东把文艺作品的思想内容与艺术形式的统一视为文艺的一条基本规律，这为文艺创作","与批评奠定了理论基础。首先，文艺作品应当是思想内容与艺术形式的统一。其次，文艺批评","应坚持政治标准与艺术标准统一的原则。最后，文艺批评应将作家的动机和作品的实际效果统","一起来。","第四，主张中国文艺创造自己的“民族形式”。创造“新鲜活泼的、为中国老百姓所喜闻","乐见的中国作风和中国气派”，毛泽东进一步指出:“艺术的基本原理有其共同性，但表现形式","要多样化，要有民族形式和民族风格。”","第五，提出“百花齐放、百家争鸣”的艺术繁荣方针。在文艺为政治服务的总原则之下，","毛泽东同样尊重艺术与学术的自由的、民主的发展，提出“百花齐放、百家争鸣\"","2.中国特色社会主义文艺理论","改革开放以来，中国马克思主义文艺理论持续创新发展，构成了新时期文艺思想的基本形","态，可以称为“中国特色社会主义文艺理论”。中国特色社会主义文艺理论，集中体现在邓小","平、江泽民、胡锦涛和习近平在新时期以来历次全国文艺工作者代表大会上的讲话以及有关重","要文献中，。","第一，明确文艺是社会主义精神文明建设的重要内容。","第二，确立文艺“为人民服务、为社会主义服务”的方向。第三，坚持“双百”方针，鼓","励创作自由与艺术理论自由。","第四，丰富文艺为人民服务的内涵，要求文艺满足人民群众日益增长的精神文化需求。","第五，倡导弘扬主旋律与提倡多样化相统一，促进社会主义文艺的繁荣发展。","第六，要求在批判地继承和吸收借鉴的基础上推动文艺创新。","3.习近平新时代中国特色社会主义文艺表述","习近平新时代中国特色社会主义思想体系，是马克思主义中国化的最新成果。将中国特色","社会主义文艺理论推进到一个前所未有的新时代。习近平基于新时代中国文艺发展现状，倡导","文艺创作以人民为中心、铸就文艺高峰、提高文化自信、树立社会主义核心价值观、传承和弘","扬中华美学精神，构筑了一套新时代中国特色社会主义文艺思想的科学体系，是新时代社会主","义文艺工作的理论纲领与行动指南。第一、从新时代中国特色社会主义文化建设的新实践去定","位文艺工作。结合新时代现实条件回应时代新问题并面向未来;另一方面，在世界空间上则既坚","守本民族文化传统，又强调面向世界和各国民族，而非封闭保守。这样在古今中外之间的精准","定位基础上，建设中国特色社会主义的文化与艺术。","","","第二，从实现中华民族伟大复兴中国梦的新高度去理解文艺工作，强化文艺工作的时代使","命。自觉地成为时代风气的先觉者、先行者、先倡者，通过更多有筋骨、有道德、有温度的文","艺作品，书写和记录人民的伟大实践。","第三，强调坚持以人民为中心，创作“三精”统一的文艺作品，筑就文艺高峰。文艺工作","者要坚持为人民服务，为社会主义服务，深入生活，扎根人民，高擎民族精神的火炬，把艺术","理想融入社会主义事业之中。","第四，坚定文化自信，传承和弘扬中华美学精神。要把培育和弘扬社会主义核心价值观作","为根本任务，坚定不移地用中国人独特的思想、情感、审美去创作属于这个时代又有鲜明中国","风格的优秀作品。","第五，坚持百花齐放、百家争鸣，坚持创造性转化、创新性发展。传统文化的传承与弘扬","要符合新时代中华民族伟大复兴文化建设的现实要求，不能泥古不化，而是要辩证发展，对其","进行加工转化、丰富再造，把传承与改造发展相结合，注入新的时代精神，使之成为适应新时","代要求的民族文化。第六，强调艺术理论及文艺评论的重要意义。要以马克思主义文艺理论为","指导，继承创新中国古代文艺批评理论优秀遗产，批判借鉴现代西方文艺理论。","第二节艺术的特性","艺术的特性","艺术是一种社会意识形态，受制于经济基础，具有相对独立性的精神创造领域，它与其他","的社会意识形态形式之间有共通也有区别，艺术具有独特性，其存在方式、发展演变、价值意","义等都有着深刻的特性。这种特性主要体现在三个方面:艺术是一种掌握世界的独特方式，艺术","是一种精神生产，艺术具有审美特性。","一、马克思论“艺术掌握世界的方式”","艺术的掌握是凭借情感、形象、形式和直观，而非依靠概念和逻辑。艺术作为一种掌握世","界的特殊方式，这一论断是马克思对艺术特性与价值的准确概括。艺术之不同于理论、宗教和","实践的掌握世界的方式的主要方面，在于其想象性、典型性和形式性。","第一，想象性。突出地表现在它要求充分发挥艺术家的想象力的创造性作用。想象力是人","类艺术掌握世界的主要能力，也是艺术创作、鉴赏和批评必备的美学前提。艺术活动是一种充","满丰富的想象力及相应的情感色彩的积极创造。例如电影在实拍之前，需要导演充分运用想象","力将文学剧本创作为分镜头脚本，成为拍摄的主要内容。","第二、典型性。艺术作品及其创造的艺术形象，当其成功地在特殊的个别中真实地再现社","会发展的普遍规律时，就具有了典型性。马克思指出，优秀的艺术品除了有合理的结构和感人","的情节外，在“人物个性的描写方面”一定有自己鲜明的特色。恩格斯明确要求好的现实主义","作品除了“细节的真实”外，还要真实地再现“典型环境中的典型人物”。马大三就是艺术形","","","象中的典型，《鬼子来了》中的马大三具有独特的善良与愚昧，胆怯与隐忍的性格，然而这也是","能概括在革命面前，冷漠无知的软弱国民形象，从而更深刻地揭示出当时社会生活的本质和意","义。","第三，形式性。艺术总是通过待定的语言形式来掌握世界的。艺术掌握世界的方式，说到","底需要以艺术语言形式去实现。艺术的形式性，是指艺术具有以语言形式去反映社会生活的特","性。恰恰是在形式与形象的高超把握中，艺术可以直抵对象本质，这种直觉不依赖概念推理，","而是由表面形式直观得来，往往可以达到深刻的洞见。例如电影《八佰》中保卫四行仓库舍命","枪械战斗等历史内容十分感人，但是这些内容如果没有运用管虎导演的IMAX制作、现场实地","搭建原景拍摄等形式以及色彩，光线、音效等视听手法来展现，那么就会极大的损害其丰富的","审美内涵，很难成为现如今精彩的影视作品。","二、艺术生产与艺术消费","（一）艺术生产（见绪论）","（二）艺术消费","艺术消费将传统的艺术欣赏转化为一种与物似的经济消费行为，受到一般经济规律的制约。","一方面，生产决定、引导消费，艺术创作者需要用优秀的艺术作品来为接受者提供精神食粮，","不能一味迎合大众的庸俗趣味。而另一方面，艺术消费会促进艺术生产，为生产提供需求和方","向。","三、艺术的审美特性","马克思建立在唯物史观基础上的艺术观念，并没有忽略艺术的审美特性。艺术的审美特性","是人类审美意识的集中体现，包括在艺术生产和艺术消费过程中所具有的激发情感、创造形象","与形式、获得精神的愉悦与超越的价值。","(一)艺术审美是人类审美经验的集中表现","艺术就是人类有意识地为创造美和欣赏美而进行的活动。在艺术活动中，艺术家的创造力、","想象力、对真善美的体悟和相应的艺术技巧与能力充分发挥，凝结于艺术作品之中；而面对这","一作品的接受者，会被其中的内容、形象、思想和形式打动，激发出自身的审美意识，体会到","精神的愉悦甚至人生的超越感。艺术是人类感受美、创造美和表现美的重要方式，由于人类有","意识的创造，并且可以根据理想来创造，因而艺术可以超越现实的自然和社会，艺术美比自然","和社会现实的美更纯粹、更完满。","(二)情感性是艺术审美特性的根本","情感性指艺术作品中饱含着创作者寄予的丰厚复杂的情感，而接受者则被激发起相应的情","感体验，形成共鸣。","","","情感是创作的动力，带来表达的欲望，才会有作品产生。而接受者与某一艺术作品相遇，","体验到其中的或强烈或复杂的情感，受到陶冶和净化。艺术是个人抒发情感的重要手段，也是","人类进行情感沟通、超越自身情感而了解和同情更广泛的他人情感的重要途径。例如电影《八","佰》，正是管虎导演被中国军队舍命守卫四行仓库的历史故事深深打动，才充满情感的创作出精","彩电影，也正是电影中将士们奋勇拼搏、不怕牺牲的精神情感，感动了所有的观众，使观众们","受到陶冶和净化。","(三)形象与形式是艺术审美特性的来源","艺术的审美特性的达成，不是依靠概念和说理，而是依赖形象的塑造和形式的构造。艺术","家使用在艺术史发展的特定阶段形成的、并带有自己风格的形式语言，这种形象和形式，构成","了艺术作品呈现出来的基本面貌。例如电影《夺冠》中，陈可辛导演用独特的色彩，光线、音","效，构图等视听手法，完美的展现了中国女排的精神形象，也正是这些形式的运用以及形象的","树立极大丰富了电影的审美内涵。","(四)超越的精神内涵是艺术审美的最高价值","形式与形象是艺术作品的较接近外部的层面，思想与精神内涵则是一件作品更内在的层面，","为人们提供超越的精神内涵是艺术美的最高价值。所谓超越，是指艺术可以为接受者提供高于","现实生活与日常情感的更加理想和集中的生活体验和情感体验，提升人的精神境界。例如电影","《肖申克的救赎》能够在二十多年中立足于优秀电影之榜，正是因为其希望与救赎的超越精神","内涵深深打动着一代又一代的观众。","（本章思考一）共鸣","共鸣是指欣赏主体在艺术鉴赏过程中，审美知觉和审美体验的基础上，深深的被艺术作品","所感动，以至于达到物我两忘的境界，共鸣是鉴赏过程中情感，想象等多种心理功能达到最强","烈程度的表现，同时也离不开对作品意蕴深入的感受和理解，因此，共鸣不仅具有艺术鉴赏，","审美心理的各种特征，而且也是艺术鉴赏活动的极致。从创作主体方面来看，艺术家必须将自","己浓烈的思想情感倾注于艺术作品中，作品本身必须在艺术水平和思想内容上是优秀的富有艺","术感染力的。例如，法国作家福楼拜在创造《包法利夫人》时，谈到描写包法利夫人自杀服毒","的时候说到，我自己的嘴里仿佛有了砒霜的味道，仿佛我自己服了毒一样。从鉴赏主体方面来","说，则需要具备相应的艺术修养，人生阅历，一般欣赏主体在作品中人物的生活处境，思想情","感，人生遭遇十分相似的情况下才会发生共鸣。艺术鉴赏中的共鸣，是艺术家通过自己的作品","所传达出的思想情感，强烈的震撼和打动了鉴赏者的心灵，使艺术家心灵和鉴赏者的心灵，使","得艺术家心灵和鉴赏者心灵发生共鸣发生共鸣。","","","第二章艺术的功能（可以背诵彭吉象）","第一节艺术功能理论的回顾（不重要可以看看原书）","第二节艺术的主要功能（包括什么？）","艺术作为人类审美意识的最高表现形式，其多元的功能体现乃是建立在艺术的审美特性基","础上的。讨论艺术的功能，就离不开审美这一前提。在讨论艺术的主要功能时就需用审美这一","核心将这些功能整体地联系起来，即审美认识功能、审美教育功能、审美娱乐功能和审美体验","功能。","一、审美认知功能","审美认知作用主要是指人们通过艺术鉴赏活动，可以更加深刻的认识自然，认识社会，认","识历史，认识人生。","首先，艺术对于社会历史人生具有审美认知功能，中国电影《八佰》主要讲述了中国军人","在只有几百人的军况物资下，奉命守卫四行仓库，从工事防御到自杀式反抗，为中华民族的尊","严而抗争，最终牺牲惨重的故事，该影片展现了抗日时期的民族战争，使观众们对历史有了新","的了解。","其次，对于大致天体小致细胞的自然现象，艺术也同样具有审美认知作用，央视的《走近","科学》充分运用电视艺术手法，将科学知识以生动形象的方式传递给观众。","二、审美教育功能","审美教育功能，主要是指接受者通过艺术作品的欣赏，领略其中展示的真善美，从而潜移","默化地接近、认同甚至激赏这种真善美所汇成的价值与力量，进而得到人生观、世界观和人文","精神的提升和跃迁。审美教育作用主要有以下三个特点。","以情感人，以情感人是艺术教育与其它教育之间最鲜明的区别，艺术作品总是关注着艺术","家的思想情感，通过生动感人的艺术描绘作用于欣赏者的感情，使人受到强烈的感染和熏陶。","在罗中立的《父亲》中，饱含深情地刻画出了中国农民的典型形象，真实的反映了中国农民的","生存状态，在父亲这幅画面前，欣赏者往往会被深深的打动。","潜移默化，艺术作品对人的影响常常是在毫无强制的情况下，使欣赏者不知不觉的受到感","染，心灵得到净化，从屈原的《离骚》路漫漫其修远兮，吾将上下而求索，到北朝民歌《木兰","诗》中，万里赴戎机、关山度若飞，再到杜甫的《春望》，国破山河在，城春草木深，这些诗句，","无不凝聚着强烈的爱国主义精神，这种强烈的感染力，是其他社会意识形态所达不到的。","寓教于乐，强调应当把思想教育融合到艺术审美娱乐之中，人们通过艺术欣赏，不仅可以","满足精神上的审美需要，身心得到休息，而且还可以从中受到教育和启迪，综艺节目《快乐大","","","本营》啊啊啊啊科学实验站板块，利用电视艺术寓教于乐的特点，用轻松娱乐的方式传递科学","知识","三、审美娱乐功能","审美娱乐主要是指通过艺术欣赏活动，使人们的审美需要得到满足，获得精神享受和审美","愉悦，通过阅读作品或观赏演出，使身心得到愉快和休息，在电影《我和我的祖国》中，祖国","70年的壮丽发展，展现在观众面前，使观众得到了精神上的享受和积极的休息，看到祖国的","发展和新技术的应用，使观众受到教育，并有新的精力投入到工作之中。","四、审美体验功能","艺术接受者应当进人艺术家的语言的形式状态中，仿佛自己也经历了艺术家所体会到的那","种从不确定的、压抑的情感再过渡到充分表达后的“轻松自如”的“解救”状态。例如话剧","《万尼亚舅舅》，剧中人物的悲剧命运深深打动了观众，高尔基也在观剧后给契诃夫写信，观众","在哭，演员们也哭，这说明了从一定程度上审美体验，实际上就是在感知的基础上，通过想象","和联想达到一种深刻的情感体验。","1、审美体验","审美体验是整个审美过程的中心环节，指鉴赏主体在审美直觉的基础上，达到艺术审美活","动的高潮阶段，调动再创造的想象力和联想力，激起丰富的情感，设身处地的生活到艺术作品","之中，获得心灵的审美愉悦，把外在的作品中的艺术形象转化为鉴赏者自身的生命活动，它体","现为一种积极的审美再创造活动，获得的是一种情感层次上的审美愉悦。审美体验必须以注意","和感知作为基础，在审美直觉的基础上方能进行，但是审美体验，由于更加侧重于鉴赏者对于","艺术作品的再创造，因此想象联想和情感在其中更加活跃。","审美体验在整个艺术欣赏过程中的重要意义呢?","主要有两重意义(1)客观上形成的主体与客体的关系;(2)这一关系的体验和反映。在原则上，","主体情感体验的内容愈是丰富，其中所反映的各种现实的联系和关系愈是丰富，就愈是有更多","的根据预测到这种情感将会加强，深度变得越来越大”例如对于不了解四行仓库历史的观众来","说，管虎的《八佰》也不过是一部普通的抗日片。","艺术的诸种功能的实现始终是离不开审美的体验过程的。在展开审美认知时，常常会有相","应的表象的再认与联想，但是，离开了审美的体验，这种表象活动的活跃和丰富的程度就会大","打折扣。因为，伴随着情感体验的表象过程。才有可能展示为像西晋陆机在《文赋》中所说的","那样：观古今于须臾，托四海于一瞬。无疑，这才是精彩分呈的审美认知:审美教育如果要做到","潜移默化，真正达到改变和提升人的内心世界的目标，那么，情含其中的感染与感化是题中之","义。审美娱乐功能的展开与实现，同样要呈现为一种放松的心境，而心境就是情感的一种形式。","更为重要的是，通过体验而形成的愉悦影响是一种更为深刻而又持久的效应。","","","第三章艺术创作（两本都有）","第一节艺术创作主体","一、艺术家","通常，人们将长期从事艺术创作并取得较高成就的人称之为“艺术家”。显然，艺术家是","最专业、最典型、最具代表性的艺术创作主体。艺术创作的主体，常常特指艺术家。","二、艺术家是一一个什么样的群体?艺术家有什么样的规定性?合格的艺术家，应该承担","哪些使命与责任?（艺术家的特点）","1、艺术家是优秀作品的创造者。凭借艺术才华，通过创造性劳动，创作、生产优秀的艺","术作品，以满足人们日益增长的精神需求与审美需要，是艺术家的天职。艺术的繁荣、创新需","要艺术家；人民的精神需求、审美需要呼唤艺术家。德艺双馨的艺术家，应该成为时代风气的","先觉者、先行者、先倡者，应该不断超越前人、超越自己、超越同时代的人，应该创造出更多","有筋骨、有道德、有温度的艺术作品来奉献给人民。例如导演陈可辛，在时代的前进与经济的","发展下，他将新思想，新科技，新精神、新个性与自己的作品结合，超越自我，创新作品拍下","了能够代表当今时代精神的影片《夺冠》。","2、艺术家是人类灵魂的工程师。艺术诉诸人类情感，直通人类心灵;艺术具有怡情养心、","铸造灵魂的功能。作为人类灵魂工程师的艺术家，应该具有社会责任感，应该在作品中彰显信","仰之美、崇高之美。例如，画家徐悲鸿的著作《风雨鸡鸣》中，着力刻画了公鸡这一艺术形象，","用这只昂首挺胸站在石头上的引吭长鸣的大公鸡，激发人们的抗日勇气和决心，展现了其强烈","的社会责任感。","3、艺术家是先进文化的传承者、开创者。每一次成功的、精彩的艺术创作，既是对艺术","经典的继承，也是对前人作品的超越;既是对先进文化的传承，也是一个不断求新、求变、求突","破、求发展的过程。例如，电影《误杀》，正是对经典电影《误杀瞒天记》的继承与超越，导演","将电影与色彩，光线、音效等视听手法相结合，极大丰富了审美内涵，突破自己与前辈，才形","成了这种精彩的影视作品。有责任心、使命感的中国艺术家，应当自觉承担弘扬中华优秀传统","文化、投身社会主义精神文明建设的历史使命。","三、人文修养（艺术家的艺术修养）","作为精神产品创造者的艺术家，必须具有较高的人文修养。艺术家的人文修养，内涵虽然","复杂，但人文知识、人文精神和人文情怀一定是其核心。","1、人文知识是人文修养的基础。","","","古今中外的文学知识、历史知识、哲学知识，以及现代政治学、伦理学、社会学、宗教学、","语言学、心理学、法学、美学知识等，是人文知识的主要构成。尽可能多地接触、了解、学习、","掌握人文知识，是艺术家修炼自身、提高人文修养的基础性工程。达·芬奇之所以在绘画艺术中","取得这样巨大的成就，除了优越的艺术天赋、刻苦的技巧训练外，同他渊博的科学文化知识有","很大的关系，他学习数学、透视学、光学等多方面科学文化知识，为后来的艺术创作奠定了广","博的文化基础。","2、人文精神是人文修养的核心。狭义的人文精神，指文艺复兴时期出现的一种思潮。广","义的人文精神指：人类各民族普遍坚持的以人为本的文化传统，其主要内涵是:高度关注人的尊","严、人的价值、人的命运、人的追求、人的创造;以及人类历史上的文化遗产;高度重视人与自然、","人与他人、人与内心的和谐，捍卫每一个人所拥有的生存权、发展权以及追求幸福的权利。例","如电影《辛特勒名单》深刻批评战争对人性的扭曲，表现了那份尚未泯灭的人性，电影呼吁人","们拥有辛特勒这种高尚的道德情操以及人道主义思想，正是导演精准的把握了生生不息的人文","精神，使得该作品经典流传。","3、人文情怀是人文修养在创作中的具体显现。艺术创作离不开情感、情怀。以什么样的","情感、情怀去从事艺术创作，直接关系到艺术作品的品位、品质、品格。人文情怀是人文知识","内化为素质后形成的一-种特殊情感与胸怀，人文情怀也是对于人文精神的固守与坚持。例如话","剧《茶馆》，根据现实生活，塑造丰富的人物性格，把生活的本来面貌呈现在观众面前，这些现","实生活的展现正是老舍博大人文情怀的表现。","心理机制(艺术家的创作心理)。艺术创作的心理机制，既复杂又特殊。集中体现在三种思","维方式、多种心理机制交替使用、互为补充、综合运用上。依据思维的特征，学界通常将人类","的思维分为三种方式：形象思维、抽象思维、灵感思维。（彭吉象）","创作个性(艺术家的创作风格)。创作个性，是艺术家在创作实践中形成并在艺术作品中显","现的相对稳定的性格特征。创作个性是艺术作品具有独创性的内在依据，也是不同的艺术风格","得以形成的必要条件。","创作个性的形成，是以艺术家自我意识的觉醒以及个性的充分发展为前提的。艺术家的创","作个性，必然会在作品中留下痕迹、印记。甚至会影响作品的风格，风貌。艺术家不仅需要具","有创作个性，同时也要承担应尽的社会责任。","四、艺术风格（非重点）","艺术风格形成多样性的原因：艺术风格是指艺术家的创作在总体上表现出来的独特创作个","性与鲜明的艺术特色。（概念）","艺术风格的多样性，首先来自艺术家独特的创作个性，任何一位出色的艺术家，我们都可","以发现它与众不同，具有个性的艺术风格美，一件优秀的艺术作品总是凝聚着艺术家独特的审","美体验和审美情感，带有的主观色彩与艺术追求，体现出艺术家鲜明的创作风格和艺术个性。","","","中国电影《来电狂响》改编自德国电影《完美陌生人》，同内容，同事件的展示，根据国情差异","和导演创作风格差异，《来电狂响》重戏剧冲突并加入了中国社会热点问题等元素，而《完美陌","生人》则重色彩光线等视听效果。经过对比体现了不同导演的艺术个性不同。","艺术风格的形成离不开艺术家独特的人生道路、生活环境、阅历修养和艺术追求。正因为","如此，艺术在创作过程中，从题材的选择到主题的提炼，从艺术结构到艺术语言，都体现出鲜","明的创作个性。也正因为如此，艺术家从艺术体验到艺术构思，直到艺术传达和表现，始终具","有自己独特的审美体验、构思方式和表现角度，从而形成自己的艺术风格。例如导演贾樟柯，","出生于山西汾阳，他在县城生活和在京城求学以追求自我价值实现的过程中，感知了历史转型","时期人们的迷茫、困惑和无所适从。这给了他很大的影响，以至于成为导演以后，他开始以电","影为媒介来考察当代都市普通或边缘人的生活状态，用镜头语言讲述人","在时代浪潮中的变化，关注着生命的卑微与伟大。从而形成了自己独特的风格。艺术风格","的多样性，还来自审美需求的多样化。由于欣赏主体存在着不同的社会层次、文化层次、年龄","层次，属于不同的民族、不同的地区，造成审美需要的千差万别，反过来刺激和推动着不同艺","术风格的形成。例如电视节目的多样化，正因如此产生少儿频道、戏曲频道、法制频道等。","艺术风格的多样性具有鲜明的民族特色和时代特色。中外艺术史上，每个民族的艺术总是","具有某些各自的特征，形成艺术的民族风格；每个时代的艺术也会具有某些不同之处，形成艺","术的时代风格。中西方电影在制作上有很大的差别，欧美有很多科幻片和灾难片，正是来自于","他们内心中的英雄梦。而第五代导演早期作品，例如《大红灯笼高高挂》正是在独特的民族特","色背景下创作的。二战结束后创作出很多关于二战的影片，以《辛德勒名单》最为典型，而如","今和平年代影片中更多是充斥着和平与正能量。","第二节艺术创作方式的特点","一、艺术创作的三个特点","1.原创性，原创性的艺术创作，需要完成两次飞跃:从客观世界到主观世界，从主观世界到","艺术世界。艺术作品的原创，两次飞跃都需亲历。同原创性的艺术创作，需要实现两个转变:将","生活物象转变为主体心象;将主体心象转变成艺术形象。艺术作品的原创，两个转变都需完成。","例如对于电视栏目来说，策划案必须具有原创性，充满新鲜感，并且能够实地操作出成品，才","能够真正吸引观众，赢得收视率。","2.基础性，在综合性艺术品的创作过程中，前期创作的成果，一定是后期制作的依据与","“蓝图”。例如对于一部电影来说，剧本就是整体创作的基础。","3.纯粹性，原创性、基础性的创作，主体性更强，自由度更高，选择性更多，因此也更具","有艺术上的纯粹性。例如曹雪芹写《红楼梦》，批阅十载，增删五次，十年辛苦不寻常。","","","二、艺术制作的三个特点，较之于具有原创性、基础性和纯粹性的艺术创作，艺术制作显","现出以下不同的特点:","依附性，如电影、电视剧、多媒体艺术的后期制作，虽然也具有创造性，虽然也属于艺术","创作的一个重要流程，但必须依据艺术家前期创作的文本而展开，这样的特性便是依附性。","工艺性，是艺术家施展高超技艺的创作环节。以电影制作为例，后期的剪辑、配音、配乐、","光色的调整、动效的处理、片头片尾及字幕的制作等，都需要高科技的支撑，都需要数字技术","的辅佐。","衍生性，精湛的艺术制作，不仅可以圆满实现原初的创作意图，常常可以丰富艺术作品的","内涵，甚至可以提升艺术作品的境界。","三、个体创作","有些艺术类别的创作主体从来就是单个的人，如诗歌、散文、小说、国画、油画、版画、","书法、篆刻等艺术类别的创作，采用的都是个体创作的方式。","更加个性化，所谓“个性化”，是指艺术家的审美追求、艺术观念、个人气质等在个体创","作中得到充分地发挥与彰显。更加风格化，艺术风格，是指艺术家的创作个性、艺术特色、审","美理想等在艺术作品中的总体表现。更具独创性，个体创作的方式，需要面对的制约因素相对","较少。在更加自由的条件下实施的个体创作，通常更具独创性。","四、集体创作","有些艺术门类或艺术品种的创作，单靠个人无法完成，必须集体创作。如歌剧、舞剧、话","剧、戏曲、音乐剧、电影、电视剧的创作主体，都是一个人数众多的团队。集体创作的特点包","括：1.智力上的众筹性。2.才艺上的互补性。3、追求上的磨合性。","五、一度创作与二度创作","作曲家谱曲，属于一度创作，歌唱家、演奏家依据曲谱演唱或演奏，便是二度创作。编剧","创作剧本，属于一度创作，演员按照剧本的要求进行表演，也属于二度创作。二度创作的特点：","1、呈现性、凝固在文本中的人物与故事必须经过演员呈现，才能传达给观众。2、再创性、演","员的呈现，虽然是依据剧本进行的。但人们之所以把这一行为称为“二度创作\"，是因为其中","蕴含着丰富的创造性。3、多样性，依据同一个剧本，不同的演员处理往往是不一样的，甚至会","出现很大的差别，一定会融入艺术家自身鲜明的艺术个性。","","","第三节艺术创作过程（可彭吉象）","一、艺术创作","艺术创作的过程，是艺术家的情感思绪、审美意象、创作意图从混沌到清晰、从朦胧到具","体的过程，也是艺术作品的构成要素、创作方法、表现手段从杂乱到有序、从候选到确定的过","程。一般说来，艺术创作的过程都要经历动因萌发、构思谋划、物化传达这样三个主要的阶段。","艺术创作活动是人类特有的一种高级的复杂的精神活动与实践活动，他是指艺术家在创作","欲望的推动下，运用一定的艺术与手法技巧，通过艺术加工和创作，将自己的生活体验与思想","情感转化为具体生动可感的艺术形象，将自己的审美意识物态化为艺术作品。","1、艺术创作的动因","指艺术家的创作内驱力。没有动因便没有创作。动因不足，也出不了好作品。动因形成的","基础，创作动因来源于社会生活。艺术家对于社会生活的体验与积累，是创作动因形成的基础。","艺术家如果没有充分的体验与丰厚的积累，不可能形成创作动因。","积累分为被动的与主动的两种。被动的积累，指艺术家的生活经历，在脑海中自然而然留","下的记忆、印象和感受。例如，高尔基的自传体小说三部曲，就是以作者本人青少年时期的亲","身经历为素材，也是那段饱受苦难的亲身生活经历，激发出作者不可遏制的创作冲动和欲望。","职业的、高产的、全能型、的艺术家，则必须主动投身火热的社会生活，自觉体验、主动积累。","例如，著名剧作家老舍在谈到创作《青年突击队》失败的原因时，指出自己的错误在于以写作","的热情代替了生活的积累。","社会生活是艺术创作的唯一源泉。深入基层、扎根人民、投身火热的社会实践是艺术创","作的逻辑起点。","2、动因萌发，是指创作激情忽然涌动、创作欲望突然升腾的一种心理状态。首先，一个","发现，一个捕获，常常会触发创作激情、创作欲望。例如托尔斯泰在家乡听到检察官讲述了一","个贵族青年对一个青年女仆始乱终弃的故事，诱发了他的创作冲动与灵感，完成了长篇小说","《复活》其次，一次感动，一次顿悟，往往会引发创作激情、创作欲望。例如电影《八佰》","的导演管虎，正是被“四行仓库”这一段历史所感动，而引发了创作的欲望。最后，一种需求、","一种外力，也会激发创作激情、创作欲望。例如当今时代，爱国主义精神高涨，人们急切需要","爱国类型的艺术作品，于是电影《我和我的祖国》应运而生。","二、艺术构思","指艺术家在创作动因的驱使下，依据自我秉承的创作观念，运用不同艺术类别各自拥有的","创作方法、技法，营造审美意象，酝酿、谋划新作品的思维过程。具体说来，需要完成三项任","务:圈定题材,题材是依据一定的标准对社会生活的领域加以分类。例如，依据历史时期，可以分","为历史题材、现代题材、当代题材，等等;确定话题,艺术家在构思阶段需要确定一部作品的话题。","","","话题是艺术品的最初形态。这样几条原则:1.选择自身最熟悉的话题，只有选择自己最熟悉的话","题展开创作活动，才有望出精品。例如，严歌苓根据自己40年前在文工团的经历，充满情感的","写出了《芳华》，后来与导演一同发挥想象创造力，添加了一些虚构的情节，更加丰富了电影内","容，创造出了电影《芳华》。2.选择观众最关心的话题，一般说来，能够传达大众心声、维护大","众利益、愉悦大众身心的话题，是观众最关心的话题之列。例如电影《我不是药神》，将人们关","心的医药热点问题展现出来，并促进了医药的社会改革，成功的追踪了社会热点。3.选择某种","艺术媒介最适合表述的话题，在构思的过程中，理当扬长避短。艺术家应充分考虑不同艺术门","类的特性与属性，充分考虑不同的艺术媒介在表述上的优越性、可行性和不可替代性。4.选择","最有创作冲动与创作欲望的话题对于艺术作品的主创人员来说，强烈的创作欲望、持续的创作","冲动，是克服重重困难的动力，是进入创作佳境的必要条件。例如电影《无极》，尽管面临观众","不理解，投资商要放弃的重大困难，但是凭借导演的强烈创作欲望，依旧坚持创作完成。完成","几个定位，在构思谋划阶段，艺术家还需完成受众的定位，作品类型的定位，创作风格的定位","等等。","三、物化","所谓“物化”，指艺术家借助选定的物质材料、艺术媒介，运用艺术技巧、创作手法，将","构思谋划阶段形成的审美意象、艺术构想物态化，使之成为可供欣赏的艺术品。","(一)深入认知艺术媒介","艺术媒介是把艺术构思落到实处进而形成艺术作品的物质基础，艺术家必须对自己所使用。","例如，作曲家必须对所有乐器的音域、音色、性能甚至演奏枝法了然于心。","(二)熟练驾驭语言系统","不同门类的艺术家，使用的大多为不同类别的语言系统。电影家使用的是音像语言系统，","书法家使用的是笔墨语言系统，对于品种繁多的艺术语言系统，艺术作品的创造者，不仅要有","全面的认知，而且要能熟练掌控、自如驾驭。","(三)灵活运用表达规范","长期的艺术实践，使得艺术表达形成了许多规范。如叙事艺术讲究文字的起、承、转、合","一气呵成;戏曲艺术讲究演员的唱、念、做、打，搭配有序;电影艺术讲究镜头的推、拉、摇、移，","有机结合。","四、素材","所谓素材，就是被艺术家从社会生活中避选出来、剥离出来、囤积起来等待加工的原材料。","素材经过初步加工，就成了创作题材;而题材经过更加精细的加工，就成为作品了。","","","第四章艺术作品（两本都有）","一、艺术作品","艺术作品，又称“艺术品”，指的为是在艺术生产过程中中所形成的成果或产品,即艺术家","在艺术构思的基础之上，运用一定的物质媒介进行艺术创作，从而将思维中所形成的审美意象","物态化，创造出来的主客体相统一的审美鉴赏对象。","第一节、艺术作品的媒介","在一般意义上，任何艺术作品都是物态化的存在，艺术家的艺术体验、艺术构思以及艺术","传达都需要以一定的媒介作为依托，对艺术作品的接受与消费也有赖于媒介而得以实现。艺术","媒介，是指在艺术活动的总体过程中，艺术家将内在艺术构思外化为艺术作品并对其进行展示、","传播的具有独特性的承载物质、材料以及符号体系。如果从艺术学的角度进行划分，艺术作品","的媒介又可分为物质材料媒介与艺术语言媒介。","一、艺术媒介的类别。","只有具备物质材料，才有可能顺利完成审美意象的物态化，才能生产制造出客观存在的艺","术作品。艺术活动离不开一定的艺术语言媒介，例如电影语言中的画面、声音、蒙太奇等。各","个类型的艺术作品所运用的物质材料与艺术语言都不尽相同，都有各自不同的特点，形成了各","自独特的制作方法和表现手段，这使得艺术媒介在艺术的实践活动中具有重要的意义。","（一）、物质材料媒介","艺术感兴的物质材料媒介","艺术制作的物质材料媒介","艺术传播的物质材料媒介","（二）艺术语言媒介","1、艺术语言","是作品外在的形式结构，是由文字，声音，线条，色彩，画面等构成的层次，任何一门艺","术都有自己独特的表现方式和手段，运用独特的物质媒介来进行艺术创作，从而使得这门艺术","具有自己独特的美学特性和艺术特征，各门艺术都有自己独特的艺术语言，例如绘画语言包括","线条，色彩，构图等，电影语言包括画面，声音，蒙太奇等，艺术语言不但是创造艺术形象的","表现手段，而且本身就具有审美价值，艺术语言更重要的作用还是创造艺术形象。","二、艺术媒介的作用","","","艺术作品的媒介在艺术创作、传播与接受的总体过程中，处于相对基础却又必须存在的一","个环节。艺术媒介在区分艺术作品的类型、建构艺术作品的形式与生成艺术作品的内容方面都","起到了十分重要的作用。","（一）艺术媒介与艺术作品的类型区分","艺术媒介在艺术作品的类型区分方面具有明确的物质表征作用。中国绘画的笔多按动物毛","的长短不一一排列为“尖头”，而西方绘画的笔则将动物毛取齐排列为“平头”，不同艺术作","品的类型，往往还需要物质材料媒介与艺术语言媒介双方向的规约才能够实现区分。例如，电","影和戏剧都依靠导演和演员以及剧本等媒介构成，但二者各有规定，电影需要运用摄影机进行","拍摄，然后播放给观众，而戏剧则需要依靠舞台来，直接将表演与故事展现给观众。","（二）艺术媒介与艺术作品的形式建构","艺术媒介在艺术作品的形式建构方面具有显著的物质依托作用。例如，对于一位伟大的导","演来说，表演、色彩、线条、构图不只是他技术手段的一个部分，它们也是创造过程本身的必","要因素。从艺术媒介对艺术作品形式建构所起到的作用来看，种族、环境、时代是决定艺术发","展的三个重要原则，这是由于“所谓的艺术的民族性，或民族艺术，并形成了一种独特的民族","文化心理结构，产生出具有独特特色的艺术”。例如《大红灯笼高高挂》正是在独特的民族特","色背景下创作的。艺术媒介还具有一定的时代特色，并由此影响了艺术形式，二战结束后创作","出很多关于二战的影片，以《辛德勒名单》最为典型，而如今和平年代影片中更多是充斥着和","平与正能量。","（三）艺术媒介与艺术作品的内容生成","艺术媒介在艺术作品的内容生成方面具有重要的物质载体作用。例如，正是因为光学、电","学、声学、化学、机械学等各门科学技术的迅速发展，才使电影得以在1895年诞生。此后电","影发展史上的三次重大变革，也均与科学技术有着密不可分的联系。","1、电影发展史上的三次重大变革","一次大变革是从无声到有声。","最初的电影都是无声电影，被称为“默片”。一般认为，有声电影诞生的标志，是1927","年美国的《爵士歌王》，从此，电影由纯视觉艺术成为视听综合艺术，音乐、音响和人声都成为","电影重要的艺术元素，大大丰富了自身的表现力。中国第一部有声片是1931年的《歌女红牡","丹》。","第二次大变革是从黑白到彩色，最初的电影都是黑白片，1935年，使用彩色胶片拍摄的
